    </button>`;
  };

  const drawRows = () => {
    const shown = shownPlays();
    const list = shown.filter(p => libMatch(p, libF)).sort(byCat);
    const lib = document.getElementById("lib");
    // nothing to show at all is not a filter that matched nothing: every
    // shipped play is hidden and there is none of his own yet
    lib.innerHTML = list.length
      ? list.map(rowHTML).join("")
      : !shown.length
      ? `<div class="lempty" id="lnone">Every shipped play is hidden and you have not drawn one
           of your own yet. <button class="fchip" id="lnonew">New play</button></div>`
      : `<div class="lempty">No plays match.
           <button class="fchip" id="lclear">Clear filters</button></div>`;
    lib.scrollTop = 0;
    document.getElementById("lcount").textContent = deck.length + " in your deck";
    const pack = packOf();
    const away = hidden.size ? ` ${hidden.size} shipped play${hidden.size === 1 ? " is" : "s are"} hidden
      &mdash; Setup &rarr; Your own shows ${hidden.size === 1 ? "it" : "them"} again.` : "";
    document.getElementById("lnote").innerHTML = (list.length !== shown.length
      ? `Showing ${list.length} of ${shown.length} plays.`
      : pack
      ? `<b>${esc(pack.name)}.</b> ${esc(blurbOf(pack))}`
      : `Tap to add or remove. Keep the deck small &mdash; four plays you can find
         without looking beats ${shown.length} you have to hunt through.`) + away;
    const none = document.getElementById("lnonew");
    if (none) none.onclick = () => pickFormation();
    // after layout settles — row width can still change as the list reflows
    fitNames();
    requestAnimationFrame(fitNames);
    const clear = document.getElementById("lclear");
    if (clear) clear.onclick = () => {
      libF = {q:"", kind:"all", cat:"all", deckOnly:false};
      drawFilters(); drawRows();
    };
    lib.querySelectorAll("[data-ren]").forEach(e => {
      // a coach's own play has no shipped name to rename away from: its
      // pencil opens the drawing, names and all
      const open = ev => { ev.stopPropagation(); ev.preventDefault();
                           const id = e.dataset.ren;
                           if (designs[id]) openDesigner(id);
                           else openRename(id, () => { drawCounts(); drawRows(); }); };
      e.addEventListener("click", open);
      e.addEventListener("keydown", ev => {
        if (ev.key === "Enter" || ev.key === " ") open(ev);
      });
    });
    lib.querySelectorAll("[data-prev]").forEach(e => {
      const open = ev => { ev.stopPropagation(); ev.preventDefault(); openPreview(e.dataset.prev); };
      e.addEventListener("click", open);
      e.addEventListener("keydown", ev => {
        if (ev.key === "Enter" || ev.key === " ") open(ev);
      });
    });
    lib.querySelectorAll(".lrow").forEach(b => b.addEventListener("click", ev => {
      if (ev.target.closest("[data-ren]")) return;   // the pencil, not the row
      if (ev.target.closest("[data-prev]")) return;  // the picture, not the row
      const id = b.dataset.id;
      if (deck.includes(id)) deck = deck.filter(x => x !== id);
      else deck.push(id);
      saveDeck(); logEvent("deck_changed", {deck: deck.slice()});
      drawCounts(); drawRows();
    }));
  };

  // counts only — never rebuilds the search box, so typing keeps focus
  const drawCounts = () => {
    const f = document.getElementById("lfilt");
    if (!f) return;
    const set = (sel, n) => { const e = f.querySelector(sel + " .n"); if (e) e.textContent = n; };
    set('[data-kind="all"]',  libCount({kind:"all"}));
    set('[data-kind="run"]',  libCount({kind:"run"}));
    set('[data-kind="pass"]', libCount({kind:"pass"}));
    set('#lonly', deck.length);
    CAT_ORDER.forEach(k => set(`[data-cat="${CSS.escape(k)}"]`, libCount({cat:k})));
    f.querySelectorAll("[data-kind]").forEach(b =>
      b.classList.toggle("on", b.dataset.kind === libF.kind));
    f.querySelectorAll("[data-cat]").forEach(b =>
      b.classList.toggle("on", b.dataset.cat === libF.cat));
    const only = document.getElementById("lonly");
    if (only) only.classList.toggle("on", libF.deckOnly);
    drawPacks();
  };

  /* Play packs: the saved decks a coach starts from — Week 1, Week 2 — each
     one a whole game deck on its own. Taking a pack REPLACES the
     deck, the same way a sync import does and for the same reason: the point
     is a deck somebody chose, not a merge nobody did. So it arms on the first
     tap like everything else that throws a choice away. A pack whose plays
     this library does not have is not offered at all — a deck with holes in
     it is worse than no pack. The strip is rebuilt only when the deck changes,
     so an armed chip survives until it lapses or is taken.

     Save deck and Rename run the other way: the coach's deck, or his name,
     goes INTO a week. Each is the same two taps — the verb, then the week —
     and while a verb is armed the strip wears a label saying which question it
     is asking, so the second tap cannot be mistaken for taking a pack. At rest
     the strip has no label: the chips are the weeks, and a coach who has seen
     "Week 1" once does not need a heading over it again. A mode lapses on its
     own like an armed button does. */
  let mode = "", modeTimer = 0;                 // "" | "save" | "rename"
  const packs = () => packsNow().filter(k => k.plays.every(knownPlay));
  // an empty week is a slot, not a deck: it is never "the deck you have", even
  // when the deck is empty too
  const packOf = () => packs().find(k => k.plays.length && sameDeck(k.plays, deck)) || null;
  const blurbOf = k => k.mine ? "Your own deck, saved on this tablet." : k.blurb;
  const drawPacks = () => {
    const el = document.getElementById("packs");
    if (!el) return;
    const list = packs(), cur = packOf(), isCur = k => !!cur && cur.id === k.id;
    const saving = mode === "save", renaming = mode === "rename";
    el.hidden = !list.length;
    el.classList.toggle("saving", saving);
    el.classList.toggle("renaming", renaming);
    el.innerHTML = (mode ? `<span class="plab">${saving ? "Save into" : "Rename"}</span>` : "") + list.map(k =>
      `<button class="pack ${isCur(k) ? "on" : ""} ${k.mine ? "mine" : ""} ${k.plays.length ? "" : "empty"}" id="pack-${k.id}"
         data-pack="${k.id}" title="${esc(blurbOf(k))}">${k.mine ? `<span class="pmark">&#9998;</span>` : ""}${esc(k.name)}<span class="n">${k.plays.length}</span></button>`).join("") +
      // an empty deck has nothing to keep, and saving it would only empty a week
      `<button class="pack pverb psave ${saving ? "on" : ""}" id="psave"
         ${deck.length || saving ? "" : "disabled"}>${saving ? "Cancel" : "Save deck"}</button>` +
      `<button class="pack pverb ${renaming ? "on" : ""}" id="prename">${renaming ? "Cancel" : "Rename"}</button>`;
    document.getElementById("psave").onclick = () => setMode(saving ? "" : "save");
    document.getElementById("prename").onclick = () => setMode(renaming ? "" : "rename");
    for (const k of list){
      if (saving){
        document.getElementById("pack-" + k.id).onclick = () => {
          setPack(k.id, deck);
          logEvent("deck_pack_saved", {pack: k.id, deck: deck.slice()});
          setMode(""); drawRows();
        };
      } else if (renaming){
        document.getElementById("pack-" + k.id).onclick = () => {
          setMode("");
          openPackRename(k.id, () => { drawPacks(); drawRows(); });
        };
      } else if (!k.plays.length){
        // nothing to take: say what the slot is for instead of emptying the deck
        document.getElementById("pack-" + k.id).onclick = () => {
          document.getElementById("lnote").innerHTML = `<b>${esc(k.name)} is empty.</b> Build a deck,
            then tap Save deck and ${esc(k.name)} to keep it here.`;
        };
      } else if (!isCur(k)){                    // already the deck: nothing to take
        confirmTap("pack-" + k.id, () => {
          deck = k.plays.slice(); saveDeck();
          logEvent("deck_pack", {pack: k.id, deck: deck.slice()});
          drawCounts(); drawRows();
        });
      }
    }
  };
  const setMode = m => {
    clearTimeout(modeTimer); mode = m;
    if (m) modeTimer = setTimeout(() => { mode = ""; drawPacks(); }, 6000);
    drawPacks();
  };

  const drawFilters = () => {
    const f = document.getElementById("lfilt");
    f.innerHTML = libFilterHTML();
    const q = document.getElementById("lq");
    q.addEventListener("input", () => { libF.q = q.value; drawCounts(); drawRows(); });
    f.querySelectorAll("[data-kind]").forEach(b => b.onclick = () => {
      libF.kind = b.dataset.kind; drawCounts(); drawRows(); });
    f.querySelectorAll("[data-cat]").forEach(b => b.onclick = () => {
      libF.cat = b.dataset.cat; drawCounts(); drawRows(); });
    document.getElementById("lonly").onclick = () => {
      libF.deckOnly = !libF.deckOnly; drawCounts(); drawRows(); };
  };

  app.innerHTML = `
    <div class="deck">
      <div class="deckhead">
        <h1>Play Library<span class="fmt" id="lfmt">${esc(DATA.label.toUpperCase())}</span></h1>
        <div class="dh-right">
          <p id="lcount"></p>
          <button class="edit" id="lnew">New play</button>
          <button class="edit done" id="done">Done</button>
        </div>
      </div>
      <div class="lfilt" id="lfilt"></div>
      <div class="packs" id="packs"></div>
      <div class="lib" id="lib"></div>
      <div class="decknote" id="lnote"></div>
    </div>`;
  document.getElementById("done").onclick = renderDeck;
  document.getElementById("lnew").onclick = () => pickFormation();
  drawFilters(); drawPacks(); drawRows();
  if (welcome === true) openLibraryWelcome();
}

/* -------------------------------------------------------- play designer
   A coach's screen, for the kitchen table before practice, never for the
   sideline: so it can ask for care (drag to the half yard, tap each point of
   a route) that the deck never could. It starts from one of the four
   formations and lets anyone go anywhere legal, because trick plays live
   outside the formations. Three tools, one at a time — MOVE a kid, draw a
   ROUTE for him, give someone the BALL — and the picture is the real field,
   the real markers and the real names, drawn by buildScene()/frame() exactly
   as the play screen draws them, with the drawing laid over it.

   Every change compiles the design into a real play and runs the checker on
   it, so the strip under the field always says what a coach has to fix, and
   Save stays shut until there is nothing. What it saves is the drawing; see
   compileDesign() for why. */
let DZ = null;

function pickFormation(){
  closeRename();
  const w = document.createElement("div");
  w.className = "sheetwrap";
  w.id = "fmsheet";
  w.innerHTML = `
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="fmtitle">
      <h2 id="fmtitle">New play &middot; start from</h2>
      <div class="fmpick">${formationsHere().map(f => `
        <button class="fmbtn" data-fm="${esc(f)}">
          ${thumbSVG({spots: FORMATIONS[f], paths: [], jobs: [], primary: "", ball: {mode: "carry"}})}
          <b>${esc(f)}</b></button>`).join("")}</div>
      <p class="sheetnote">Where everybody starts. Once you are in, drag anyone anywhere &mdash;
        a kid keeps his name wherever he stands, and his job says where to line up.</p>
      <div class="sheetbtns"><button class="sbtn" id="fm-cancel">Cancel</button></div>
    </div>`;
  document.body.appendChild(w);
  w.addEventListener("click", e => { if (e.target === w) w.remove(); });
  w.addEventListener("keydown", e => { if (e.key === "Escape"){ e.stopPropagation(); w.remove(); } });
  document.getElementById("fm-cancel").onclick = () => w.remove();
  w.querySelectorAll("[data-fm]").forEach(b => b.onclick = () => {
    w.remove(); openDesigner(null, b.dataset.fm); });
}

// a new drawing from a formation, or a working copy of one of the coach's plays
function openDesigner(id, base){
  closeRename();
  const src = id ? designs[id] : null;
  if (id && !src) return;
  const d = src ? JSON.parse(JSON.stringify(src)) : {
    id: null, v: DESIGN_V, base, spots: {}, routes: {}, ball: null, coachName: "", kidName: "",
    tagline: "", category: "CUSTOM", complexity: "simple", created: 0};
  if (!src) for (const k of Object.keys(FORMATIONS[base]))
    d.spots[k] = [FORMATIONS[base][k].x, FORMATIONS[base][k].y];
  DZ = {d, id, tool: "route", sel: null, armed: false, handing: false, drag: null, preview: false, dirty: false,
        mode: d.ball ? d.ball.mode : "pass", msg: "", findings: []};
  logEvent("designer_open", {play: id || "new", base: d.base});
  renderDesigner();
}

function renderDesigner(){
  S.screen = "designer"; S.solo = null; S.stage = "lineup";
  mTarget = mAnim = 0;                 // the designer never mirrors: it is drawn one way
  app.innerHTML = `
    <div class="play designer">
      <div class="bar">
        <button class="back" id="dz-back">&larr; Library</button>
        <div class="titlewrap">
          <span class="kid" id="dz-title"></span>
          <span class="coach" id="dz-fm"></span>
        </div>
        <div class="barright">
          <button class="edit" id="dz-reset">Start over</button>
          <button class="edit done" id="dz-save">Save</button>
        </div>
      </div>
      <div class="stagewrap">
        <div class="fieldwrap">
          <svg id="field" viewBox="0 0 ${VB_W} ${vbH()}" preserveAspectRatio="xMidYMid meet"></svg>
          <div class="hint" id="dz-hint"></div>
        </div>
        <div class="rail dzrail" id="dz-rail"></div>
      </div>
      <div class="dzline" id="dz-line"></div>
      <div class="calls" id="dz-calls"></div>
    </div>`;
  const back = document.getElementById("dz-back");
  // throwing a drawing away is two taps, like every other button that loses work
  back.onclick = () => {
    if (!DZ.dirty || back.dataset.armed){ DZ = null; renderLibrary(); return; }
    back.dataset.armed = "1"; back.textContent = "Discard?";
    setTimeout(() => {
      if (back.isConnected){ delete back.dataset.armed; back.innerHTML = "&larr; Library"; }
    }, 2500);
  };
  document.getElementById("dz-save").onclick = openDesignSheet;
  // A drawing gone wrong goes back to the formation it started from — every
  // kid on his spot, no routes, nobody with the ball — without leaving the
  // screen. The names and the filing stay: they describe the play, not the
  // mess. Two taps, like everything else that throws work away.
  confirmTap("dz-reset", () => {
    const d = DZ.d, base = FORMATIONS[d.base];
    for (const k of Object.keys(base)) d.spots[k] = [base[k].x, base[k].y];
    d.routes = {}; d.ball = null;
    Object.assign(DZ, {sel: null, armed: false, handing: false, drag: null, preview: false,
                       tool: "route", mode: "pass", msg: "Back to " + d.base + ". Everybody is on his spot."});
    // a new play started over is a new play again; a saved one has changed
    DZ.dirty = !!DZ.id;
    // done, so the button stops asking and can go quiet with nothing left to undo
    const b = document.getElementById("dz-reset");
    delete b.dataset.armed; b.textContent = "Start over";
    logEvent("designer_restart", {play: DZ.id || "new", base: d.base});
    dzRefresh();
  });
  const svg = document.getElementById("field");
  svg.addEventListener("pointerdown", dzDown);
  svg.addEventListener("pointermove", dzMove);
  svg.addEventListener("pointerup", dzUp);
  svg.addEventListener("pointercancel", dzUp);
  dzRefresh();
}

/* ---- yards under a finger, and the half-yard grid everything lands on */
function dzYards(e){
  const m = document.getElementById("field").getScreenCTM();
  if (!m) return null;
  const q = new DOMPoint(e.clientX, e.clientY).matrixTransform(m.inverse());
  return [(q.x - CX) / SCALE, TOPY - q.y / SCALE];
}
const snapHalf = v => Math.round(v * 2) / 2;
// a kid lines up between the sidelines, on or behind the line, and no deeper
// than the play screen shows whole; anyone close to the line is on it
function clampSpot(q){
  const x = Math.max(-15, Math.min(15, snapHalf(q[0])));
  let y = Math.max(FIELD_BOT, Math.min(0, snapHalf(q[1])));
  if (y > -0.75) y = 0;
  return [x, y];
}
const clampRoute = q => [Math.max(-15.5, Math.min(15.5, snapHalf(q[0]))),
                         Math.max(FIELD_BOT, Math.min(18, snapHalf(q[1])))];
// whoever throws a pass throws from behind the line, so his line cannot be
// drawn past it — the THROWER rolling out, or the kid he gave it to; on a
// keeper the THROWER is a ball carrier like any other
const clampFor = (key, q) => {
  const at = clampRoute(q), b = DZ.d.ball;
  if (!(b && b.mode === 'carry') && key === (b && b.via ? b.via[0] : 'QB')) at[1] = Math.min(at[1], 0);
  return at;
};
/* How close a tap has to be to count as landing on something. Picking a kid
   is generous, because a kid is all there is to tap. While a leg is being
   drawn the field is what a coach is aiming at, so a tap only lands on a
   marker if it is really on it. The dotted ring that starts a leg is tapped
   inside what is drawn, and RING_KID / RING_END are its drawn radii in
   yards — a hit area wider than anything on screen is what once made the
   first point of a route a hunt for the edge of an invisible circle. */
const HIT_PICK = 1.25, HIT_ON = 0.7, HIT_POINT = 0.6;
const RING_KID = 34 / SCALE, RING_END = 26 / SCALE;
const dzRingAt = q => ydist(q, dzRouteEnd()) < (DZ.d.routes[DZ.sel] ? RING_END : RING_KID);
function dzKidAt(q, within){
  let best = null;
  for (const k of Object.keys(DZ.d.spots)){
    const g = ydist(q, DZ.d.spots[k]);
    if (g < within && (!best || g < best.g)) best = {k, g};
  }
  return best && best.k;
}
function dzPointAt(q){
  const r = DZ.sel && DZ.d.routes[DZ.sel];
  if (!r) return -1;
  let best = -1, bg = HIT_POINT;
  r.pts.forEach((p, i) => { const g = ydist(q, p); if (g < bg){ bg = g; best = i; } });
  return best;
}
// where the next leg starts: the end of his route, or the kid himself
const dzRouteEnd = () => {
  const r = DZ.d.routes[DZ.sel];
  return r ? r.pts[r.pts.length - 1] : DZ.d.spots[DZ.sel];
};
// on a handoff or a pitch the thrower's line is the exchange, drawn for him;
// on a pass he can roll out, and on a keeper he carries it
const carriersOf = d => d.ball && d.ball.mode === "carry" ? [...(d.ball.via || []), d.ball.who] : [];
const handsOff = d => !!d.ball && (d.ball.mode === "carry" ? !carriersOf(d).includes("QB") : !!d.ball.via);
const VIA_CAP = 2;                       // three carriers: a pitch, a reverse, and a double

function dzDown(e){
  if (!DZ) return;
  if (DZ.preview){ dzPreview(false); return; }       // a tap on the running play goes back to drawing
  const q = dzYards(e);
  if (!q) return;
  const d = DZ.d, kid = dzKidAt(q, DZ.armed ? HIT_ON : HIT_PICK), svg = document.getElementById("field");
  DZ.msg = "";
  const grab = drag => { DZ.drag = drag; try { svg.setPointerCapture(e.pointerId); } catch(x){} };
  if (DZ.tool === "move"){
    if (kid === "C") DZ.msg = "The snapper is always on the ball. Move everybody else.";
    else if (kid) grab({kind: "kid", key: kid});
  } else if (DZ.tool === "route"){
    /* One leg at a time, and only on purpose. Tapping inside the dotted ring
       — round the kid, or on the end of his route — starts a leg; the next
       tap is where it ends, and then he is back to just picked, with the ring
       on the new end. So a coach can pick somebody else without a leg
       chasing his finger across the field. A press in the ring that drags
       pulls a first leg straight out of the kid, or moves the end point. */
    const pick = k => {
      if (k === "QB" && handsOff(d))
        DZ.msg = d.ball.mode === "pass"
          ? "The thrower gives it away on this one, and the exchange is drawn for you. To draw him " +
            "a rollout, Take back the handoff so he throws it himself."
          : "On a handoff the thrower's job is the exchange, and it is drawn for you. To draw " +
            "him a rollout make it a pass, or a keeper: Ball, then Run, then tap him.";
      else { DZ.sel = k; DZ.armed = false; }
    };
    if (!DZ.sel){
      if (kid) pick(kid);
      else DZ.msg = "Tap a player first, then the dotted circle to draw his route.";
    } else if (DZ.armed){
      if (dzRingAt(q)) DZ.armed = false;             // the ring again: never mind
      else if (kid && kid !== DZ.sel) pick(kid);
      else {
        const r = d.routes[DZ.sel] || {pts: [], end: "arrow"};
        if (r.pts.length >= ROUTE_CAP) DZ.msg = "That is as many points as one route takes.";
        else {
          d.routes[DZ.sel] = r;
          r.pts.push(clampFor(DZ.sel, q)); DZ.dirty = true; DZ.armed = false;
          grab({kind: "pt", key: DZ.sel, i: r.pts.length - 1});   // and drag it into place
        }
      }
    } else if (dzRingAt(q)) grab({kind: "ring", key: DZ.sel, at: q});
    else {
      const at = dzPointAt(q);
      if (at >= 0) grab({kind: "pt", key: DZ.sel, i: at});
      else if (kid && kid !== DZ.sel) pick(kid);
      else if (kid !== DZ.sel) DZ.msg = "Tap the dotted circle to draw his next leg, or tap another player.";
    }
  } else if (DZ.tool === "ball" && kid){
    const chain = carriersOf(d), passer = d.ball && d.ball.mode === "pass" && d.ball.via ? d.ball.via[0] : null;
    if (DZ.handing && DZ.mode === "pass"){
      // the kid the THROWER hands or pitches it to, who then throws it himself
      if (kid === "QB") DZ.msg = "The thrower is giving it away. Tap the kid who takes it and throws.";
      else if (kid === d.ball.who) DZ.msg = "He is the one it is thrown to. Tap somebody else to throw it to him.";
      else {
        d.ball = {mode: "pass", who: d.ball.who, via: [kid]};
        if (DZ.handing === "pitch") d.ball.pitch = true;
        DZ.handing = false; DZ.dirty = true;
        if (DZ.sel === "QB") DZ.sel = null;
      }
    } else if (DZ.handing){
      // the next carrier of a reverse: somebody who has not had it yet, and
      // never back to the THROWER, who only ever starts a chain
      if (kid === "QB") DZ.msg = "The thrower can start a run but cannot take it back. Tap a runner.";
      else if (chain.includes(kid)) DZ.msg = "He already has had the ball. Tap somebody who has not.";
      else {
        d.ball = {mode: "carry", who: kid, via: chain};
        DZ.handing = false; DZ.dirty = true;
      }
    } else if (kid === "QB" && DZ.mode === "pass")
      DZ.msg = passer ? "The thrower has given it away. Tap the kid who catches it."
                      : "On a pass the thrower throws it. Tap the kid who catches it.";
    else if (kid === passer)
      DZ.msg = `${FORMATIONS[d.base][kid].name} throws it. Tap the kid who catches it.`;
    else if (!(d.ball && d.ball.who === kid && d.ball.mode === DZ.mode)){
      // a new carrier starts a new chain; tapping the one who has it changes
      // nothing. On a pass a new receiver is only a new target: whoever
      // throws it still does.
      const keep = passer && DZ.mode === "pass" ? {via: [passer], pitch: d.ball.pitch} : {};
      d.ball = {mode: DZ.mode, who: kid};
      if (keep.via) d.ball.via = keep.via;
      if (keep.pitch) d.ball.pitch = true;
      DZ.dirty = true;
    }
  }
  dzRefresh();
}
function dzMove(e){
  if (!DZ) return;
  const q = dzYards(e);
  if (!q) return;
  if (!DZ.drag){ dzNextLeg(q); return; }
  const d = DZ.d, g = DZ.drag;
  if (g.kind === "ring"){
    // a press in the ring that turns into a drag: the end point moves, or a
    // first leg comes out of the kid
    if (ydist(q, g.at) < 0.75) return;
    const r = d.routes[g.key] || (d.routes[g.key] = {pts: [], end: "arrow"});
    if (!r.pts.length) r.pts.push(clampFor(g.key, q));
    Object.assign(g, {kind: "pt", i: r.pts.length - 1});
  }
  if (g.kind === "kid"){
    const was = d.spots[g.key], now = clampSpot(q);
    if (now[0] === was[0] && now[1] === was[1]) return;
    // his route comes with him: moving a kid is not a reason to redraw his job
    const r = d.routes[g.key];
    if (r) r.pts = r.pts.map(p => clampFor(g.key, [p[0] + now[0] - was[0], p[1] + now[1] - was[1]]));
    d.spots[g.key] = now;
  } else {
    const r = d.routes[g.key], now = clampFor(g.key, q), was = r.pts[g.i];
    if (now[0] === was[0] && now[1] === was[1]) return;
    r.pts[g.i] = now;
  }
  DZ.dirty = true;
  dzRefresh();
}
function dzUp(){
  if (!DZ || !DZ.drag) return;
  const g = DZ.drag;
  DZ.drag = null;
  if (g.kind === "ring") DZ.armed = true;           // a tap in the ring, not a drag: draw a leg
  dzRefresh();
}
/* A pointer that can hover (a mouse, a pen) sees the leg it is drawing
   before it commits to it: a dashed line from the end of the route to where
   the tap would land. Only while a leg is being drawn — a picked kid with no
   leg started has nothing to follow the pointer. Drawn in place, without a
   refresh. */
function dzNextLeg(q){
  const ghost = document.getElementById("dz-next");
  if (!ghost) return;
  const on = DZ.tool === "route" && DZ.sel && DZ.armed && !DZ.preview && !dzRingAt(q)
          && !dzKidAt(q, HIT_ON);
  ghost.setAttribute("opacity", on ? 1 : 0);
  if (on) ghost.setAttribute("points", [dzRouteEnd(), clampFor(DZ.sel, q)].map(fpt).join(" "));
}

function dzPreview(on){
  DZ.preview = on && !!DZ.d.ball;
  S.t0 = performance.now();
  dzRefresh();
}

/* Everything on the screen comes from one compile: the field (through the
   real buildScene), the drawing over it, the checker's verdict and the call
   strip the kids will see. */
function dzRefresh(){
  const d = DZ.d, p = compileDesign(d, 0);
  S.play = p;
  S.tl = p.primary ? buildTimeline(p) : {paths: [], tSnap: HOLD, tEnd: 1, ball: {}};
  S.stage = DZ.preview ? "run" : "lineup";
  buildScene();
  DZ.findings = checkPlay(p);
  dzOverlay(p);
  dzRail();

  const errs = DZ.findings.filter(f => f.level === "error");
  const warns = DZ.findings.filter(f => f.level === "warning");
  const line = document.getElementById("dz-line");
  line.className = "dzline " + (DZ.msg ? "note" : errs.length ? "err" : warns.length ? "warn" : "ok");
  line.textContent = DZ.msg ? DZ.msg
    : errs.length ? `${errs.length} to fix before it saves: ${errs[0].msg}` +
                    (errs.length > 1 ? ` (and ${errs.length - 1} more)` : "")
    : warns.length ? `Ready to save, but: ${warns[0].msg}` +
                     (warns.length > 1 ? ` (and ${warns.length - 1} more)` : "")
    : "Ready to save.";
  document.getElementById("dz-calls").innerHTML = callsHTML(p.calls, false);
  const save = document.getElementById("dz-save");
  save.disabled = errs.length > 0;
  // nothing to start over from: every kid on his spot, no routes, no ball
  const base = FORMATIONS[d.base];
  const reset = document.getElementById("dz-reset");
  if (!reset.dataset.armed)
    reset.disabled = !d.ball && !Object.keys(d.routes).length &&
      Object.keys(base).every(k => d.spots[k][0] === base[k].x && d.spots[k][1] === base[k].y);
  document.getElementById("dz-title").textContent = d.coachName || "New play";
  document.getElementById("dz-fm").textContent = p.formation;
  const hint = document.getElementById("dz-hint");
  hint.textContent = DZ.preview ? "Tap the field to go back to drawing"
    : DZ.tool === "move" ? "Drag a player to where he lines up"
    : DZ.tool === "ball" && DZ.handing && DZ.mode === "pass"
      ? `Tap the kid the thrower ${DZ.handing === "pitch" ? "pitches" : "hands"} it to · he throws it to ${S.play.spots[DZ.d.ball.who].name}`
    : DZ.tool === "ball" && DZ.handing ? `Tap the kid ${S.play.spots[DZ.d.ball.who].name} hands it to`
    : DZ.tool === "ball" ? (DZ.mode === "pass" ? "Tap the kid the ball is thrown to"
                                               : "Tap the kid who carries it")
    : DZ.sel && DZ.armed ? "Tap where this leg ends · tap the circle again to cancel"
    : DZ.sel ? (DZ.d.routes[DZ.sel] ? "Tap the dotted circle for another leg · drag a point to move it"
                                    : "Tap the dotted circle to start his route")
    : "Tap a player, then tap the field to draw his route";
  hint.style.opacity = 1;
}

// the drawing, laid between the field paint and the players
function dzOverlay(p){
  const svg = document.getElementById("field"), d = DZ.d;
  const g = mk("g", {id: "dz-over"});
  const firstKid = SC.players[Object.keys(SC.players)[0]];
  svg.insertBefore(g, firstKid ? firstKid.g : null);
  if (DZ.preview) return;                         // the play draws itself
  const line = (pts, attrs) => g.appendChild(mk("polyline", Object.assign({
    points: pts.map(fpt).join(" "), fill: "none",
    "stroke-linejoin": "round", "stroke-linecap": "round"}, attrs)));
  const hot = new Set(DZ.findings.filter(f => f.level === "error").flatMap(f => f.keys));
  for (const path of p.paths){
    const drawn = !!d.routes[path.who] || path.type !== "route";
    if (path.type === "handoff")
      line(path.pts, {stroke: "#5B6472", "stroke-width": 6, "stroke-dasharray": "13 9",
                      "marker-end": "url(#a-handoff)"});
    else if (!drawn)                               // the default rule, shown as a ghost
      line(path.pts, {stroke: "#9AA59D", "stroke-width": 4, "stroke-dasharray": "4 10", opacity: .9});
    else {
      const col = path.type === "run" ? "#127A4D" : "#232B26";
      line(path.pts, Object.assign({stroke: col, "stroke-width": path.type === "run" ? 8 : 6},
        path.end === "bar" ? {} : {"marker-end": `url(#a-${path.type})`}));
      if (path.end === "bar"){
        const n = path.pts.length, a = path.pts[n-2], b = path.pts[n-1];
        const dx = b[0]-a[0], dy = b[1]-a[1], len = Math.hypot(dx, dy) || 1;
        const nx = -dy/len*0.45, ny = dx/len*0.45;
        const s1 = F2S(b[0]-nx, b[1]-ny), s2 = F2S(b[0]+nx, b[1]+ny);
        g.appendChild(mk("line", {x1: s1[0], y1: s1[1], x2: s2[0], y2: s2[1], stroke: col,
          "stroke-width": 6, "stroke-linecap": "round"}));
      }
    }
  }
  const arc = throwArc(p);
  if (arc) line(throwPts(arc), {stroke: "#5B6472", "stroke-width": 6, "stroke-dasharray": "13 9",
                                "marker-end": "url(#a-handoff)"});
  for (const k of hot){
    if (!d.spots[k]) continue;
    const c = F2S(d.spots[k][0], d.spots[k][1]);
    g.appendChild(mk("circle", {cx: c[0], cy: c[1], r: 24, fill: "none", stroke: "#C0392B",
      "stroke-width": 4, "stroke-dasharray": "7 6"}));
  }
  if (DZ.tool === "route" && DZ.sel){
    const c = F2S(d.spots[DZ.sel][0], d.spots[DZ.sel][1]);
    g.appendChild(mk("circle", {cx: c[0], cy: c[1], r: 26, fill: "rgba(27,94,58,.12)",
      stroke: "#1B5E3A", "stroke-width": 4}));
    const r = d.routes[DZ.sel];
    if (r) r.pts.forEach((q, i) => {
      const s = F2S(q[0], q[1]);
      g.appendChild(mk("circle", {cx: s[0], cy: s[1], r: i === r.pts.length - 1 ? 10 : 7.5,
        fill: "#fff", stroke: "#1B5E3A", "stroke-width": 4, class: "dzpt"}));
    });
    // the next leg starts here, said with a ring rather than left for a coach
    // to guess at: dotted and pulsing while it is waiting to be tapped, solid
    // while a leg is being drawn. Its radius is its hit area — see RING_KID.
    const e = F2S(...dzRouteEnd());
    g.appendChild(mk("circle", {cx: e[0], cy: e[1], r: (r ? RING_END : RING_KID) * SCALE,
      fill: DZ.armed ? "rgba(27,94,58,.16)" : "rgba(27,94,58,.05)", stroke: "#1B5E3A",
      "stroke-width": DZ.armed ? 4 : 3, "stroke-dasharray": DZ.armed ? "" : "6 6",
      class: DZ.armed ? "dznext armed" : "dznext"}));
    g.appendChild(mk("polyline", {id: "dz-next", fill: "none", stroke: "#1B5E3A",
      "stroke-width": 4, "stroke-dasharray": "8 8", "stroke-linecap": "round", opacity: 0}));
  }
}

function dzRail(){
  const d = DZ.d, t = DZ.tool, rail = document.getElementById("dz-rail");
  const tool = (k, label, small) =>
    `<button class="rbtn ${t === k && !DZ.preview ? "on" : ""}" data-tool="${k}">${label}<small>${small}</small></button>`;
  let sub = "";
  if (t === "route" && DZ.sel){
    const r = d.routes[DZ.sel], stop = !!r && r.end === "bar";
    sub = `<button class="rbtn sub" id="dz-undo" ${r ? "" : "disabled"}>Undo<small>last point</small></button>
      <button class="rbtn sub" id="dz-clear" ${r ? "" : "disabled"}>Clear<small>back to GO</small></button>
      <button class="rbtn sub" id="dz-end" ${r ? "" : "disabled"}>${stop ? "Stop" : "Arrow"}<small>${stop
        ? "turns around" : "keeps going"}</small></button>`;
  } else if (t === "ball"){
    const run = !!d.ball && d.ball.mode === "carry", via = d.ball ? (d.ball.via || []) : [];
    sub = `<button class="rbtn sub ${DZ.mode === "pass" ? "on" : ""}" data-mode="pass">Pass<small>throw it</small></button>
      <button class="rbtn sub ${DZ.mode === "carry" ? "on" : ""}" data-mode="carry">Run<small>hand it off</small></button>` +
      // a reverse: the kid with the ball hands it on to somebody else
      (run ? `<button class="rbtn sub ${DZ.handing ? "on" : ""}" id="dz-hand"
               ${via.length >= VIA_CAP ? "disabled" : ""}>Hand off<small>to another runner</small></button>
             <button class="rbtn sub" id="dz-unhand" ${via.length ? "" : "disabled"}>Take back<small>last handoff</small></button>`
      // a trick pass: the THROWER hands or pitches it to somebody who throws
      // it. One exchange, so once it is made the two buttons become one
      : DZ.mode === "pass" && via.length
        ? `<button class="rbtn sub" id="dz-unhand">Take back<small>the ${d.ball.pitch ? "pitch" : "handoff"}</small></button>`
      : DZ.mode === "pass"
        ? `<button class="rbtn sub ${DZ.handing === "hand" ? "on" : ""}" id="dz-hand" ${d.ball ? "" : "disabled"}>Hand off<small>he throws it</small></button>
           <button class="rbtn sub ${DZ.handing === "pitch" ? "on" : ""}" id="dz-pitch" ${d.ball ? "" : "disabled"}>Pitch<small>he throws it</small></button>`
      : "");
  }
  rail.innerHTML = tool("move", "Move", "drag kids") + tool("route", "Route", "draw a job") +
    tool("ball", "Ball", "who gets it") + (sub ? `<span class="rsep"></span>${sub}` : "") +
    `<span class="rsep"></span><button class="rbtn ${DZ.preview ? "on" : ""}" id="dz-prev"
       ${d.ball ? "" : "disabled"}>${DZ.preview ? "Stop" : "Preview"}<small>${DZ.preview
       ? "back to drawing" : "run it"}</small></button>`;
  rail.querySelectorAll("[data-tool]").forEach(b => b.onclick = () => {
    DZ.tool = b.dataset.tool; DZ.msg = ""; DZ.preview = false; DZ.armed = false; DZ.handing = false;
    dzRefresh(); });
  rail.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => {
    DZ.mode = b.dataset.mode; DZ.msg = ""; DZ.handing = false;
    if (d.ball){
      // a pass to the thrower is not a play; a keeper that becomes a pass loses
      // its carrier, and a reverse that becomes a pass keeps only its last man.
      // A trick pass that becomes a run loses its thrower and keeps its target.
      if (DZ.mode === "pass" && d.ball.who === "QB") d.ball = null;
      else if (d.ball.mode !== DZ.mode){ d.ball.mode = DZ.mode; delete d.ball.via; delete d.ball.pitch; }
      DZ.dirty = true;
    }
    if (handsOff(d) && DZ.sel === "QB") DZ.sel = null;
    dzRefresh();
  });
  const on = (id, act) => { const b = document.getElementById(id);
    if (b) b.onclick = () => { act(); DZ.dirty = true; DZ.msg = ""; DZ.armed = false; dzRefresh(); }; };
  on("dz-undo", () => { const r = d.routes[DZ.sel]; r.pts.pop(); if (!r.pts.length) delete d.routes[DZ.sel]; });
  on("dz-clear", () => { delete d.routes[DZ.sel]; });
  on("dz-end", () => { const r = d.routes[DZ.sel]; r.end = r.end === "bar" ? "arrow" : "bar"; });
  for (const [id, kind] of [["dz-hand", "hand"], ["dz-pitch", "pitch"]]){
    const b = document.getElementById(id);
    if (b) b.onclick = () => { DZ.handing = DZ.handing === kind ? false : kind; DZ.msg = ""; dzRefresh(); };
  }
  on("dz-unhand", () => {
    // on a pass the target stays and the THROWER throws it again; on a run
    // the last carrier goes and the one before him keeps it
    const via = d.ball.via;
    if (d.ball.mode === "carry") d.ball.who = via.pop(); else via.length = 0;
    if (!via.length){ delete d.ball.via; delete d.ball.pitch; }
    DZ.handing = false;
  });
  document.getElementById("dz-prev").onclick = () => dzPreview(!DZ.preview);
}

/* The names and the filing, asked once at the end rather than up front: a
   coach knows what he drew before he knows what to call it. The second place
   in the app a coach types, so it goes through the same tidy-and-escape. */
function openDesignSheet(){
  closeRename();
  const d = DZ.d, run = !!d.ball && d.ball.mode === "carry";
  // a handoff or a pitch in the no-run zone is a dead ball, even ahead of a throw
  const zoneOut = run || handsOff(d);
  if (zoneOut && d.category === "NO-RUN ZONE") d.category = "CUSTOM";
  const w = document.createElement("div");
  w.className = "sheetwrap";
  w.id = "dzsheet";
  w.innerHTML = `
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="dztitle">
      <h2 id="dztitle">${DZ.id ? "Save changes" : "Save your play"} &middot; ${run ? "Run" : "Pass"}
        &middot; ${esc(S.play.formation)}</h2>
      <label class="nfield"><span>Real name</span>
        <input id="dz-real" type="text" maxlength="${NAME_CAP}" value="${esc(d.coachName)}"
          autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false"></label>
      <label class="nfield"><span>Fun name</span>
        <input id="dz-fun" type="text" maxlength="${NAME_CAP}" value="${esc(d.kidName)}"
          autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false"></label>
      <div class="nfield"><span>Situation</span>
        <div class="seg wrap" id="dz-cat">${CAT_ORDER.map(k => `<button data-cat="${esc(k)}"
          class="${d.category === k ? "on" : ""}" style="--cat:${CAT[k]}"
          ${zoneOut && k === "NO-RUN ZONE" ? "disabled" : ""}>${esc(k)}</button>`).join("")}</div></div>
      <div class="nfield"><span>How much it asks</span>
        <div class="seg" id="dz-cx">${Object.keys(COMPLEXITY).map(k => `<button data-cx="${k}"
          class="${d.complexity === k ? "on" : ""}">${k}</button>`).join("")}</div></div>
      <label class="nfield"><span>One line for the tile</span>
        <input id="dz-tag" class="plain" type="text" maxlength="${TAG_CAP}" value="${esc(d.tagline)}"
          placeholder="Optional" autocomplete="off"></label>
      <p class="sheetnote" id="dz-note">Kept on this tablet and through every update. Sync tablets
        in Setup carries it to an assistant's.</p>
      <div class="sheetbtns">
        ${DZ.id ? `<button class="sbtn" id="dz-del">Delete</button>` : ""}
        <button class="sbtn" id="dz-cancel">Cancel</button>
        <button class="sbtn go" id="dz-ok">Save</button>
      </div>
    </div>`;
  document.body.appendChild(w);
  const pickOne = (sel, key) => w.querySelectorAll(sel).forEach(b => b.onclick = () => {
    w.querySelectorAll(sel).forEach(x => x.classList.toggle("on", x === b));
    d[key] = b.dataset[key === "category" ? "cat" : "cx"];
  });
  pickOne("[data-cat]", "category");
  pickOne("[data-cx]", "complexity");
  const close = () => w.remove();
  w.addEventListener("click", e => { if (e.target === w) close(); });
  w.addEventListener("keydown", e => {
    if (e.key === "Escape"){ e.stopPropagation(); close(); }
    if (e.key === "Enter" && e.target.tagName === "INPUT") save();
  });
  const save = () => {
    const real = tidyName(document.getElementById("dz-real").value);
    if (!real){
      document.getElementById("dz-note").innerHTML = "<b>Give it a real name first</b> &mdash; it is how you will find it.";
      document.getElementById("dz-real").focus();
      return;
    }
    d.coachName = real;
    d.kidName = tidyName(document.getElementById("dz-fun").value);
    d.tagline = tidyText(document.getElementById("dz-tag").value, TAG_CAP);
    const fresh = !DZ.id;
    if (fresh){ d.id = newPlayId(); d.created = Date.now(); }
    // through the same door a file from another tablet comes through
    const clean = saneDesign(d);
    if (!clean) return;
    designs[clean.id] = clean; saveDesigns(); refreshPlays();
    // a coach drew it to use it, so a new play goes straight into the deck
    if (fresh && !deck.includes(clean.id)){ deck.push(clean.id); saveDeck(); }
    logEvent(fresh ? "play_designed" : "play_redesigned",
             {play: clean.id, base: clean.base, name: clean.coachName});
    close(); DZ = null; renderLibrary();
  };
  document.getElementById("dz-ok").onclick = save;
  document.getElementById("dz-cancel").onclick = close;
  if (DZ.id) confirmTap("dz-del", () => {
    logEvent("play_deleted", {play: DZ.id});
    deleteDesign(DZ.id); close(); DZ = null; renderLibrary();
  });
  const first = document.getElementById("dz-real");
  first.focus(); first.select();
}

/* ------------------------------------------------------------ play ui */
function openPlay(id){
  S.screen = "play"; S.play = DATA.plays.find(p => p.id === id); S.tl = buildTimeline(S.play);
  S.openedAt = performance.now();
  logEvent("play_opened", {play: id, num: S.play.num, name: coachNameOf(S.play)});
  // It opens on the finished play — every route drawn, the ball where it
  // ends up — because that is the picture a coach turns around to show. It
  // is the last frame of the run, held: Line up goes back to the spots, and
  // Run it and Replay play it once from the snap.
  S.stage = "run"; S.t0 = performance.now() - S.tl.tEnd; S.solo = null; S.running = false;
  mTarget = mAnim = 0;
  const p = S.play;
  app.innerHTML = `
    <div class="play" style="--cat:${CAT[p.category]}">
      <div class="bar">
        <button class="back" id="back">&larr; Deck</button>
        <div class="titlewrap">
          <span class="kid">${esc(nameOf(p).big)}</span>
          ${nameOf(p).small ? `<span class="coach">${esc(nameOf(p).small)}</span>` : ""}
        </div>
        <div class="barright">${clockHTML()}<span class="chip">${esc(p.formation)}</span></div>
      </div>
      <div class="stagewrap">
        <div class="fieldwrap">
          <svg id="field" viewBox="0 0 ${VB_W} ${VB_H}" preserveAspectRatio="xMidYMid meet"></svg>
          <div class="hint" id="hint">Tap a player to show him his job</div>
        </div>
        <div class="rail">
          <button class="rbtn" id="stage"></button>
          <button class="rbtn" id="mirror">Mirror<small>swap sides</small></button>
          <button class="rbtn" id="replay">Replay</button>
        </div>
      </div>
      <div class="calls" id="calls"></div>
    </div>`;
  document.getElementById("back").onclick = () => {
    logEvent("play_closed", {play: S.play.id,
      dwellMs: Math.round(performance.now() - S.openedAt), mirrored: mTarget === 1});
    renderDeck();
  };
  bindClock();
  document.getElementById("stage").onclick = toggleStage;
  document.getElementById("mirror").onclick = () => {
    mTarget = mTarget ? 0 : 1; if (REDUCED) mAnim = mTarget; syncRail();
    logEvent("mirror", {play: S.play.id, on: mTarget === 1}); };
  document.getElementById("replay").onclick = () => { S.stage = "run"; S.t0 = performance.now(); syncRail(); };
  buildScene();
  renderCalls();
  syncRail();
  fitNames();
}

function toggleStage(){
  if (S.stage === "lineup"){
    S.stage = "run";
    S.t0 = performance.now();
    logEvent("play_run", {play: S.play.id, mirrored: mTarget === 1});
  } else {
    S.stage = "lineup";
  }
  S.solo = null;
  renderCalls(); syncRail();
}
function syncRail(){
  const st = document.getElementById("stage");
  const run = S.stage === "run";
  st.className = "rbtn go";
  st.innerHTML = run ? "Line up<small>back to spots</small>" : "Run it<small>animate</small>";
  document.getElementById("mirror").classList.toggle("on", mTarget === 1);
  document.getElementById("replay").classList.toggle("hidden", !run);
  const h = document.getElementById("hint");
  if (h) h.style.opacity = S.hintSeen ? 0 : 1;
}

function renderCalls(){
  const el = document.getElementById("calls");
  const p = S.play;
  if (S.solo){
    el.innerHTML = `<div class="solo"><b style="color:${SIDE[sideOf(S.solo)]}">${esc(sideName(S.solo))}</b>
      <span>${esc(mirrored() ? swapWords(p.assign[S.solo]) : p.assign[S.solo])}</span></div>
      <button class="rbtn" style="flex:0 0 90px" id="unsolo">All<small>everyone</small></button>`;
    document.getElementById("unsolo").onclick = () => { S.solo = null; renderCalls(); };
    return;
  }
  el.innerHTML = callsHTML(p.calls, mirrored());
}
function callsHTML(calls, flip){
  return calls.map(([a0, b0]) => {
    const a = flip ? swapWords(a0) : a0, b = flip ? swapWords(b0) : b0;
    const side = /BLUE/.test(a) ? "blue" : /ORANGE/.test(a) ? "orange" : "";
    const job = a !== "EVERYONE ELSE";
    return `<div class="call ${side} ${job ? "job" : ""}"><b>${esc(a)}</b><span>${esc(b)}</span></div>`;
  }).join("");
}

/* ------------------------------------------------------------ scene */
const N = "http://www.w3.org/2000/svg";
let SC = null;
let fieldRO = null;
function mk(tag, attrs){
  const e = document.createElementNS(N, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
const LBL = () => dzView() ? 13.5 : 17;         // the names under the markers
function buildScene(){
  const svg = document.getElementById("field");
  svg.innerHTML = "";
  const defs = mk("defs");
  [["route","#232B26"],["run","#127A4D"],["motion","#C9700D"],["handoff","#5B6472"],
   ["fake","#127A4D"]].forEach(([k,c]) => {
    const m = mk("marker",{id:"a-"+k,viewBox:"0 0 10 10",refX:8.4,refY:5,markerWidth:5,
      markerHeight:5,orient:"auto-start-reverse"});
    m.appendChild(mk("path",{d:"M0 0 L10 5 L0 10 z",fill:c}));
    defs.appendChild(m);
  });
  // Out of bounds is hatched on both sides, but the hatch carries the side's
  // colour so the dark border itself says BLUE or ORANGE. The base square stays
  // exactly --oob so the strip never seams against the page behind the field.
  [["blue","#31496A"],["orange","#6B4525"]].forEach(([side,ink]) => {
    const hp = mk("pattern",{id:"oob-"+side,width:14,height:14,
      patternUnits:"userSpaceOnUse"});
    hp.appendChild(mk("rect",{width:14,height:14,fill:"#1E2521"}));
    hp.appendChild(mk("path",{d:"M0 0 L14 14 M14 0 L0 14",
      stroke:ink,"stroke-width":2.2,"stroke-linecap":"round"}));
    defs.appendChild(hp);
  });
  svg.appendChild(defs);

  SC = {washL:null, washR:null, yard:[], side:{}, los:null, paths:[], players:{},
        ball:null, ballAng:0, overX:0, overY:0};

  // How far the letterbox reaches past the viewBox, in viewBox units. Measured
  // on resize rather than per frame — getBoundingClientRect forces layout.
  const measure = () => {
    const b = svg.getBoundingClientRect();
    const h = vbH(), k = Math.min(b.width / VB_W, b.height / h);
    if (!k || !isFinite(k)) return;
    SC.overX = Math.max(0, (b.width / k - VB_W) / 2);
    SC.overY = Math.max(0, (b.height / k - h) / 2);
  };
  measure();
  if (window.ResizeObserver){
    if (fieldRO) fieldRO.disconnect();
    fieldRO = new ResizeObserver(measure);
    fieldRO.observe(svg);
  }

  SC.base = mk("rect",{fill:"#F7F9F6"});
  svg.appendChild(SC.base);
  SC.oob = {};
  ["blue","orange"].forEach(side => {
    const g = mk("g"); g.style.cursor = "pointer";
    const r = mk("rect",{fill:"url(#oob-"+side+")"});
    // dominant-baseline:central is what actually centres these. The text is
    // rotated 90°, so the baseline runs vertically and the glyphs would
    // otherwise hang off one side of the anchor point instead of straddling it.
    const lbl = mk("text",{"text-anchor":"middle","dominant-baseline":"central",
      "font-size":15,"font-weight":700,
      fill:side === "blue" ? "#7E8B9C" : "#948375","letter-spacing":3.5,
      "font-family":"Barlow Condensed, Arial Narrow, sans-serif"});
    lbl.textContent = "OUT OF BOUNDS";
    const badge = mk("rect",{rx:7,fill:"#F2F4F1",stroke:"#5C665F","stroke-width":1.5});
    const btxt = mk("text",{"text-anchor":"middle","dominant-baseline":"central",
      "font-size":16,"font-weight":700,fill:"#141A16",
      "letter-spacing":2.2,"font-family":"Barlow Condensed, Arial Narrow, sans-serif"});
    g.appendChild(r); g.appendChild(lbl); g.appendChild(badge); g.appendChild(btxt);
    g.addEventListener("click", () => { setOurSide(side); logEvent("our_side", {side}); });
    svg.appendChild(g);
    SC.oob[side] = {g, r, lbl, badge, btxt};
  });
  SC.goal = mk("polygon",{fill:"#1B5E3A","fill-opacity":.14});
  SC.goalT = mk("text",{"text-anchor":"middle","font-size":30,"font-weight":700,
    fill:"#1B5E3A","letter-spacing":6,
    "font-family":"Barlow Condensed, Arial Narrow, sans-serif"});
  SC.goalT.textContent = "GOAL";
  SC.washL = mk("polygon",{fill:"#1D6FD0","fill-opacity":.075});
  SC.washR = mk("polygon",{fill:"#E4610F","fill-opacity":.075});
  svg.appendChild(SC.washL); svg.appendChild(SC.washR);
  svg.appendChild(SC.goal); svg.appendChild(SC.goalT);

  [5,10].forEach(() => { const l = mk("line",{stroke:"#C8D0C9","stroke-width":2,
    "stroke-dasharray":"7 9"}); SC.yard.push(l); svg.appendChild(l); });
  SC.los = mk("line",{stroke:"#8A948C","stroke-width":4}); svg.appendChild(SC.los);
  SC.side.blue = mk("line",{stroke:"#1D6FD0","stroke-width":11,"stroke-linecap":"round"});
  SC.side.orange = mk("line",{stroke:"#E4610F","stroke-width":11,"stroke-linecap":"round"});
  svg.appendChild(SC.side.blue); svg.appendChild(SC.side.orange);

  const p = S.play;
  p.paths.forEach((path, i) => {
    const g = {};
    const col = {route:"#232B26",run:"#127A4D",motion:"#C9700D",handoff:"#5B6472",
                 fake:"#127A4D"}[path.type];
    g.line = mk("polyline",{fill:"none",stroke:col,
      "stroke-width": path.type === "run" ? 8 : 6,
      "stroke-linejoin":"round","stroke-linecap":"round",
      "stroke-dasharray": (path.type === "motion" ? "16 11" : path.type === "handoff" ? "13 9"
                          : path.type === "fake" ? "17 11" : "")});
    if ((path.end || "arrow") !== "bar") g.line.setAttribute("marker-end", `url(#a-${path.type})`);
    else g.bar = mk("line",{stroke:col,"stroke-width":6,"stroke-linecap":"round"});
    svg.appendChild(g.line); if (g.bar) svg.appendChild(g.bar);
    SC.paths.push(g);
  });
  // The throw. A handoff already leaves a dashed grey line behind the ball, so
  // a pass leaves the same one: one picture for "this is where the ball goes",
  // whether it is handed or thrown. It draws out under the ball as it flies
  // and stays put after the catch, because the ball alone was too easy to
  // miss on a screen with six routes on it.
  SC.throw = null;
  if (p.ball.mode !== "carry"){
    SC.throw = mk("polyline",{fill:"none",stroke:"#5B6472","stroke-width":6,
      "stroke-linejoin":"round","stroke-linecap":"round","stroke-dasharray":"13 9",
      "marker-end":"url(#a-handoff)",opacity:0});
    svg.appendChild(SC.throw);
  }

  for (const key in p.spots){
    const sp = p.spots[key];
    const g = mk("g");
    g.style.cursor = "pointer";
    const halo = mk("circle",{r:33,fill:"none",stroke:"#FFC400","stroke-width":5,opacity:0});
    // shape carries the role, so identity does not depend on reading a letter
    const role = sp.name === "SNAPPER" ? "snap" : sp.name === "THROWER" ? "throw"
               : sp.name === "BACK" ? "back" : "wr";
    const shape = role === "wr" ? mk("circle",{r:12.5})
                : mk(role === "snap" ? "rect" : "polygon", {});
    shape.setAttribute("stroke-width", 4);
    // No letters on the markers, in either stage. "W" and "SN" mean nothing to
    // a 7-year-old — he knows he is WIDE BLUE. Shape says what kind of job,
    // colour says which side, and the words underneath say it out loud.
    // paint-order:stroke draws the halo behind the glyphs, so a route line
    // running under a name does not turn it to mush
    const lbl = () => mk("text",{"text-anchor":"middle","font-weight":800,"font-size":LBL(),
      "font-family":"Barlow Condensed, Arial Narrow, sans-serif","letter-spacing":.6,
      "paint-order":"stroke", stroke:"#F7F9F6", "stroke-width":3.5,
      "stroke-linejoin":"round"});
    const l1 = lbl(), l2 = lbl();
    g.appendChild(halo); g.appendChild(shape);
    g.appendChild(l1); g.appendChild(l2);
    g.addEventListener("click", () => {
      if (S.screen === "designer") return;   // the designer reads its own taps
      S.hintSeen = true;
      S.solo = (S.solo === key) ? null : key;
      if (S.solo) logEvent("solo", {play: S.play.id, spot: key,
                                    name: S.play.spots[key].name});
      renderCalls(); syncRail();
    });
    svg.appendChild(g);
    SC.players[key] = {g, shape, halo, l1, l2, role};
  }

  // A football, not a yellow dot, and it points where it is going. The only job
  // this marker has is telling six seven-year-olds where the ball ends up, and
  // they already know what a football looks like.
  SC.ball = mk("g");
  SC.ball.appendChild(mk("path",{d:BALL_BODY,fill:BALL_FILL,stroke:BALL_EDGE,
    "stroke-width":3,"stroke-linejoin":"round"}));
  SC.ball.appendChild(mk("path",{d:BALL_LACES,fill:"none",stroke:BALL_LACE,
    "stroke-width":3,"stroke-linecap":"round"}));
  svg.appendChild(SC.ball);
}

/* ------------------------------------------------------------ frame */
function frame(now){
  requestAnimationFrame(frame);
  paintClock();
  const onField = S.screen === "play" || S.screen === "designer"
               || (S.screen === "tour" && tourFieldOn);
  if (!onField || !SC) return;

  const k = REDUCED ? 1 : 0.085;
  const wasMirrored = mAnim > 0.5;
  mAnim += (mTarget - mAnim) * k;
  if (Math.abs(mTarget - mAnim) < 0.001) mAnim = mTarget;
  if ((mAnim > 0.5) !== wasMirrored) renderCalls();

  const p = S.play, tl = S.tl;
  const running = S.stage === "run";
  // The play screen runs a play once and holds the last frame; Replay is
  // there for another look. The tutorial and the designer's preview loop,
  // because nobody is standing there to press it.
  const t = !running ? 0 : S.screen === "play" ? Math.min(now - S.t0, tl.tEnd)
                         : (now - S.t0) % tl.tEnd;

  // field
  const bot = fieldBot(), VBH = vbH();
  const bt = F2S(-EDGE, 15), bb = F2S(EDGE, bot);
  SC.base.setAttribute("x", bt[0]); SC.base.setAttribute("y", bt[1]);
  SC.base.setAttribute("width", bb[0] - bt[0]); SC.base.setAttribute("height", bb[1] - bt[1]);
  const half = [[-EDGE,bot],[0,bot],[0,15],[-EDGE,15]];
  SC.washL.setAttribute("points", half.map(fpt).join(" "));
  SC.washR.setAttribute("points", half.map(q => fpt([-q[0], q[1]])).join(" "));
  SC.goal.setAttribute("points",
    [[-EDGE,13.3],[EDGE,13.3],[EDGE,15],[-EDGE,15]].map(fpt).join(" "));
  const gt = F2S(0, 14.15);
  SC.goalT.setAttribute("x", gt[0]); SC.goalT.setAttribute("y", gt[1] + 10);
  [5,10].forEach((yv, i) => {
    const a = F2S(-EDGE, yv), b = F2S(EDGE, yv);
    SC.yard[i].setAttribute("x1",a[0]); SC.yard[i].setAttribute("y1",a[1]);
    SC.yard[i].setAttribute("x2",b[0]); SC.yard[i].setAttribute("y2",b[1]);
  });
  const la = F2S(-EDGE,0), lb = F2S(EDGE,0);
  SC.los.setAttribute("x1",la[0]); SC.los.setAttribute("y1",la[1]);
  SC.los.setAttribute("x2",lb[0]); SC.los.setAttribute("y2",lb[1]);
  [["blue",-EDGE],["orange",EDGE]].forEach(([nm,xv]) => {
    const a = F2S(xv,bot), b = F2S(xv,15), e = SC.side[nm];
    e.setAttribute("x1",a[0]); e.setAttribute("y1",a[1]);
    e.setAttribute("x2",b[0]); e.setAttribute("y2",b[1]);
  });
  // out-of-bounds strips, sideline labels, parents badge
  [["blue",-1],["orange",1]].forEach(([nm,dir]) => {
    const o = SC.oob[nm];
    const inner = F2S(dir * EDGE, 15)[0];
    // bleed into the letterbox so the strip runs to the edge of the screen —
    // and centre the labels on that whole visible band, not on the viewBox slice
    const ox = SC.overX, oy = SC.overY;
    const x = dir < 0 ? -ox : inner;
    const w = dir < 0 ? inner + ox : VB_W - inner + ox;
    o.r.setAttribute("x", x); o.r.setAttribute("y", -oy);
    o.r.setAttribute("width", Math.max(0, w));
    o.r.setAttribute("height", VBH + 2 * oy);
    const cx = x + w / 2, ours = ourSide === nm;
    o.lbl.setAttribute("transform", `translate(${cx} ${VBH*0.76}) rotate(${dir<0?-90:90})`);
    o.lbl.setAttribute("opacity", .8);
    o.btxt.textContent = ours ? "OUR SIDE" : "THEIR SIDE";
    const h = ours ? 132 : 152;
    o.badge.setAttribute("x", cx - 16); o.badge.setAttribute("y", VBH*0.30 - h/2);
    o.badge.setAttribute("width", 32); o.badge.setAttribute("height", h);
    o.badge.setAttribute("fill", ours ? "#F2F4F1" : "none");
    o.badge.setAttribute("stroke", ours ? "none" : "#4B554E");
    o.btxt.setAttribute("fill", ours ? "#141A16" : "#8B978D");
    o.btxt.setAttribute("transform",
      `translate(${cx} ${VBH*0.30}) rotate(${dir<0?-90:90})`);
  });

  // routes
  p.paths.forEach((path, i) => {
    const g = SC.paths[i], seg = tl.paths[i];
    const prog = running ? Math.max(0, Math.min(1, (t - seg.start) / seg.dur)) : 0;
    let op = 0;
    if (prog > 0){
      op = p.jobs.includes(path.who) ? 1 : 0.34;
      if (S.solo) op = (path.who === S.solo) ? 1 : 0.07;
    }
    g.line.setAttribute("opacity", op);
    if (g.bar) g.bar.setAttribute("opacity", op);
    if (prog <= 0) return;
    const w = walk(path.pts, prog);
    g.line.setAttribute("points", w.pts.map(pt).join(" "));
    if (g.bar && prog > 0.985){
      const n = w.pts.length, a = w.pts[n-2] || w.pts[0], b = w.pts[n-1];
      const dx = b[0]-a[0], dy = b[1]-a[1], d = Math.hypot(dx,dy) || 1;
      const nx = -dy/d*0.45, ny = dx/d*0.45;
      const s1 = W2S(b[0]-nx, b[1]-ny), s2 = W2S(b[0]+nx, b[1]+ny);
      g.bar.setAttribute("x1",s1[0]); g.bar.setAttribute("y1",s1[1]);
      g.bar.setAttribute("x2",s2[0]); g.bar.setAttribute("y2",s2[1]);
    } else if (g.bar) g.bar.setAttribute("opacity", 0);
  });

  // players
  const lining = !running;                       // LINE UP stage
  const R = dzView() ? (lining ? 12.5 : 11) : lining ? 17 : 12.5, f = LBL();
  for (const key in SC.players){
    const sp = p.spots[key], P = SC.players[key], c = W2S(sp.x, sp.y);
    P.g.setAttribute("transform", `translate(${c[0].toFixed(1)} ${c[1].toFixed(1)})`);

    const sd = sideOf(key);
    const stroke = SIDE[sd];
    const fill = sd === "none" ? "#fff" : sd === "blue" ? "#E8F1FC" : "#FDEEE4";
    if (P.role === "wr"){                         // receiver — circle
      P.shape.setAttribute("r", R);
    } else if (P.role === "back"){                // back — diamond
      const d = R * 1.24;
      P.shape.setAttribute("points", `0,${-d} ${d},0 0,${d} ${-d},0`);
    } else if (P.role === "throw"){               // thrower — hexagon
      const d = R * 1.16;
      P.shape.setAttribute("points",
        [0,60,120,180,240,300].map(a => {
          const r = a * Math.PI / 180;
          return `${(Math.sin(r)*d).toFixed(1)},${(-Math.cos(r)*d).toFixed(1)}`;
        }).join(" "));
    } else {                                      // snapper — square
      const w = R * 1.82;
      P.shape.setAttribute("x", -w/2); P.shape.setAttribute("y", -w/2);
      P.shape.setAttribute("width", w); P.shape.setAttribute("height", w);
      P.shape.setAttribute("rx", 3);
    }
    P.shape.setAttribute("fill", fill);
    P.shape.setAttribute("stroke", stroke);

    P.halo.setAttribute("r", R + 8);
    P.halo.setAttribute("opacity",
      S.solo ? (S.solo === key ? 1 : 0) : (key === p.primary ? 0.95 : 0));

    // Same words in both stages. Lining up there is room for the whole name on
    // two lines; once six kids are moving, two-line labels collide with each
    // other and with the routes, so it drops to the first word — the colour of
    // the marker and of the text is already saying BLUE or ORANGE.
    const words = sideName(key).split(" ");
    P.l1.textContent = words[0];
    P.l2.textContent = lining ? (words[1] || "") : "";
    const twoLine = lining && !!words[1];
    // players in the backfield get their name above, so it never runs off the edge
    const above = sp.y < -2.5;
    if (above){
      P.l1.setAttribute("y", -(R + (twoLine ? f + 7 : 9)));
      P.l2.setAttribute("y", -(R + 7));
    } else {
      P.l1.setAttribute("y", R + f + 3); P.l2.setAttribute("y", R + 2 * f + 3);
    }
    [P.l1, P.l2].forEach(t => t.setAttribute("fill", sd === "none" ? "#141A16" : stroke));

    P.g.setAttribute("opacity", S.solo ? (S.solo === key ? 1 : 0.22) : 1);
  }

  // ball — nose first, so the shape itself says which way it is travelling.
  // `ahead` is the same motion a moment later; the heading comes from the two
  // of them in *screen* space, which is what keeps it right under mirroring.
  const b = tl.ball;
  const STEP = 0.02;
  let show = false, bp = null, ahead = null;
  if (running && !S.solo){
    if (b.mode === "pass" && t >= b.start){
      const f = Math.max(0, Math.min(1, (t - b.start) / b.dur));
      bp = qbez(b.src, b.ctrl, b.dst, f);
      ahead = qbez(b.src, b.ctrl, b.dst, Math.min(1, f + STEP));
      show = true;
    } else if (b.legs){
      // whoever is holding it: the last leg that has started. On a pass this
      // is the runner carrying it up to the moment he throws.
      let leg = null;
      for (const l of b.legs) if (t >= l.start) leg = l;
      if (leg){
        const seg = tl.paths[leg.pathIdx], pts = p.paths[leg.pathIdx].pts;
        const prog = Math.max(0, Math.min(1, (t - seg.start) / seg.dur));
        bp = walk(pts, prog).end;
        ahead = walk(pts, Math.min(1, prog + STEP)).end;
        show = true;
      }
    }
  }
  // the throw line grows under the ball and stays after the catch. It keeps
  // drawing in solo, dimmed like the other routes, so tapping the receiver
  // still shows the ball coming to him.
  if (SC.throw){
    const f = running && t >= b.start ? Math.max(0, Math.min(1, (t - b.start) / b.dur)) : 0;
    let op = 0;
    if (f > 0){
      const who = p.paths[b.pathIdx].who;
      op = S.solo ? ((S.solo === who || S.solo === b.thrower) ? 1 : 0.07) : 1;
      const n = Math.max(2, Math.ceil(f * 24));
      const arc = [];
      for (let i = 0; i <= n; i++){
        const w = qbez(b.src, b.ctrl, b.dst, f * i / n);
        arc.push(pt(w));
      }
      SC.throw.setAttribute("points", arc.join(" "));
    }
    SC.throw.setAttribute("opacity", op);
  }
  if (show && bp){
    const s = W2S(bp[0], bp[1]), s2 = W2S(ahead[0], ahead[1]);
    // once it has arrived there is no "ahead" left, so hold the last heading
    // rather than letting the ball snap flat at the moment it is caught
    if (Math.hypot(s2[0] - s[0], s2[1] - s[1]) > 0.5)
      SC.ballAng = Math.atan2(s2[1] - s[1], s2[0] - s[0]) * 180 / Math.PI;
    const done = (b.mode === "carry")
      ? t > tl.paths[b.pathIdx].start + tl.paths[b.pathIdx].dur
      : t > b.start + b.dur;
    // Arrived: the ball swells and breathes where the ring used to pulse. The
    // players stay on their spots through the whole animation, so this marker is
    // the only thing on screen saying where the ball finished.
    const k = !done ? 1 : REDUCED ? 1.25 : 1.25 + 0.18 * Math.sin(t / 130);
    SC.ball.setAttribute("transform",
      `translate(${s[0]} ${s[1]}) rotate(${SC.ballAng.toFixed(1)}) scale(${k.toFixed(3)})`);
    SC.ball.setAttribute("opacity", 1);
  } else {
    SC.ball.setAttribute("opacity", 0);
  }
}

/* ------------------------------------------------------------ full screen
   A page cannot hide Chrome's address bar in an ordinary tab — only an
   installed launch (display:fullscreen) or the Fullscreen API can. So: offer
   the button when we are NOT already immersive, and hide it when we are.
   Orientation lock is also gated on fullscreen/installed, which is why it
   silently did nothing in a tab.                                            */
function isImmersive(){
  return matchMedia("(display-mode: fullscreen)").matches
      || matchMedia("(display-mode: standalone)").matches
      || matchMedia("(display-mode: minimal-ui)").matches
      || navigator.standalone === true
      || !!document.fullscreenElement;
}
function canFullscreen(){
  return !!(document.documentElement.requestFullscreen
         || document.documentElement.webkitRequestFullscreen);
}
async function goFullscreen(){
  const el = document.documentElement;
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else await (el.requestFullscreen ? el.requestFullscreen({navigationUI: "hide"})
                                     : el.webkitRequestFullscreen());
  } catch(e){}
  try { await screen.orientation.lock("landscape"); } catch(e){}
  logEvent("fullscreen", {on: !!document.fullscreenElement});
  if (S.screen === "deck") renderDeck();
}
addEventListener("fullscreenchange", () => { if (S.screen === "deck") renderDeck(); });

/* ------------------------------------------------ update from the server
   Service workers only exist over http(s); opened as a local file this whole
   block is skipped and the app still runs, just without update checks.      */
let updateReady = false, swWaiting = null;
function applyUpdate(){
  if (swWaiting) swWaiting.postMessage({type: "SKIP_WAITING"});
}
function markUpdate(worker){
  swWaiting = worker; updateReady = true;
  logEvent("update_ready");
  // never interrupt a live play: only the two screens that offer the button
  // redraw, and neither of them is the one turned around at the kids
  if (S.screen === "deck") renderDeck();
  else if (S.screen === "intro") renderIntro();
}
if ("serviceWorker" in navigator && location.protocol.startsWith("http")){
  navigator.serviceWorker.register("./sw.js").then(reg => {
    if (reg.waiting) markUpdate(reg.waiting);
    reg.addEventListener("updatefound", () => {
      const nw = reg.installing;
      if (!nw) return;
      nw.addEventListener("statechange", () => {
        if (nw.state === "installed" && navigator.serviceWorker.controller) markUpdate(nw);
      });
    });
    // look for a new build whenever the coach comes back to the app
    addEventListener("visibilitychange", () => {
      if (!document.hidden) reg.update().catch(() => {});
    });
  }).catch(() => {});
  let reloading = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (reloading) return;
    reloading = true;
    location.reload();
  });
}

/* ------------------------------------------------------------ boot */
async function keepAwake(){
  try { if ("wakeLock" in navigator) await navigator.wakeLock.request("screen"); } catch(e){}
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") keepAwake();
});
// only meaningful once installed or fullscreen; harmless otherwise
try { if (isImmersive() && screen.orientation && screen.orientation.lock)
        screen.orientation.lock("landscape").catch(() => {}); } catch(e){}
logEvent("session_start", {build: APP_BUILD, w0: SESSION.w0,
  tz: (Intl.DateTimeFormat().resolvedOptions().timeZone || ""),
  tzOffMin: new Date().getTimezoneOffset(),
  deck: deck.slice(), cfg: Object.assign({}, cfg)});
keepAwake();
renderIntro();
requestAnimationFrame(frame);
</script>

</body>
</html>
