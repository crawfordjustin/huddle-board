<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1E2521">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
</head>
<body>
<title>Huddle Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#F2F4F1; --surface:#FBFCFA; --ink:#141A16; --ink-2:#4A554E;
  --hair:#D8DED8; --blue:#1D6FD0; --orange:#E4610F; --ball:#FFC400;
  --green:#1B5E3A; --green-2:#154C2F;
  --oob:#1E2521; --oob-hatch:#38423B; --oob-ink:#7C887F;
  --run:#127A4D; --route:#232B26;
  --pass:#2A6FD6; --pass-lt:#7FB2F2;   /* run vs pass, legible on either ground */
  --card:#F7F5EE;                      /* the deck's cards: warm paper, not bright white */
  --disp:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow","Helvetica Neue",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--oob);color:var(--ink);
  font-family:var(--body);-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:3px solid var(--green);outline-offset:2px}
#app{position:fixed;inset:0;display:flex;flex-direction:column}

/* ---------------------------------------------------------------- deck
   Dark ground, light plays. The cards are the content; the chrome recedes. */
/* min-height:0 is load-bearing. A flex item defaults to min-height:auto, so
   without this .deck grows to fit its content instead of the screen, and the
   scrollers inside it (.tiles, .lib) never have a reason to scroll — rows just
   fall off the bottom of the tablet, unreachable. Breaks past ~22 plays. */
.deck{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--oob);
  padding:clamp(14px,2.2vh,26px) clamp(16px,2.4vw,34px)}
.deckhead{display:flex;align-items:baseline;justify-content:space-between;gap:16px;
  border-bottom:2px solid #39433C;padding-bottom:10px;flex:none}
.deckhead h1{font-family:var(--disp);font-size:clamp(26px,4.4vh,40px);margin:0;letter-spacing:.01em;
  text-transform:uppercase;color:#F2F4F1}
.deckhead p,.decktop p{margin:0;font-size:clamp(11px,1.6vh,14px);color:#8A968C;letter-spacing:.13em;
  text-transform:uppercase;font-weight:600}
.dh-right{display:flex;align-items:center;gap:clamp(10px,1.5vw,20px)}
.fmt{font-family:var(--disp);font-size:clamp(11px,1.6vh,14px);letter-spacing:.12em;white-space:nowrap;
  color:#8A968C;border:1.5px solid currentColor;border-radius:999px;padding:2px 9px;vertical-align:middle}
.deckhead h1 .fmt{margin-left:12px;font-size:clamp(11px,1.8vh,15px)}
/* The deck has no title row. It is the screen a coach picks plays from, so
   every line of chrome above the tiles is a row of plays he cannot see: the
   filter chips sit on the left of one bar and the clock, the count and the
   menu on its right. Change plays lives in the menu with Setup and Exit. */
.decktop{flex:none;display:flex;align-items:center;justify-content:space-between;
  gap:clamp(14px,2.2vw,32px)}
.decktop .dfilt{flex:1 1 0;min-width:0;padding:0}
.decktop .dh-right{flex:none;margin-left:auto;align-self:flex-start}
.barright{justify-self:end;display:flex;align-items:center;gap:clamp(8px,1.2vw,16px)}

/* play clock — same dark instrument on every screen */
.clockwrap{display:flex;align-items:center;gap:6px}
.clock{display:flex;align-items:center;gap:clamp(7px,.8vw,12px);background:var(--ink);
  border:2px solid #333D36;border-radius:10px;padding:6px clamp(10px,1.1vw,15px);
  min-height:48px;color:#fff;transition:background .15s ease,border-color .15s ease}
.clock .clabel{font-size:clamp(8.5px,1.3vh,12px);font-weight:700;letter-spacing:.13em;
  text-transform:uppercase;color:#C9D3CC;text-align:right;line-height:1.15;max-width:5.2em}
.clock .cnum{font-family:var(--disp);font-size:clamp(23px,4vh,38px);font-weight:700;
  line-height:1;font-variant-numeric:tabular-nums;min-width:1.7ch;text-align:right}
.clock.run{border-color:#4A9C6E}
.clock.run .clabel{color:#8FCBA8}
.clock.warn{background:#8A5A00;border-color:#C58A16}
.clock.warn .clabel{color:#F3D89B}
.clock.danger{background:#8E2418;border-color:#C0392B}
.clock.danger .clabel{color:#F5C2BB}
.clock.gone{background:#C0392B;border-color:#E05545}
.clock.gone .clabel{color:#fff}
.clock:active{transform:scale(.97)}
.cstop{width:34px;height:34px;border-radius:8px;background:transparent;border:1.5px solid var(--hair);
  color:var(--ink-2);font-size:19px;line-height:1;display:flex;align-items:center;
  justify-content:center}
.bar .cstop{border-color:#3B443E;color:#9AA69C}
.edit{font-family:var(--disp);font-size:clamp(14px,2.2vh,20px);text-transform:uppercase;
  letter-spacing:.05em;padding:9px 18px;border-radius:9px;background:transparent;
  border:1.5px solid #3B443E;min-height:44px;color:#D5DCD7}
.edit:active{background:#28302A}
.edit.done{background:var(--green);border-color:var(--green-2);color:#fff}
.edit.upd{background:var(--green);border-color:var(--green-2);color:#fff}
.edit:active{transform:scale(.97)}

/* one control for everything that is not a play. Setup and Exit are things a
   coach does between series, so they get one tap of chrome and no header room. */
.menuwrap{position:relative;display:flex}
.ham{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  padding:9px 15px;border-radius:9px;background:transparent;border:1.5px solid #3B443E;
  min-height:44px;min-width:54px}
.ham i{display:block;width:24px;height:2.5px;border-radius:2px;background:#D5DCD7}
.ham:active,.menuwrap.open .ham{background:#28302A}
.menuwrap.open .ham{transform:scale(.97)}
/* the tiles are position:relative, so the panel needs to be told it is on top */
.menu{position:absolute;top:calc(100% + 10px);right:0;z-index:30;
  min-width:max(210px,100%);background:#232B26;border:1.5px solid #3B443E;
  border-radius:12px;padding:6px;box-shadow:0 16px 36px rgba(0,0,0,.55);
  display:flex;flex-direction:column;gap:4px}
.menu[hidden]{display:none}
.menu button{font-family:var(--disp);font-size:clamp(14px,2.2vh,20px);text-transform:uppercase;
  letter-spacing:.05em;text-align:left;padding:10px 16px;min-height:48px;border-radius:8px;
  color:#D5DCD7;width:100%}
.menu button:active{background:#2F3833}
.tiles{flex:1;display:grid;grid-template-columns:repeat(var(--cols,2),1fr);
  grid-auto-rows:minmax(clamp(92px,12vh,150px),1fr);
  gap:clamp(10px,1.8vh,20px);padding-top:clamp(10px,1.8vh,20px);min-height:0;
  overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;
  scrollbar-gutter:stable}
.tiles.compact .tile{padding:clamp(10px,1.6vh,16px) clamp(10px,1.2vw,16px)
  clamp(10px,1.6vh,16px) clamp(22px,2.6vw,32px)}

/* a grid of three or four columns is the deck a coach hunts through, and a
   tight one is any grid fitDeck() found spilling, so the rows go back to
   their smaller sizes and the room goes to the name */
.tiles.compact .coach,.tiles.tight .coach{font-size:clamp(9px,1.4vh,12px);margin-top:4px}
.tiles.compact .kind,.tiles.tight .kind{font-size:clamp(11px,1.8vh,17px);letter-spacing:.12em}
.tiles.compact .tag,.tiles.tight .tag{font-size:clamp(11px,1.7vh,15px)}

/* settings */
.setrows{flex:1;display:flex;flex-direction:column;
  gap:clamp(10px,1.8vh,20px);padding:clamp(12px,2vh,22px) 0;min-height:0;
  overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-gutter:stable}
/* rows start right under the tab that chose them, and scroll once they do
   not fit. Never justify-content:center here: it puts the first row above the
   top of a scroller and out of reach forever. */
.setrow{flex:0 0 auto;display:flex;align-items:center;gap:clamp(14px,2vw,28px);
  background:#242C27;border:1.5px solid #333D36;border-radius:12px;
  padding:clamp(10px,1.8vh,18px) clamp(14px,1.6vw,22px)}
.setlab{flex:1;min-width:0}
.setlab b{display:block;font-family:var(--disp);font-size:clamp(17px,3vh,27px);
  text-transform:uppercase;letter-spacing:.01em;line-height:1.05;color:#EDF0EC}
.setlab span{display:block;font-size:clamp(10px,1.6vh,14px);color:#8E9A91;
  line-height:1.35;margin-top:4px;max-width:52ch}
/* what just happened on this row — the one line of Setup that is an answer,
   not a description, so it is the one line that is not grey */
.setlab .setmsg{display:block;color:#EDF0EC;font-style:normal;margin-bottom:3px}
/* Setup's tabs. The same chip a filter is, because choosing which settings
   to look at is choosing what is on screen — one control for one idea */
.settabs{flex:none;display:flex;flex-wrap:wrap;gap:clamp(5px,.8vw,9px);
  padding:clamp(8px,1.2vh,14px) 0 0}
.settabs .fchip{min-height:clamp(44px,5.4vh,52px);padding:0 clamp(14px,1.6vw,22px)}
.seg{display:flex;gap:6px;flex:none}
.seg button{font-family:var(--disp);font-size:clamp(14px,2.3vh,21px);text-transform:uppercase;
  letter-spacing:.04em;min-width:clamp(56px,6vw,80px);min-height:52px;border-radius:9px;
  background:#1A211D;border:1.5px solid #39433C;color:#A3AFA6}
.seg button.on{background:var(--green);border-color:var(--green-2);color:#fff}
.seg button:active{transform:scale(.96)}

/* filter bar, on the library and on the deck. Wraps rather than scrolling
   sideways: a filter you cannot see is a filter nobody uses. */
.lfilt,.dfilt{flex:none;display:flex;flex-wrap:wrap;align-items:center;
  gap:clamp(5px,.8vw,9px);padding:clamp(8px,1.2vh,14px) 0 clamp(2px,.6vh,6px)}
/* on the deck the bar is chrome above the plays, so it sits a size down and
   never competes with the tiles for the eye */
.dfilt .fchip{font-size:clamp(11px,1.6vh,15px);min-height:clamp(34px,4.4vh,42px)}
.fchip{font-family:var(--disp);font-size:clamp(12px,1.85vh,17px);text-transform:uppercase;
  letter-spacing:.05em;min-height:clamp(36px,5vh,46px);padding:0 clamp(9px,1vw,15px);
  border-radius:9px;background:#1A211D;border:1.5px solid #39433C;color:#A3AFA6;
  display:inline-flex;align-items:center;gap:7px;white-space:nowrap;cursor:pointer}
.fchip .n{font-size:.82em;color:#6E7A72;font-variant-numeric:tabular-nums}
.fchip.on{background:var(--green);border-color:var(--green-2);color:#fff}
.fchip.on .n{color:#CBE8DA}
/* a situation chip lights up in its own colour, matching the row's edge bar */
.fchip[data-cat].on{background:var(--cat);border-color:var(--cat);color:#fff}
.fchip[data-cat="all"].on{background:var(--green);border-color:var(--green-2)}
.fchip:active{transform:scale(.96)}
.fchip:focus-visible{outline:3px solid #5FBF8F;outline-offset:2px}
.lsep{width:1.5px;align-self:stretch;background:#39433C;margin:0 clamp(2px,.4vw,6px)}
.lsearch{flex:0 1 clamp(120px,15vw,230px);min-width:0;min-height:clamp(36px,5vh,46px);
  background:#141A16;border:1.5px solid #39433C;border-radius:9px;color:#E8EDE9;
  padding:0 clamp(10px,1vw,14px);font-family:var(--disp);letter-spacing:.05em;
  font-size:clamp(13px,1.9vh,18px)}
.lsearch::placeholder{color:#6E7A72;text-transform:uppercase;letter-spacing:.08em}
.lsearch:focus{outline:none;border-color:#5FBF8F}

/* play packs: a saved deck a coach starts from. Not a filter — a pack changes
   what is IN the deck, not what is on screen — so it does not wear .fchip; the
   dashed edge says "this is a thing you take", not "a thing you look through". */
.packs{flex:none;display:flex;flex-wrap:wrap;align-items:center;
  gap:clamp(5px,.8vw,9px);padding:clamp(4px,.8vh,8px) 0 0}
.packs[hidden]{display:none}
.plab{font-family:var(--disp);text-transform:uppercase;letter-spacing:.08em;color:#6E7A72;
  font-size:clamp(11px,1.6vh,14px);margin-right:clamp(2px,.4vw,6px)}
.pack{font-family:var(--disp);font-size:clamp(12px,1.85vh,17px);text-transform:uppercase;
  letter-spacing:.05em;min-height:clamp(36px,5vh,46px);padding:0 clamp(9px,1vw,15px);
  border-radius:9px;background:#141A16;border:1.5px dashed #4A7A5E;color:#CBE8DA;
  display:inline-flex;align-items:center;gap:7px;white-space:nowrap;cursor:pointer}
.pack .n{font-size:.82em;color:#6E7A72;font-variant-numeric:tabular-nums}
.pack.on{background:var(--green);border-style:solid;border-color:var(--green-2);color:#fff;cursor:default}
.pack.on .n{color:#CBE8DA}
/* armed: the same amber as the clock's warning — one colour for "about to" */
.pack[data-armed]{background:#8A5A00;border-style:solid;border-color:#C58A16;color:#fff}
.pack:active{transform:scale(.96)}
/* an empty week: a slot waiting for a deck, quieter than one that holds plays */
.pack.empty{border-color:#39433C;color:#7E8A81}
.pack[disabled]{opacity:.4;cursor:default}
.pack:focus-visible{outline:3px solid #5FBF8F;outline-offset:2px}
/* a week the coach saved his own deck into wears the same pencil as a renamed row */
.pack .pmark{font-size:.85em;color:#8FC9A8;margin-right:-2px}
.pack.on .pmark{color:#CBE8DA}
/* Save deck and Rename sit at the far end, plain: they are verbs, not weeks */
.pverb{border-style:solid;border-color:#39433C;color:#A3AFA6;background:#1A211D}
.psave{margin-left:auto}
/* saving or renaming: every week is a target, in the same amber as an armed button */
.packs.saving .pack:not(.pverb),.packs.renaming .pack:not(.pverb){
  border-style:solid;border-color:#C58A16;color:#F2D9A6;background:#3A2A08}
.pverb.on{background:#8A5A00;border-color:#C58A16;color:#fff}
/* the deck with nothing in it: where the plays are, and one green way there.
   The same .start button the intro uses, because it is the same kind of step:
   the one thing to do next. */
.dempty{grid-column:1/-1;grid-row:1/-1;align-self:center;justify-self:center;
  display:flex;flex-direction:column;align-items:center;text-align:center;
  gap:clamp(10px,1.8vh,18px);max-width:560px;padding:clamp(14px,3vh,32px) 8px}
.dempty h2{font-family:var(--disp);margin:0;text-transform:uppercase;letter-spacing:.01em;
  color:#F2F4F1;font-size:clamp(26px,5vh,46px);line-height:1}
.dempty p{margin:0;color:#B4BEB6;line-height:1.45;font-size:clamp(13px,2vh,18px)}
.dempty p b{color:#F2F4F1;font-weight:600}
.dempty .start{width:min(100%,420px)}
.lempty{grid-column:1/-1;align-self:start;display:flex;align-items:center;gap:14px;
  color:#8A968C;font-size:clamp(13px,2vh,18px);padding:clamp(14px,2.5vh,28px) 4px}

/* one column on a narrow tablet: two columns of long play names at 800px wide
   leaves each name about 200px, which is not enough as the library grows. */
@media (max-width:860px){ .lib{grid-template-columns:1fr !important} }
.lib{flex:1;display:grid;grid-template-columns:1fr 1fr;
  grid-auto-rows:minmax(clamp(52px,7vh,96px),1fr);
  gap:clamp(6px,1vh,11px) clamp(10px,1.6vw,22px);
  padding-top:clamp(10px,1.6vh,18px);min-height:0;
  overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;
  scrollbar-gutter:stable}
/* out of the deck = dark card, in the deck = light card. Readable either way,
   which dimming with opacity was not. */
.lrow{display:flex;align-items:center;gap:clamp(8px,1vw,14px);text-align:left;
  background:#262E29;border:1.5px solid #333D36;border-radius:10px;
  padding:0 clamp(10px,1.1vw,15px) 0 0;overflow:hidden;position:relative;
  transition:background .12s ease,border-color .12s ease}
.lrow::before{content:"";width:clamp(7px,.8vw,11px);align-self:stretch;background:var(--cat);
  flex:none}
.lrow.on{background:var(--surface);border-color:#5FBF8F}
.lrow:active{transform:scale(.99)}
.lnum{font-family:var(--disp);font-size:clamp(15px,2.4vh,22px);font-weight:700;color:#6E7A72;
  min-width:22px;text-align:center;font-variant-numeric:tabular-nums;flex:none;
  padding-left:clamp(4px,.5vw,8px)}
.lname{flex:1;min-width:0}
.lname b{display:block;font-family:var(--disp);font-size:clamp(15px,2.4vw,27px);
  text-transform:uppercase;line-height:1;letter-spacing:.01em;color:#C9D2CB;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lname i{display:block;font-style:normal;font-size:clamp(9px,1.4vh,12px);color:#7E8A81;
  font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lcat{font-size:clamp(7px,1.1vh,9.5px);font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:#fff;background:var(--cat);padding:4px 8px;border-radius:4px;white-space:nowrap;flex:none}
.lthumb{flex:none;width:clamp(78px,8.6vw,126px);display:flex;align-items:center;
  border-radius:8px;cursor:zoom-in}
.lthumb .thumbsvg{width:100%}
.lthumb:active{transform:scale(.96)}
.lthumb:focus-visible{outline:3px solid #5FBF8F;outline-offset:2px}
.lmeta{width:clamp(54px,6.2vw,78px);display:flex;flex-direction:column;align-items:center;
  gap:4px;flex:none}
.lkind{font-family:var(--disp);font-size:clamp(11px,1.8vh,16px);font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;text-align:center}
.lkind.run{color:#5FBF8F} .lkind.pass{color:var(--pass-lt)}
.lcomplexity{font-size:clamp(6.5px,1vh,9px);font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:#fff;background:var(--complex);padding:2px 5px;border-radius:4px;
  white-space:nowrap}
.lrow.on .lnum{color:var(--ink-2)}
.lrow.on .lname b{color:var(--ink)}
.lrow.on .lname i{color:var(--ink-2)}
.lrow.on .lkind.run{color:var(--run)}
.lrow.on .lkind.pass{color:var(--pass)}
.lmark{font-size:clamp(15px,2.4vh,21px);font-weight:700;width:30px;height:30px;flex:none;
  display:flex;align-items:center;justify-content:center;border-radius:8px;
  background:#39433C;color:#A3AFA6}
.lrow.on .lmark{background:var(--green);color:#fff}
/* the pencil. Big enough for a thumb in a glove, quiet enough that the row
   still reads as one tap target for adding the play to the deck. */
.lren{font-size:clamp(13px,2vh,18px);width:34px;height:34px;flex:none;
  display:flex;align-items:center;justify-content:center;border-radius:8px;
  color:#7E8A81;background:transparent;border:1.5px solid #39433C;cursor:pointer;
  line-height:1}
.lren.on{color:var(--ball);border-color:#6B5A2A}
.lren:active{transform:scale(.94)}
.lrow.on .lren{color:#6F7C73;border-color:#C6D0C7}
.lrow.on .lren.on{color:#9A6E12;border-color:#D9BE7A}

/* the play preview: the library's thumbnail, large. fitPreview() sizes the
   picture to what the screen leaves once the words are laid out, so the
   whole card is on screen at once on a short landscape tablet too. */
.sheet.prev{width:min(1000px,100%);display:flex;flex-direction:column;
  border-left:6px solid var(--cat)}
.prev .kind.run{color:#5FBF8F} .prev .kind.pass{color:var(--pass-lt)}
.sheet h2.prevname{font-family:var(--disp);font-size:clamp(26px,4.6vh,46px);color:#EDF0EC;
  letter-spacing:.01em;font-weight:400;line-height:1;margin:clamp(4px,.8vh,8px) 0 4px}
.prevsub{font-size:clamp(10px,1.6vh,14px);color:#8E9A91;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;margin-bottom:clamp(8px,1.4vh,14px)}
.prevart .thumbsvg{margin:0 auto;border-radius:12px}

/* the library's first-visit note: a few lines, each starting with the thing to tap */
.welhead{font-size:clamp(13px,2vh,18px);color:#C9D2CB;line-height:1.4;margin:0 0 clamp(8px,1.4vh,14px)}
.wellist{margin:0 0 clamp(12px,2vh,20px);padding-left:1.2em}
.wellist li{font-size:clamp(12px,1.8vh,16px);color:#A3AFA6;line-height:1.4;
  margin-bottom:clamp(4px,.8vh,8px)}
.wellist b{color:#EDF0EC}

/* show and hide the shipped plays: a long list in a sheet that scrolls
   inside itself, so Save and Cancel never leave the screen */
.sheet.hidepick{width:min(760px,100%);display:flex;flex-direction:column}
.hidebar{flex:none;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  margin-bottom:clamp(8px,1.4vh,12px)}
.hidebar span{margin-right:auto;font-size:clamp(11px,1.7vh,15px);color:#A3AFA6;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase}
.hlist{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  scrollbar-gutter:stable;margin-bottom:clamp(10px,1.6vh,16px)}
.hrow{width:100%;display:flex;align-items:center;gap:12px;min-height:52px;text-align:left;
  padding:6px 12px;margin-bottom:6px;border-radius:10px;background:#1A211D;
  border:1.5px solid #39433C;border-left:5px solid var(--cat);color:#C9D2CB;cursor:pointer}
.hname{flex:1;min-width:0}
.hname b{display:block;font-family:var(--disp);font-size:clamp(15px,2.3vh,21px);font-weight:400;
  text-transform:uppercase;line-height:1.05;color:#EDF0EC;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.hname i{display:block;font-style:normal;font-size:clamp(9px,1.4vh,12px);color:#8E9A91;
  letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.hname em{font-style:normal;color:var(--ball)}
.hstate{flex:none;font-family:var(--disp);font-size:clamp(13px,2vh,18px);text-transform:uppercase;
  letter-spacing:.06em;min-width:5.5em;text-align:center;padding:6px 10px;border-radius:8px;
  background:var(--green);color:#fff}
.hrow.off{opacity:.62;border-left-color:#39433C}
.hrow.off .hstate{background:#2B332E;color:#A3AFA6}
.hrow:active{transform:scale(.99)}

/* the rename sheet — the only place in the app a coach types */
.sheetwrap{position:fixed;inset:0;z-index:60;display:flex;align-items:center;
  justify-content:center;padding:clamp(14px,3vh,32px);background:rgba(9,13,11,.72)}
.sheet{width:min(560px,100%);max-height:100%;overflow-y:auto;background:#1F2622;
  border:1.5px solid #3B453E;border-radius:16px;padding:clamp(16px,2.6vh,26px)}
.sheet h2{font-family:var(--disp);font-size:clamp(15px,2.2vh,20px);text-transform:uppercase;
  letter-spacing:.1em;color:#8E9A91;font-weight:700;margin-bottom:clamp(10px,1.8vh,18px)}
.nfield{display:block;margin-bottom:clamp(10px,1.6vh,16px)}
.nfield span{display:block;font-size:clamp(10px,1.5vh,13px);font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:#8E9A91;margin-bottom:6px}
.nfield input{width:100%;font-family:var(--disp);font-size:clamp(20px,3.4vh,32px);
  text-transform:uppercase;letter-spacing:.01em;color:#EDF0EC;background:#141A16;
  border:1.5px solid #39433C;border-radius:10px;padding:clamp(9px,1.5vh,14px) 14px}
.nfield input{-webkit-user-select:text;user-select:text}
.nfield input:focus{outline:none;border-color:var(--green-2)}
.sheetnote{font-size:clamp(10px,1.6vh,14px);color:#8E9A91;line-height:1.4;
  margin:clamp(6px,1vh,12px) 0 clamp(12px,2vh,20px)}
.sheetnote b{color:#C9D2CB}
.sheetbtns{display:flex;gap:8px;justify-content:flex-end}
.sbtn{font-family:var(--disp);font-size:clamp(14px,2.3vh,21px);text-transform:uppercase;
  letter-spacing:.04em;min-width:clamp(84px,9vw,116px);min-height:52px;border-radius:9px;
  background:#1A211D;border:1.5px solid #39433C;color:#A3AFA6}
.sbtn.go{background:var(--green);border-color:var(--green-2);color:#fff}
.sbtn:active{transform:scale(.96)}
.sbtn[disabled],.seg button[disabled],.edit[disabled]{opacity:.4}
/* names were sized in vh, so rotating the tablet grew the type while the tile
   got narrower — the exact recipe for clipping. Size against the card itself. */
.tile{container-type:inline-size;
  position:relative;display:flex;align-items:center;gap:clamp(10px,1.4vw,20px);
  background:var(--card);border:1px solid rgba(20,26,22,.08);border-radius:14px;
  box-shadow:0 6px 18px rgba(0,0,0,.28),0 1px 2px rgba(0,0,0,.2);
  padding:clamp(8px,1.4vh,16px) clamp(10px,1.2vw,16px) clamp(8px,1.4vh,16px) clamp(22px,2.6vw,34px);
  text-align:left;transition:transform .12s ease,box-shadow .12s ease;overflow:hidden}
.tilemain{flex:1;min-width:0;overflow:hidden;display:flex;flex-direction:column;
  justify-content:center}
.thumb{flex:none;width:clamp(150px,26vw,380px);align-self:stretch;display:flex;
  align-items:center}
@supports (container-type:inline-size){
  .tile .kid{font-size:min(60px, 12.5cqi)}
  .thumb{width:52cqi}
  .lrow{container-type:inline-size}
  .lname b{font-size:min(27px, 9cqi)}
}
/* the picture is what a coach reads; the words are the caption. layoutTiles()
   sizes the thumb from the card's real height, so it is never a strip floating
   in whitespace, and a card taller than it is wide puts the picture on top */
.tiles .thumb{width:var(--thumbw,52%)}
.tiles.stack .tile{flex-direction:column;align-items:stretch;justify-content:center}
.tiles.stack .thumb{order:-1;width:auto;flex:0 1 auto;min-height:0;justify-content:center}
.tiles.stack .tilemain{flex:none}
.tiles.stack .tag{display:none}
.thumbsvg{width:100%;height:auto;max-height:100%;display:block}
/* the bar answers the only question that matters in three seconds */
.tile.run::before{background:var(--run)}
.tile.pass::before{background:var(--pass)}
.kindrow{display:flex;align-items:center;gap:clamp(6px,.8vw,11px);
  margin-bottom:clamp(3px,.6vh,7px);flex-wrap:wrap}
.kind{font-family:var(--disp);font-size:clamp(13px,2.4vh,23px);font-weight:700;
  letter-spacing:.08em;text-transform:uppercase}
.catchip{font-size:clamp(7.5px,1.35vh,12.5px);font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:#fff;background:var(--cat);padding:.35em .65em;border-radius:4px;
  white-space:nowrap}
.catchip.complexity{background:var(--complex)}
/* the situation is the thing a coach is actually looking for under pressure
   ("I need a goal line play"), so it stays on the tile at every column count.
   It used to be hidden here — on the only deck sizes big enough to need it. */
.tiles.compact .catchip,.tiles.tight .catchip{font-size:clamp(6.5px,.95vh,8.5px);padding:2px 5px}
.tile.run .kind{color:var(--run)}
.tile.pass .kind{color:var(--pass)}
.tile:active{transform:scale(.985);box-shadow:inset 0 0 0 3px var(--green)}
.tile:focus-visible{outline:3px solid #5FBF8F;outline-offset:3px}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:clamp(7px,.8vw,11px);
  background:var(--cat);border-radius:12px 0 0 12px}

/* Two lines are allowed here so a long real name like PLAY-ACTION CROSS can
   wrap instead of shrinking to nothing. fitText() is what enforces the cap —
   do NOT add a max-height: with line-height under 1 the glyph box is taller
   than the line box, so any height clamp makes scrollHeight permanently
   exceed clientHeight and every name collapses to the floor size. */
.tile .kid{display:block;font-family:var(--disp);font-size:clamp(22px,5vw,60px);
  line-height:.95;text-transform:uppercase;letter-spacing:.005em;
  white-space:normal;overflow-wrap:normal;word-break:keep-all}
.tile .coach{font-size:clamp(12px,2.1vh,20px);color:var(--ink-2);font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;margin-top:clamp(4px,.8vh,8px)}
.tile .tag{font-size:clamp(12px,2.1vh,19px);color:var(--ink-2);line-height:1.3;
  margin-top:clamp(8px,1.4vh,14px);max-width:34ch}
.decknote{flex:none;padding-top:clamp(8px,1.4vh,14px);font-size:clamp(10px,1.5vh,13px);
  color:#78847B;letter-spacing:.06em}

/* ---------------------------------------------------------------- play */
.play{flex:1;display:flex;flex-direction:column;min-height:0}
.bar{flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  gap:clamp(10px,1.4vw,18px);background:var(--ink);color:#fff;
  padding:clamp(6px,1.1vh,12px) clamp(10px,1.4vw,18px)}
.back{justify-self:start;font-family:var(--disp);font-size:clamp(18px,2.8vh,26px);
  text-transform:uppercase;letter-spacing:.06em;padding:8px 16px;border-radius:9px;
  background:transparent;border:1.5px solid #3B443E;color:#E4E9E5;min-height:44px}
.back:active{background:#242B26}
.titlewrap{grid-column:2;min-width:0;display:flex;align-items:baseline;gap:12px;
  justify-content:center}
.titlewrap .kid{font-family:var(--disp);font-size:clamp(20px,3.6vw,44px);text-transform:uppercase;
  line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.titlewrap .coach{font-size:clamp(10px,1.6vh,14px);color:#98A49B;font-weight:600;
  letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.chip{justify-self:end;font-family:var(--body);font-size:clamp(9px,1.3vh,12px);font-weight:700;
  letter-spacing:.11em;text-transform:uppercase;color:#fff;background:var(--cat);
  padding:5px 10px;border-radius:5px;white-space:nowrap}

.stagewrap{flex:1;display:flex;min-height:0}
/* overflow:hidden here + overflow:visible on the svg lets the out-of-bounds
   hatch bleed into the letterbox, so the coloured border reaches the physical
   edge of the screen instead of stopping at the viewBox. */
.fieldwrap{flex:1;min-width:0;position:relative;display:flex;background:var(--oob);
  overflow:hidden}
#field{width:100%;height:100%;display:block;overflow:visible}
.rail{flex:none;width:clamp(84px,9.5vw,124px);display:flex;flex-direction:column;
  justify-content:center;gap:clamp(8px,1.4vh,16px);
  padding:clamp(8px,1.2vh,14px) clamp(8px,.9vw,13px);
  border-left:1.5px solid var(--hair);background:var(--ground)}
.rbtn{flex:0 0 auto;padding:clamp(14px,3.2vh,30px) 4px;min-height:62px;border-radius:11px;background:var(--surface);
  border:1.5px solid var(--hair);font-family:var(--disp);text-transform:uppercase;
  font-size:clamp(13px,2.1vh,19px);letter-spacing:.05em;line-height:1.05;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  transition:background .12s ease,color .12s ease}
.rbtn small{font-family:var(--body);font-size:clamp(8px,1.15vh,10px);letter-spacing:.1em;
  color:var(--ink-2);font-weight:600}
.rbtn.on{background:var(--ink);border-color:var(--ink);color:#fff}
.rbtn.on small{color:#A9B5AD}
.rbtn.go{background:var(--green);border-color:var(--green-2);color:#fff}
.rbtn.go small{color:#BEE3CE}
.rbtn:active{transform:scale(.97)}

.calls{flex:none;display:flex;gap:clamp(6px,.9vw,12px);align-items:stretch;
  padding:clamp(7px,1.2vh,13px) clamp(10px,1.4vw,18px);border-top:1.5px solid var(--hair);
  background:var(--surface);min-height:clamp(56px,9vh,86px)}
.call{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;
  padding:0 clamp(8px,1vw,14px);border-left:4px solid var(--hair)}
.call.job{border-left-color:var(--ball)}
.call b{font-family:var(--disp);font-size:clamp(14px,2.5vh,23px);text-transform:uppercase;
  letter-spacing:.03em;line-height:1.05}
.call span{font-size:clamp(11px,1.85vh,17px);color:var(--ink-2);line-height:1.15;margin-top:2px}
.call.blue b{color:var(--blue)} .call.orange b{color:var(--orange)}
.solo{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 clamp(8px,1vw,14px);
  border-left:4px solid var(--ball)}
.solo b{font-family:var(--disp);font-size:clamp(17px,3.2vh,30px);text-transform:uppercase;line-height:1}
.solo span{font-size:clamp(11px,1.9vh,18px);color:var(--ink-2);line-height:1.2;margin-top:3px}
.solo .x{position:absolute;right:14px;top:50%;transform:translateY(-50%)}

.hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);
  font-size:clamp(10px,1.5vh,13px);color:var(--ink-2);letter-spacing:.1em;text-transform:uppercase;
  font-weight:600;background:rgba(251,252,250,.86);padding:5px 12px;border-radius:20px;
  pointer-events:none;transition:opacity .3s ease}
/* ---------------------------------------------------------------- intro
   The screen a coach lands on cold, before the deck. Art on one side, one
   green button on the other, and nothing else to get wrong with gloves on in
   the cold. min-height:0 on the flex children is load-bearing here for the
   same reason it is on .deck — the short 1024x600 landscape is the shape that
   punishes getting it wrong, and START falling off the bottom of that tablet
   would strand the coach on the first screen. */
.intro{flex:1;min-height:0;display:flex;align-items:center;
  gap:clamp(16px,3vw,46px);background:var(--oob);
  padding:clamp(14px,3vh,36px) clamp(16px,3vw,44px)}
.introart{flex:1 1 58%;min-width:0;min-height:0;height:100%;
  display:flex;align-items:center;justify-content:center}
/* Capped in both directions with auto sizing, so the picture scales to fit and
   is never squashed — and so swapping in art of a different shape needs no CSS.
   Hard-coding an aspect ratio here would crop or distort the next illustration
   somebody drops in. */
.introimg{max-width:100%;max-height:100%;width:auto;height:auto;
  object-fit:contain;display:block;
  border-radius:16px;border:1.5px solid #39433C}
.introsay{flex:0 1 clamp(230px,30%,400px);min-width:0;min-height:0;
  display:flex;flex-direction:column;justify-content:center;gap:clamp(9px,1.6vh,18px)}
.introsay h1{font-family:var(--disp);margin:0;line-height:.92;letter-spacing:.01em;
  text-transform:uppercase;color:#F2F4F1;font-size:clamp(30px,6.4vh,62px)}
.introsay p{margin:0;color:#9AA69C;line-height:1.35;font-size:clamp(12px,1.9vh,18px);
  max-width:30ch}
.introsay .sub{color:#6E7A72;font-size:clamp(10px,1.5vh,13px);letter-spacing:.1em;
  text-transform:uppercase;font-weight:600}
/* the update offer sits under START, the same button the deck shows, and
   never wider than the thing it is not: a second green button competing
   with the one that starts the game */
.introsay .upd{align-self:flex-start;margin-top:clamp(4px,1vh,10px)}
@media (orientation:portrait){.introsay .upd{align-self:center}}
.start{font-family:var(--disp);text-transform:uppercase;letter-spacing:.05em;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;background:var(--green);border:1.5px solid var(--green-2);color:#fff;
  border-radius:12px;padding:clamp(10px,1.8vh,20px) clamp(18px,2vw,30px);
  min-height:clamp(58px,11vh,96px);font-size:clamp(24px,4.6vh,44px);line-height:1;
  transition:transform .12s ease}
.start small{font-family:var(--body);font-size:clamp(9px,1.3vh,12px);letter-spacing:.1em;
  font-weight:600;color:#BEE3CE;text-transform:uppercase}
.start:active{transform:scale(.97)}
/* Upright, the art belongs above the words — side by side in portrait leaves
   both columns too narrow to read. */
@media (orientation:portrait){
  .intro{flex-direction:column;justify-content:center;gap:clamp(14px,2.6vh,32px)}
  .introart{flex:0 1 auto;width:100%;height:auto}
  .introsay{flex:none;width:100%;align-items:center;text-align:center}
  .introsay p{max-width:38ch}
  .start{width:100%;max-width:520px}
}

/* ------------------------------------------------------------- tutorial
   Four slides between START and the deck, once. The app grew past what one
   sentence on the intro could carry — chips, mirror, tap-a-kid, the menu —
   and a coach opening it cold in a parking lot should not have to find those
   by poking. Each slide is the real thing on the left (a tile, a play, the
   markers, the menu) and a few sentences on the right, in the same dark
   ground as the deck it leads to. It is the coach's screen, never the one
   turned around at the kids, so text is fine here. The same min-height:0
   discipline as .intro: the short landscape is the tablet that punishes a
   slide taller than the screen, and NEXT off the bottom strands a coach on a
   screen with no other way out. */
.tour{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--oob);
  padding:clamp(12px,2.2vh,26px) clamp(16px,3vw,44px);gap:clamp(8px,1.6vh,18px)}
/* the title row says what this screen is and how to leave it, the same shape
   as Settings' — a heading on the left and the way out on the right. "How it
   works" in small caps up there was not enough: a coach landing here cold
   could not tell he was in a walkthrough rather than the app, or that he was
   allowed to skip it */
.tourhead{flex:none;display:flex;align-items:center;justify-content:space-between;gap:16px;
  border-bottom:2px solid #39433C;padding-bottom:clamp(8px,1.4vh,12px)}
.tourhead h1{font-family:var(--disp);font-size:clamp(24px,4.2vh,40px);margin:0;letter-spacing:.01em;
  text-transform:uppercase;color:#F2F4F1;line-height:1}
.tourhead p{margin:3px 0 0;font-size:clamp(11px,1.6vh,14px);color:#8A968C;letter-spacing:.04em}
.tourhead p b{color:#C9D2CB;font-weight:600}
.tourhead .edit{flex:none}
.tourbody{flex:1;min-height:0;display:flex;align-items:center;gap:clamp(16px,3vw,46px)}
/* the one question before the tutorial: how many on the field. The tour's own
   frame and heading, three big answers, each with its format's base formation
   drawn so the count is something a coach sees, not reads. Centred with auto
   margins rather than justify-content, so a short screen scrolls instead of
   cutting the question off the top. */
.askbody{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;
  gap:clamp(12px,2.4vh,28px);overflow-y:auto;padding:4px}
.askbody>:first-child{margin-top:auto}
.askbody>:last-child{margin-bottom:auto}
.askbody h2{font-family:var(--disp);font-size:clamp(22px,4.4vh,44px);text-transform:uppercase;
  color:#F2F4F1;text-align:center;line-height:1.05;margin:0}
.askpick{width:min(100%,1100px);display:grid;grid-template-columns:repeat(3,1fr);
  gap:clamp(10px,1.6vw,24px)}
.askbtn{display:flex;flex-direction:column;align-items:stretch;gap:clamp(6px,1vh,10px);
  padding:clamp(8px,1.4vh,14px);border-radius:14px;background:#1A211D;
  border:2px solid #39433C;color:#C9D2CB;text-align:center;cursor:pointer}
.askbtn .thumbsvg{width:100%;max-height:clamp(90px,24vh,240px)}
.askbtn b{font-family:var(--disp);font-size:clamp(22px,4vh,40px);text-transform:uppercase;
  line-height:1;color:#F2F4F1}
.askbtn span{font-size:clamp(10px,1.6vh,14px);color:#8E9A91;line-height:1.3}
.askbtn.on{border-color:var(--green-2);background:#1E3328}
.askbtn:active{transform:scale(.97)}
.askbtn:focus-visible{outline:3px solid #5FBF8F;outline-offset:2px}
.asknote{font-size:clamp(11px,1.7vh,15px);color:#8E9A91;text-align:center;margin:0}
.tourart{flex:1 1 56%;min-width:0;min-height:0;height:100%;display:flex;align-items:center;
  justify-content:center;pointer-events:none}
.tourart>*{max-width:100%;max-height:100%}
/* a real tile, sized to its box like one on the deck — the container query on
   .tile does the work, so the name scales with the card. Bigger than the
   grid ever shows one, because this is the one screen where a single play
   gets the whole box to itself. */
.tourart .tile{width:min(100%,860px);cursor:default}
.tourart .tile:active{transform:none;box-shadow:none}
.tourart>.thumbsvg{width:min(100%,720px);border-radius:12px;border:1.5px solid #39433C}
/* the marker legend, in the play screen's own colours */
.tourmark{width:min(100%,720px);display:block}
.tourmark text{font-family:var(--disp);font-weight:700;font-size:17px;letter-spacing:.06em;
  text-anchor:middle}
/* the real field, at the real play screen's own aspect ratio (1140:672, the
   same ratio thumbSVG's viewBox already used, on purpose) so it drops into
   the same box the static thumbnail used to fill. It runs the real
   buildScene()/frame() loop — see startTourField() — so this is not a
   recording of the animation, it is the animation. */
.tourfield{width:min(100%,720px);aspect-ratio:1140/672;position:relative;
  border-radius:12px;border:1.5px solid #39433C;overflow:hidden;background:var(--oob)}
.tourfield #field{width:100%;height:100%;display:block;overflow:visible}
/* the menu, drawn open and in place instead of over the tiles, with a clock
   beside it — the two things in the top bar a coach reaches for between plays */
.tourmenu{display:flex;align-items:flex-start;gap:clamp(14px,2vw,28px);
  padding:clamp(14px,2.4vh,24px);border:1.5px solid #39433C;border-radius:16px;
  background:#1A211D}
.tourmenu .menu{position:static;box-shadow:none;min-width:210px}
.tourmenu .menu button.on{background:#2F3833;color:#fff}
.tourmenu .clock{pointer-events:none}
/* the pack strip and a slice of Setup, both the real classes — .pack, .seg,
   .setrow — boxed the same way the menu preview is, since none of these
   screens has a natural "card" edge of its own to borrow. */
.tourpacks,.toursettings{width:min(100%,640px);display:flex;flex-direction:column;
  gap:clamp(8px,1.4vh,14px);padding:clamp(14px,2.4vh,22px);border:1.5px solid #39433C;
  border-radius:16px;background:#1A211D}
.tourpacks .packs{padding-top:0}
.toursettings .setrow{gap:clamp(10px,1.6vw,20px)}
.toursay{flex:0 1 clamp(230px,36%,440px);min-width:0;min-height:0;overflow-y:auto;
  display:flex;flex-direction:column;justify-content:center;gap:clamp(8px,1.4vh,16px)}
.toursay h1{font-family:var(--disp);margin:0;line-height:1;letter-spacing:.01em;
  text-transform:uppercase;color:#F2F4F1;font-size:clamp(26px,5vh,50px)}
.toursay .sub{font-family:var(--disp);font-size:clamp(14px,2.4vh,22px);color:var(--ball);
  text-transform:uppercase;letter-spacing:.06em;line-height:1.1}
.toursay p{margin:0;color:#B4BEB6;line-height:1.4;font-size:clamp(12px,1.9vh,18px);max-width:38ch}
.toursay p b{color:#F2F4F1;font-weight:600}
/* three columns so the dots centre on the screen, not on what is left of the
   row once Back and Next have taken their end of it */
.tourfoot{flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  gap:clamp(8px,1vw,14px)}
.tourfoot .dots{grid-column:2;display:flex;justify-content:center;gap:9px}
.tourfoot .tourbtns{grid-column:3;justify-self:end;display:flex;gap:clamp(8px,1vw,14px)}
.tourfoot .dots i{width:10px;height:10px;border-radius:50%;background:#3B453E}
.tourfoot .dots i.on{background:var(--ball)}
.tourfoot .sbtn{min-width:clamp(90px,10vw,140px)}
@media (orientation:portrait){
  .tourbody{flex-direction:column;justify-content:center;gap:clamp(12px,2vh,28px)}
  .tourart{flex:0 1 auto;width:100%;height:auto;max-height:52%}
  .toursay{flex:0 1 auto;width:100%;align-items:center;text-align:center}
  .toursay p{max-width:44ch}
}
/* ------------------------------------------------------------- designer
   The play screen's own layout — bar, field, rail, strip — because it draws
   the play screen's own field. It is a coach's screen at a table, so the rail
   holds more buttons than the play screen's three, smaller, and scrolls
   rather than pushing anything off the short landscape. */
.dzrail{justify-content:flex-start;overflow-y:auto;overscroll-behavior:contain;
  gap:clamp(5px,1vh,10px);scrollbar-width:thin}
.dzrail .rbtn{padding:clamp(6px,1.3vh,13px) 4px;min-height:46px}
.dzrail .rbtn[disabled]{opacity:.4}
.dzrail .rbtn.sub{background:var(--ground)}
.dzrail .rbtn.sub.on{background:var(--ink);color:#fff}
.dzrail .rsep{flex:none;height:1.5px;background:var(--hair);margin:1px 2px}
.designer #field{touch-action:none;cursor:crosshair}
.dznext:not(.armed){animation:dzpulse 1.2s ease-in-out infinite}
@keyframes dzpulse{50%{stroke-opacity:.25}}
@media (prefers-reduced-motion:reduce){.dznext{animation:none}}
.dzline{flex:none;padding:clamp(5px,.9vh,9px) clamp(10px,1.4vw,18px);
  font-size:clamp(11px,1.7vh,15px);font-weight:600;line-height:1.3;
  background:var(--surface);border-top:1.5px solid var(--hair);color:var(--ink-2)}
.dzline.err{background:#FBE9E6;color:#8E2418}
.dzline.warn{background:#FBF2DF;color:#6B4A00}
.dzline.ok{color:var(--run)}
.dzline.note{background:#E8F1FC;color:#174E93}
.designer .calls{max-height:clamp(58px,13vh,110px);overflow-y:auto}
.fmpick{display:grid;grid-template-columns:1fr 1fr;gap:clamp(8px,1.4vh,14px)}
.fmbtn{display:flex;flex-direction:column;gap:6px;align-items:stretch;padding:8px;
  border-radius:12px;background:#141A16;border:1.5px solid #39433C}
.fmbtn b{font-family:var(--disp);font-size:clamp(14px,2.3vh,20px);text-transform:uppercase;
  letter-spacing:.04em;color:#EDF0EC}
.fmbtn:active{transform:scale(.97)}
.seg.wrap{flex-wrap:wrap}
.seg button[data-cat].on{background:var(--cat);border-color:var(--cat)}
.sheet .seg button{min-height:44px;padding:0 10px}
.nfield input.plain{text-transform:none;font-family:var(--body);font-size:clamp(14px,2.2vh,18px)}
.catchip.mine{background:#56657A}
.lnum.mine{color:var(--ball)}
.lren.mine{color:#8FC9A8}
.lfix{font-style:normal;color:#F08A7E}
.lrow.on .lfix{color:#B23A2B}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){.tile,.rbtn,.start{transition:none}}

/* The designer shows more backfield than the play screen. Two backs behind
   the THROWER, a pitch and a reverse are all drawn back there, and on the
   play screen the field stops 6.5 yards behind the line — the deepest spot a
   coach could tap sat on the bottom edge. So the designer's field runs on to
   DZ_BOT, two yards past the deepest anyone can be put (FIELD_BOT — deeper
   than that and the play screen would clip him), and its markers are drawn
   smaller, because it is a coach at a table and not six kids across a
   sideline. Same SCALE, so a yard is a yard on both screens; the taller
   viewBox is what shrinks it to fit. */
const FIELD_BOT = -6.5, DZ_BOT = -8.5;
const dzView = () => S.screen === "designer";
const fieldBot = () => dzView() ? DZ_BOT : FIELD_BOT;
const vbH = () => dzView() ? (TOPY - DZ_BOT) * SCALE : VB_H;
let mAnim = 0;                       // 0..1 current mirror
let mTarget = 0;

function W2S(x, y){                    // players, routes, ball — these mirror
  return [CX + x * (1 - 2 * mAnim) * SCALE, (TOPY - y) * SCALE];
}
function F2S(x, y){                    // field paint — never moves
  return [CX + x * SCALE, (TOPY - y) * SCALE];
}
const pt  = p => W2S(p[0], p[1]).join(",");
const fpt = p => F2S(p[0], p[1]).join(",");

function lens(pts){
  const out = [0];
  for (let i = 1; i < pts.length; i++){
    out.push(out[i-1] + Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]));
  }
  return out;
}
function walk(pts, t){            // t 0..1 of total length -> {pts:[...], end:[x,y]}
  const L = lens(pts), total = L[L.length-1];
  if (total === 0) return {pts:[pts[0]], end:pts[0]};
  const target = Math.max(0, Math.min(1, t)) * total;
  const keep = [pts[0]];
  for (let i = 1; i < pts.length; i++){
    if (L[i] <= target){ keep.push(pts[i]); continue; }
    const f = (target - L[i-1]) / (L[i] - L[i-1]);
    const p = [pts[i-1][0] + (pts[i][0]-pts[i-1][0])*f, pts[i-1][1] + (pts[i][1]-pts[i-1][1])*f];
    keep.push(p);
    return {pts:keep, end:p};
  }
  return {pts:keep, end:pts[pts.length-1]};
}
function fracNear(pts, q){        // fraction along pts of the point nearest q
  const L = lens(pts), total = L[L.length-1];
  if (total === 0) return 0;
  let best = Infinity, along = 0;
  for (let i = 1; i < pts.length; i++){
    const ax = pts[i-1][0], ay = pts[i-1][1], dx = pts[i][0]-ax, dy = pts[i][1]-ay;
    const l2 = dx*dx + dy*dy;
    const f = l2 < 1e-9 ? 0 : Math.max(0, Math.min(1, ((q[0]-ax)*dx + (q[1]-ay)*dy) / l2));
    const d = Math.hypot(q[0] - (ax + f*dx), q[1] - (ay + f*dy));
    if (d < best){ best = d; along = L[i-1] + f*Math.sqrt(l2); }
  }
  return along / total;
}
const runPathOf = (play, who) =>
  play.paths.findIndex(p => p.who === who && (p.type === "run" || p.type === "route"));
function qbez(a, b, c, t){
  const u = 1 - t;
  return [u*u*a[0] + 2*u*t*b[0] + t*t*c[0], u*u*a[1] + 2*u*t*b[1] + t*t*c[1]];
}
/* The throw: one arc from where the thrower lets it go to the end of the
   target's route, bowed a little so it reads as a flight and not a fourth
   route. It leaves the THROWER's spot — or, when the ball was handed to
   somebody first, the end of that kid's run. The play screen and the
   thumbnail both draw it from these three points, so a tile is a small
   picture of exactly what the big screen will show. Null on a run. */
function throwArc(play){
  if (play.ball.mode === "carry") return null;
  const idx = play.paths.findIndex(p => p.who === play.ball.who);
  if (idx < 0) return null;
  const legs = play.ball.legs;
  const src = legs ? play.paths[legs[legs.length - 1].path].pts.slice(-1)[0]
                   : [play.spots.QB.x, play.spots.QB.y];
  const dst = play.paths[idx].pts[play.paths[idx].pts.length - 1];
  const mid = [(src[0]+dst[0])/2, (src[1]+dst[1])/2];
  const dx = dst[0]-src[0], dy = dst[1]-src[1];
  return {idx, src, ctrl:[mid[0] - dy*0.16, mid[1] + dx*0.16], dst};
}
const throwPts = (arc, n = 24) =>
  Array.from({length:n + 1}, (_, i) => qbez(arc.src, arc.ctrl, arc.dst, i / n));

/* ------------------------------------------------------------ timeline */
const HOLD = 700, YD = 150, TAIL = 1500;
function buildTimeline(play){
  const tl = {paths:[], tSnap:HOLD, tEnd:0};
  let motionEnd = HOLD;
  play.paths.forEach((p, i) => {
    const L = lens(p.pts).pop();
    if (p.type === "motion"){
      const dur = Math.max(600, L * 190);
      tl.paths[i] = {start:HOLD, dur};
      motionEnd = Math.max(motionEnd, HOLD + dur);
    }
  });
  tl.tSnap = motionEnd > HOLD ? motionEnd + 120 : HOLD;
  play.paths.forEach((p, i) => {
    if (tl.paths[i]) return;
    const L = lens(p.pts).pop();
    const quick = (p.type === "handoff");
    const dur = quick ? Math.max(240, L*140) : Math.max(480, L*YD);
    tl.paths[i] = {start:tl.tSnap, dur};
  });
  // A handoff by a kid who is already running starts when he gets there, not
  // at the snap — the second exchange of a reverse is most of a second in.
  play.paths.forEach((p, i) => {
    if (p.type !== "handoff") return;
    const ri = runPathOf(play, p.who);
    if (ri < 0) return;
    const rs = tl.paths[ri];
    tl.paths[i].start = rs.start + rs.dur * fracNear(play.paths[ri].pts, p.pts[0]);
  });
  // ball
  const b = play.ball;
  // The ball is wherever the kid holding it is. It changes hands where a
  // handoff arrow ends, at the moment the giver gets there — so a reverse
  // shows the first runner carrying it and then the second, instead of the
  // second runner holding it from the snap. A pass thrown by somebody other
  // than the THROWER has legs too: the sweep he takes before he throws.
  const legTimes = () => {
    const legs = (b.legs || [{who:b.who, path:runPathOf(play, b.who)}])
      .map(l => ({who:l.who, pathIdx:l.path, handoff:l.handoff}));
    legs.forEach((l, k) => {
      if (k === 0){ l.start = tl.paths[l.pathIdx].start; return; }
      const giver = legs[k-1], seg = tl.paths[giver.pathIdx];
      const h = play.paths[l.handoff], to = h.pts[h.pts.length-1];
      l.start = seg.start + seg.dur * fracNear(play.paths[giver.pathIdx].pts, to);
    });
    return legs;
  };
  const legEnd = legs => { const ls = tl.paths[legs[legs.length-1].pathIdx]; return ls.start + ls.dur; };
  if (b.mode === "carry"){
    const legs = legTimes();
    tl.ball = {mode:"carry", pathIdx:legs[legs.length-1].pathIdx, legs,
               start:legs[0].start, dur:legEnd(legs) - legs[0].start};
  } else {
    const idx = play.paths.findIndex(p => p.who === b.who);
    const tp = tl.paths[idx] || {start:tl.tSnap, dur:1200};
    const arrive = tp.start + tp.dur;
    // the frame draws the ball along the arc and the dashed throw line behind
    // it, so both come from the same three points
    const {src, ctrl, dst} = throwArc(play);
    // it leaves the THROWER's hands just after the snap — or the runner's
    // when his run ends — and lands as the receiver gets there
    const legs = b.legs ? legTimes() : null;
    const ready = legs ? legEnd(legs) : tl.tSnap + 120;
    const start = Math.max(ready, arrive - 620);
    tl.ball = {mode:"pass", pathIdx:idx, legs, thrower:b.thrower || "QB",
               start, dur:Math.max(300, arrive - start), arrive, src, ctrl, dst};
  }
  tl.tEnd = Math.max(...tl.paths.map(p => p.start + p.dur),
                     tl.ball.start + tl.ball.dur) + TAIL;
  return tl;
}
