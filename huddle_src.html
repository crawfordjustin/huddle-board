/* ------------------------------------------------------------ scene */
const N = "http://www.w3.org/2000/svg";
let SC = null;
let fieldRO = null;
function mk(tag, attrs){
  const e = document.createElementNS(N, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
function buildScene(){
  const svg = document.getElementById("field");
  svg.innerHTML = "";
  const defs = mk("defs");
  [["route","#232B26"],["run","#127A4D"],["motion","#C9700D"],["handoff","#5B6472"],
   ["fake","#127A4D"]].forEach(([k,c]) => {
    const m = mk("marker",{id:"a-"+k,viewBox:"0 0 10 10",refX:8.4,refY:5,markerWidth:5,
      markerHeight:5,orient:"auto-start-reverse"});
    m.appendChild(mk("path",{d:"M0 0 L10 5 L0 10 z",fill:c}));
    defs.appendChild(m);
  });
  // Out of bounds is hatched on both sides, but the hatch carries the side's
  // colour so the dark border itself says BLUE or ORANGE. The base square stays
  // exactly --oob so the strip never seams against the page behind the field.
  [["blue","#31496A"],["orange","#6B4525"]].forEach(([side,ink]) => {
    const hp = mk("pattern",{id:"oob-"+side,width:14,height:14,
      patternUnits:"userSpaceOnUse"});
    hp.appendChild(mk("rect",{width:14,height:14,fill:"#1E2521"}));
    hp.appendChild(mk("path",{d:"M0 0 L14 14 M14 0 L0 14",
      stroke:ink,"stroke-width":2.2,"stroke-linecap":"round"}));
    defs.appendChild(hp);
  });
  svg.appendChild(defs);

  SC = {washL:null, washR:null, yard:[], side:{}, los:null, paths:[], players:{},
        ball:null, ballAng:0, overX:0, overY:0};

  // How far the letterbox reaches past the viewBox, in viewBox units. Measured
  // on resize rather than per frame — getBoundingClientRect forces layout.
  const measure = () => {
    const b = svg.getBoundingClientRect();
    const k = Math.min(b.width / VB_W, b.height / VB_H);
    if (!k || !isFinite(k)) return;
    SC.overX = Math.max(0, (b.width / k - VB_W) / 2);
    SC.overY = Math.max(0, (b.height / k - VB_H) / 2);
  };
  measure();
  if (window.ResizeObserver){
    if (fieldRO) fieldRO.disconnect();
    fieldRO = new ResizeObserver(measure);
    fieldRO.observe(svg);
  }

  SC.base = mk("rect",{fill:"#F7F9F6"});
  svg.appendChild(SC.base);
  SC.oob = {};
  ["blue","orange"].forEach(side => {
    const g = mk("g"); g.style.cursor = "pointer";
    const r = mk("rect",{fill:"url(#oob-"+side+")"});
    // dominant-baseline:central is what actually centres these. The text is
    // rotated 90°, so the baseline runs vertically and the glyphs would
    // otherwise hang off one side of the anchor point instead of straddling it.
    const lbl = mk("text",{"text-anchor":"middle","dominant-baseline":"central",
      "font-size":15,"font-weight":700,
      fill:side === "blue" ? "#7E8B9C" : "#948375","letter-spacing":3.5,
      "font-family":"Barlow Condensed, Arial Narrow, sans-serif"});
    lbl.textContent = "OUT OF BOUNDS";
    const badge = mk("rect",{rx:7,fill:"#F2F4F1",stroke:"#5C665F","stroke-width":1.5});
    const btxt = mk("text",{"text-anchor":"middle","dominant-baseline":"central",
      "font-size":16,"font-weight":700,fill:"#141A16",
      "letter-spacing":2.2,"font-family":"Barlow Condensed, Arial Narrow, sans-serif"});
    g.appendChild(r); g.appendChild(lbl); g.appendChild(badge); g.appendChild(btxt);
    g.addEventListener("click", () => { setOurSide(side); logEvent("our_side", {side}); });
    svg.appendChild(g);
    SC.oob[side] = {g, r, lbl, badge, btxt};
  });
  SC.goal = mk("polygon",{fill:"#1B5E3A","fill-opacity":.14});
  SC.goalT = mk("text",{"text-anchor":"middle","font-size":30,"font-weight":700,
    fill:"#1B5E3A","letter-spacing":6,
    "font-family":"Barlow Condensed, Arial Narrow, sans-serif"});
  SC.goalT.textContent = "GOAL";
  SC.washL = mk("polygon",{fill:"#1D6FD0","fill-opacity":.075});
  SC.washR = mk("polygon",{fill:"#E4610F","fill-opacity":.075});
  svg.appendChild(SC.washL); svg.appendChild(SC.washR);
  svg.appendChild(SC.goal); svg.appendChild(SC.goalT);

  [5,10].forEach(() => { const l = mk("line",{stroke:"#C8D0C9","stroke-width":2,
    "stroke-dasharray":"7 9"}); SC.yard.push(l); svg.appendChild(l); });
  SC.los = mk("line",{stroke:"#8A948C","stroke-width":4}); svg.appendChild(SC.los);
  SC.side.blue = mk("line",{stroke:"#1D6FD0","stroke-width":11,"stroke-linecap":"round"});
  SC.side.orange = mk("line",{stroke:"#E4610F","stroke-width":11,"stroke-linecap":"round"});
  svg.appendChild(SC.side.blue); svg.appendChild(SC.side.orange);

  const p = S.play;
  p.paths.forEach((path, i) => {
    const g = {};
    const col = {route:"#232B26",run:"#127A4D",motion:"#C9700D",handoff:"#5B6472",
                 fake:"#127A4D"}[path.type];
    g.line = mk("polyline",{fill:"none",stroke:col,
      "stroke-width": path.type === "run" ? 8 : 6,
      "stroke-linejoin":"round","stroke-linecap":"round",
      "stroke-dasharray": (path.type === "motion" ? "16 11" : path.type === "handoff" ? "13 9"
                          : path.type === "fake" ? "17 11" : "")});
    if ((path.end || "arrow") !== "bar") g.line.setAttribute("marker-end", `url(#a-${path.type})`);
    else g.bar = mk("line",{stroke:col,"stroke-width":6,"stroke-linecap":"round"});
    svg.appendChild(g.line); if (g.bar) svg.appendChild(g.bar);
    SC.paths.push(g);
  });
  // The throw. A handoff already leaves a dashed grey line behind the ball, so
  // a pass leaves the same one: one picture for "this is where the ball goes",
  // whether it is handed or thrown. It draws out under the ball as it flies
  // and stays put after the catch, because the ball alone was too easy to
  // miss on a screen with six routes on it.
  SC.throw = null;
  if (p.ball.mode !== "carry"){
    SC.throw = mk("polyline",{fill:"none",stroke:"#5B6472","stroke-width":6,
      "stroke-linejoin":"round","stroke-linecap":"round","stroke-dasharray":"13 9",
      "marker-end":"url(#a-handoff)",opacity:0});
    svg.appendChild(SC.throw);
  }

  for (const key in p.spots){
    const sp = p.spots[key];
    const g = mk("g");
    g.style.cursor = "pointer";
    const halo = mk("circle",{r:33,fill:"none",stroke:"#FFC400","stroke-width":5,opacity:0});
    // shape carries the role, so identity does not depend on reading a letter
    const role = sp.name === "SNAPPER" ? "snap" : sp.name === "THROWER" ? "throw"
               : sp.name === "BACK" ? "back" : "wr";
    const shape = role === "wr" ? mk("circle",{r:12.5})
                : mk(role === "snap" ? "rect" : "polygon", {});
    shape.setAttribute("stroke-width", 4);
    // No letters on the markers, in either stage. "W" and "SN" mean nothing to
    // a 7-year-old — he knows he is WIDE BLUE. Shape says what kind of job,
    // colour says which side, and the words underneath say it out loud.
    // paint-order:stroke draws the halo behind the glyphs, so a route line
    // running under a name does not turn it to mush
    const lbl = () => mk("text",{"text-anchor":"middle","font-weight":800,"font-size":17,
      "font-family":"Barlow Condensed, Arial Narrow, sans-serif","letter-spacing":.6,
      "paint-order":"stroke", stroke:"#F7F9F6", "stroke-width":3.5,
      "stroke-linejoin":"round"});
    const l1 = lbl(), l2 = lbl();
    g.appendChild(halo); g.appendChild(shape);
    g.appendChild(l1); g.appendChild(l2);
    g.addEventListener("click", () => {
      S.hintSeen = true;
      S.solo = (S.solo === key) ? null : key;
      if (S.solo) logEvent("solo", {play: S.play.id, spot: key,
                                    name: S.play.spots[key].name});
      renderCalls(); syncRail();
    });
    svg.appendChild(g);
    SC.players[key] = {g, shape, halo, l1, l2, role};
  }

  // A football, not a yellow dot, and it points where it is going. The only job
  // this marker has is telling six seven-year-olds where the ball ends up, and
  // they already know what a football looks like.
  SC.ball = mk("g");
  SC.ball.appendChild(mk("path",{d:BALL_BODY,fill:BALL_FILL,stroke:BALL_EDGE,
    "stroke-width":3,"stroke-linejoin":"round"}));
  SC.ball.appendChild(mk("path",{d:BALL_LACES,fill:"none",stroke:BALL_LACE,
    "stroke-width":3,"stroke-linecap":"round"}));
  svg.appendChild(SC.ball);
}

/* ------------------------------------------------------------ frame */
function frame(now){
  requestAnimationFrame(frame);
  paintClock();
  if (S.screen !== "play" || !SC) return;

  const k = REDUCED ? 1 : 0.085;
  const wasMirrored = mAnim > 0.5;
  mAnim += (mTarget - mAnim) * k;
  if (Math.abs(mTarget - mAnim) < 0.001) mAnim = mTarget;
  if ((mAnim > 0.5) !== wasMirrored) renderCalls();

  const p = S.play, tl = S.tl;
  const running = S.stage === "run";
  const t = running ? (now - S.t0) % tl.tEnd : 0;

  // field
  const bt = F2S(-EDGE, 15), bb = F2S(EDGE, -6.5);
  SC.base.setAttribute("x", bt[0]); SC.base.setAttribute("y", bt[1]);
  SC.base.setAttribute("width", bb[0] - bt[0]); SC.base.setAttribute("height", bb[1] - bt[1]);
  const half = [[-EDGE,-6.5],[0,-6.5],[0,15],[-EDGE,15]];
  SC.washL.setAttribute("points", half.map(fpt).join(" "));
  SC.washR.setAttribute("points", half.map(q => fpt([-q[0], q[1]])).join(" "));
  SC.goal.setAttribute("points",
    [[-EDGE,13.3],[EDGE,13.3],[EDGE,15],[-EDGE,15]].map(fpt).join(" "));
  const gt = F2S(0, 14.15);
  SC.goalT.setAttribute("x", gt[0]); SC.goalT.setAttribute("y", gt[1] + 10);
  [5,10].forEach((yv, i) => {
    const a = F2S(-EDGE, yv), b = F2S(EDGE, yv);
    SC.yard[i].setAttribute("x1",a[0]); SC.yard[i].setAttribute("y1",a[1]);
    SC.yard[i].setAttribute("x2",b[0]); SC.yard[i].setAttribute("y2",b[1]);
  });
  const la = F2S(-EDGE,0), lb = F2S(EDGE,0);
  SC.los.setAttribute("x1",la[0]); SC.los.setAttribute("y1",la[1]);
  SC.los.setAttribute("x2",lb[0]); SC.los.setAttribute("y2",lb[1]);
  [["blue",-EDGE],["orange",EDGE]].forEach(([nm,xv]) => {
    const a = F2S(xv,-6.5), b = F2S(xv,15), e = SC.side[nm];
    e.setAttribute("x1",a[0]); e.setAttribute("y1",a[1]);
    e.setAttribute("x2",b[0]); e.setAttribute("y2",b[1]);
  });
  // out-of-bounds strips, sideline labels, parents badge
  [["blue",-1],["orange",1]].forEach(([nm,dir]) => {
    const o = SC.oob[nm];
    const inner = F2S(dir * EDGE, 15)[0];
    // bleed into the letterbox so the strip runs to the edge of the screen —
    // and centre the labels on that whole visible band, not on the viewBox slice
    const ox = SC.overX, oy = SC.overY;
    const x = dir < 0 ? -ox : inner;
    const w = dir < 0 ? inner + ox : VB_W - inner + ox;
    o.r.setAttribute("x", x); o.r.setAttribute("y", -oy);
    o.r.setAttribute("width", Math.max(0, w));
    o.r.setAttribute("height", VB_H + 2 * oy);
    const cx = x + w / 2, ours = ourSide === nm;
    o.lbl.setAttribute("transform", `translate(${cx} ${VB_H*0.76}) rotate(${dir<0?-90:90})`);
    o.lbl.setAttribute("opacity", .8);
    o.btxt.textContent = ours ? "OUR SIDE" : "THEIR SIDE";
    const h = ours ? 132 : 152;
    o.badge.setAttribute("x", cx - 16); o.badge.setAttribute("y", VB_H*0.30 - h/2);
    o.badge.setAttribute("width", 32); o.badge.setAttribute("height", h);
    o.badge.setAttribute("fill", ours ? "#F2F4F1" : "none");
    o.badge.setAttribute("stroke", ours ? "none" : "#4B554E");
    o.btxt.setAttribute("fill", ours ? "#141A16" : "#8B978D");
    o.btxt.setAttribute("transform",
      `translate(${cx} ${VB_H*0.30}) rotate(${dir<0?-90:90})`);
  });

  // routes
  p.paths.forEach((path, i) => {
    const g = SC.paths[i], seg = tl.paths[i];
    const prog = running ? Math.max(0, Math.min(1, (t - seg.start) / seg.dur)) : 0;
    let op = 0;
    if (prog > 0){
      op = p.jobs.includes(path.who) ? 1 : 0.34;
      if (S.solo) op = (path.who === S.solo) ? 1 : 0.07;
    }
    g.line.setAttribute("opacity", op);
    if (g.bar) g.bar.setAttribute("opacity", op);
    if (prog <= 0) return;
    const w = walk(path.pts, prog);
    g.line.setAttribute("points", w.pts.map(pt).join(" "));
    if (g.bar && prog > 0.985){
      const n = w.pts.length, a = w.pts[n-2] || w.pts[0], b = w.pts[n-1];
      const dx = b[0]-a[0], dy = b[1]-a[1], d = Math.hypot(dx,dy) || 1;
      const nx = -dy/d*0.45, ny = dx/d*0.45;
      const s1 = W2S(b[0]-nx, b[1]-ny), s2 = W2S(b[0]+nx, b[1]+ny);
      g.bar.setAttribute("x1",s1[0]); g.bar.setAttribute("y1",s1[1]);
      g.bar.setAttribute("x2",s2[0]); g.bar.setAttribute("y2",s2[1]);
    } else if (g.bar) g.bar.setAttribute("opacity", 0);
  });

  // players
  const lining = !running;                       // LINE UP stage
  const R = lining ? 17 : 12.5;
  for (const key in SC.players){
    const sp = p.spots[key], P = SC.players[key], c = W2S(sp.x, sp.y);
    P.g.setAttribute("transform", `translate(${c[0].toFixed(1)} ${c[1].toFixed(1)})`);

    const sd = sideOf(key);
    const stroke = SIDE[sd];
    const fill = sd === "none" ? "#fff" : sd === "blue" ? "#E8F1FC" : "#FDEEE4";
    if (P.role === "wr"){                         // receiver — circle
      P.shape.setAttribute("r", R);
    } else if (P.role === "back"){                // back — diamond
      const d = R * 1.24;
      P.shape.setAttribute("points", `0,${-d} ${d},0 0,${d} ${-d},0`);
    } else if (P.role === "throw"){               // thrower — hexagon
      const d = R * 1.16;
      P.shape.setAttribute("points",
        [0,60,120,180,240,300].map(a => {
          const r = a * Math.PI / 180;
          return `${(Math.sin(r)*d).toFixed(1)},${(-Math.cos(r)*d).toFixed(1)}`;
        }).join(" "));
    } else {                                      // snapper — square
      const w = R * 1.82;
      P.shape.setAttribute("x", -w/2); P.shape.setAttribute("y", -w/2);
      P.shape.setAttribute("width", w); P.shape.setAttribute("height", w);
      P.shape.setAttribute("rx", 3);
    }
    P.shape.setAttribute("fill", fill);
    P.shape.setAttribute("stroke", stroke);

    P.halo.setAttribute("r", R + 8);
    P.halo.setAttribute("opacity",
      S.solo ? (S.solo === key ? 1 : 0) : (key === p.primary ? 0.95 : 0));

    // Same words in both stages. Lining up there is room for the whole name on
    // two lines; once six kids are moving, two-line labels collide with each
    // other and with the routes, so it drops to the first word — the colour of
    // the marker and of the text is already saying BLUE or ORANGE.
    const words = sideName(key).split(" ");
    P.l1.textContent = words[0];
    P.l2.textContent = lining ? (words[1] || "") : "";
    const twoLine = lining && !!words[1];
    // players in the backfield get their name above, so it never runs off the edge
    const above = sp.y < -2.5;
    if (above){
      P.l1.setAttribute("y", -(R + (twoLine ? 24 : 9)));
      P.l2.setAttribute("y", -(R + 7));
    } else {
      P.l1.setAttribute("y", R + 20); P.l2.setAttribute("y", R + 37);
    }
    [P.l1, P.l2].forEach(t => t.setAttribute("fill", sd === "none" ? "#141A16" : stroke));

    P.g.setAttribute("opacity", S.solo ? (S.solo === key ? 1 : 0.22) : 1);
  }

  // ball — nose first, so the shape itself says which way it is travelling.
  // `ahead` is the same motion a moment later; the heading comes from the two
  // of them in *screen* space, which is what keeps it right under mirroring.
  const b = tl.ball;
  const STEP = 0.02;
  let show = false, bp = null, ahead = null;
  if (running && !S.solo){
    if (b.mode === "pass" && t >= b.start){
      const f = Math.max(0, Math.min(1, (t - b.start) / b.dur));
      bp = qbez(b.src, b.ctrl, b.dst, f);
      ahead = qbez(b.src, b.ctrl, b.dst, Math.min(1, f + STEP));
      show = true;
    } else if (b.legs){
      // whoever is holding it: the last leg that has started. On a pass this
      // is the runner carrying it up to the moment he throws.
      let leg = null;
      for (const l of b.legs) if (t >= l.start) leg = l;
      if (leg){
        const seg = tl.paths[leg.pathIdx], pts = p.paths[leg.pathIdx].pts;
        const prog = Math.max(0, Math.min(1, (t - seg.start) / seg.dur));
        bp = walk(pts, prog).end;
        ahead = walk(pts, Math.min(1, prog + STEP)).end;
        show = true;
      }
    }
  }
  // the throw line grows under the ball and stays after the catch. It keeps
  // drawing in solo, dimmed like the other routes, so tapping the receiver
  // still shows the ball coming to him.
  if (SC.throw){
    const f = running && t >= b.start ? Math.max(0, Math.min(1, (t - b.start) / b.dur)) : 0;
    let op = 0;
    if (f > 0){
      const who = p.paths[b.pathIdx].who;
      op = S.solo ? ((S.solo === who || S.solo === b.thrower) ? 1 : 0.07) : 1;
      const n = Math.max(2, Math.ceil(f * 24));
      const arc = [];
      for (let i = 0; i <= n; i++){
        const w = qbez(b.src, b.ctrl, b.dst, f * i / n);
        arc.push(pt(w));
      }
      SC.throw.setAttribute("points", arc.join(" "));
    }
    SC.throw.setAttribute("opacity", op);
  }
  if (show && bp){
    const s = W2S(bp[0], bp[1]), s2 = W2S(ahead[0], ahead[1]);
    // once it has arrived there is no "ahead" left, so hold the last heading
    // rather than letting the ball snap flat at the moment it is caught
    if (Math.hypot(s2[0] - s[0], s2[1] - s[1]) > 0.5)
      SC.ballAng = Math.atan2(s2[1] - s[1], s2[0] - s[0]) * 180 / Math.PI;
    const done = (b.mode === "carry")
      ? t > tl.paths[b.pathIdx].start + tl.paths[b.pathIdx].dur
      : t > b.start + b.dur;
    // Arrived: the ball swells and breathes where the ring used to pulse. The
    // players stay on their spots through the whole animation, so this marker is
    // the only thing on screen saying where the ball finished.
    const k = !done ? 1 : REDUCED ? 1.25 : 1.25 + 0.18 * Math.sin(t / 130);
    SC.ball.setAttribute("transform",
      `translate(${s[0]} ${s[1]}) rotate(${SC.ballAng.toFixed(1)}) scale(${k.toFixed(3)})`);
    SC.ball.setAttribute("opacity", 1);
  } else {
    SC.ball.setAttribute("opacity", 0);
  }
}

/* ------------------------------------------------------------ full screen
   A page cannot hide Chrome's address bar in an ordinary tab — only an
   installed launch (display:fullscreen) or the Fullscreen API can. So: offer
   the button when we are NOT already immersive, and hide it when we are.
   Orientation lock is also gated on fullscreen/installed, which is why it
   silently did nothing in a tab.                                            */
function isImmersive(){
  return matchMedia("(display-mode: fullscreen)").matches
      || matchMedia("(display-mode: standalone)").matches
      || matchMedia("(display-mode: minimal-ui)").matches
      || navigator.standalone === true
      || !!document.fullscreenElement;
}
function canFullscreen(){
  return !!(document.documentElement.requestFullscreen
         || document.documentElement.webkitRequestFullscreen);
}
async function goFullscreen(){
  const el = document.documentElement;
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else await (el.requestFullscreen ? el.requestFullscreen({navigationUI: "hide"})
                                     : el.webkitRequestFullscreen());
  } catch(e){}
  try { await screen.orientation.lock("landscape"); } catch(e){}
  logEvent("fullscreen", {on: !!document.fullscreenElement});
  if (S.screen === "deck") renderDeck();
}
addEventListener("fullscreenchange", () => { if (S.screen === "deck") renderDeck(); });

/* ------------------------------------------------ update from the server
   Service workers only exist over http(s); opened as a local file this whole
   block is skipped and the app still runs, just without update checks.      */
let updateReady = false, swWaiting = null;
function applyUpdate(){
  if (swWaiting) swWaiting.postMessage({type: "SKIP_WAITING"});
}
function markUpdate(worker){
  swWaiting = worker; updateReady = true;
  logEvent("update_ready");
  // never interrupt a live play: only the two screens that offer the button
  // redraw, and neither of them is the one turned around at the kids
  if (S.screen === "deck") renderDeck();
  else if (S.screen === "intro") renderIntro();
}
if ("serviceWorker" in navigator && location.protocol.startsWith("http")){
  navigator.serviceWorker.register("./sw.js").then(reg => {
    if (reg.waiting) markUpdate(reg.waiting);
    reg.addEventListener("updatefound", () => {
      const nw = reg.installing;
      if (!nw) return;
      nw.addEventListener("statechange", () => {
        if (nw.state === "installed" && navigator.serviceWorker.controller) markUpdate(nw);
      });
    });
    // look for a new build whenever the coach comes back to the app
    addEventListener("visibilitychange", () => {
      if (!document.hidden) reg.update().catch(() => {});
    });
  }).catch(() => {});
  let reloading = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (reloading) return;
    reloading = true;
    location.reload();
  });
}

/* ------------------------------------------------------------ boot */
async function keepAwake(){
  try { if ("wakeLock" in navigator) await navigator.wakeLock.request("screen"); } catch(e){}
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") keepAwake();
});
// only meaningful once installed or fullscreen; harmless otherwise
try { if (isImmersive() && screen.orientation && screen.orientation.lock)
        screen.orientation.lock("landscape").catch(() => {}); } catch(e){}
logEvent("session_start", {build: APP_BUILD, w0: SESSION.w0,
  tz: (Intl.DateTimeFormat().resolvedOptions().timeZone || ""),
  tzOffMin: new Date().getTimezoneOffset(),
  deck: deck.slice(), cfg: Object.assign({}, cfg)});
keepAwake();
renderIntro();
requestAnimationFrame(frame);
</script>
