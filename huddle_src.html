<title>Huddle Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#F2F4F1; --surface:#FBFCFA; --ink:#141A16; --ink-2:#4A554E;
  --hair:#D8DED8; --blue:#1D6FD0; --orange:#E4610F; --ball:#FFC400;
  --green:#1B5E3A; --green-2:#154C2F;
  --oob:#1E2521; --oob-hatch:#38423B; --oob-ink:#7C887F;
  --run:#127A4D; --route:#232B26;
  --pass:#2A6FD6; --pass-lt:#7FB2F2;   /* run vs pass, legible on either ground */
  --disp:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow","Helvetica Neue",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--oob);color:var(--ink);
  font-family:var(--body);-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:3px solid var(--green);outline-offset:2px}
#app{position:fixed;inset:0;display:flex;flex-direction:column}

/* ---------------------------------------------------------------- deck
   Dark ground, light plays. The cards are the content; the chrome recedes. */
/* min-height:0 is load-bearing. A flex item defaults to min-height:auto, so
   without this .deck grows to fit its content instead of the screen, and the
   scrollers inside it (.tiles, .lib) never have a reason to scroll — rows just
   fall off the bottom of the tablet, unreachable. Breaks past ~22 plays. */
.deck{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--oob);
  padding:clamp(14px,2.2vh,26px) clamp(16px,2.4vw,34px)}
.deckhead{display:flex;align-items:baseline;justify-content:space-between;gap:16px;
  border-bottom:2px solid #39433C;padding-bottom:10px;flex:none}
.deckhead h1{font-family:var(--disp);font-size:clamp(26px,4.4vh,40px);margin:0;letter-spacing:.01em;
  text-transform:uppercase;color:#F2F4F1}
.deckhead p,.decktop p{margin:0;font-size:clamp(11px,1.6vh,14px);color:#8A968C;letter-spacing:.13em;
  text-transform:uppercase;font-weight:600}
.dh-right{display:flex;align-items:center;gap:clamp(10px,1.5vw,20px)}
/* The deck has no title row. It is the screen a coach picks plays from, so
   every line of chrome above the tiles is a row of plays he cannot see: the
   filter chips sit on the left of one bar and the clock, the count and the
   menu on its right. Change plays lives in the menu with Setup and Exit. */
.decktop{flex:none;display:flex;align-items:center;justify-content:space-between;
  gap:clamp(10px,1.5vw,20px)}
.decktop .dfilt{flex:1 1 0;min-width:0;padding:0}
.decktop .dh-right{flex:none;margin-left:auto;align-self:flex-start}
.barright{justify-self:end;display:flex;align-items:center;gap:clamp(8px,1.2vw,16px)}

/* play clock — same dark instrument on every screen */
.clockwrap{display:flex;align-items:center;gap:6px}
.clock{display:flex;align-items:center;gap:clamp(7px,.8vw,12px);background:var(--ink);
  border:2px solid #333D36;border-radius:10px;padding:6px clamp(10px,1.1vw,15px);
  min-height:48px;color:#fff;transition:background .15s ease,border-color .15s ease}
.clock .clabel{font-size:clamp(7.5px,1.1vh,10px);font-weight:700;letter-spacing:.13em;
  text-transform:uppercase;color:#8A968C;text-align:right;line-height:1.15;max-width:5.2em}
.clock .cnum{font-family:var(--disp);font-size:clamp(23px,4vh,38px);font-weight:700;
  line-height:1;font-variant-numeric:tabular-nums;min-width:1.7ch;text-align:right}
.clock.run{border-color:#4A9C6E}
.clock.run .clabel{color:#8FCBA8}
.clock.warn{background:#8A5A00;border-color:#C58A16}
.clock.warn .clabel{color:#F3D89B}
.clock.danger{background:#8E2418;border-color:#C0392B}
.clock.danger .clabel{color:#F5C2BB}
.clock.gone{background:#C0392B;border-color:#E05545}
.clock.gone .clabel{color:#fff}
.clock:active{transform:scale(.97)}
.cstop{width:34px;height:34px;border-radius:8px;background:transparent;border:1.5px solid var(--hair);
  color:var(--ink-2);font-size:19px;line-height:1;display:flex;align-items:center;
  justify-content:center}
.bar .cstop{border-color:#3B443E;color:#9AA69C}
.edit{font-family:var(--disp);font-size:clamp(14px,2.2vh,20px);text-transform:uppercase;
  letter-spacing:.05em;padding:9px 18px;border-radius:9px;background:transparent;
  border:1.5px solid #3B443E;min-height:44px;color:#D5DCD7}
.edit:active{background:#28302A}
.edit.done{background:var(--green);border-color:var(--green-2);color:#fff}
.edit.upd{background:var(--green);border-color:var(--green-2);color:#fff}
.edit:active{transform:scale(.97)}

/* one control for everything that is not a play. Setup and Exit are things a
   coach does between series, so they get one tap of chrome and no header room. */
.menuwrap{position:relative;display:flex}
.ham{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  padding:9px 15px;border-radius:9px;background:transparent;border:1.5px solid #3B443E;
  min-height:44px;min-width:54px}
.ham i{display:block;width:24px;height:2.5px;border-radius:2px;background:#D5DCD7}
.ham:active,.menuwrap.open .ham{background:#28302A}
.menuwrap.open .ham{transform:scale(.97)}
/* the tiles are position:relative, so the panel needs to be told it is on top */
.menu{position:absolute;top:calc(100% + 10px);right:0;z-index:30;
  min-width:max(210px,100%);background:#232B26;border:1.5px solid #3B443E;
  border-radius:12px;padding:6px;box-shadow:0 16px 36px rgba(0,0,0,.55);
  display:flex;flex-direction:column;gap:4px}
.menu[hidden]{display:none}
.menu button{font-family:var(--disp);font-size:clamp(14px,2.2vh,20px);text-transform:uppercase;
  letter-spacing:.05em;text-align:left;padding:10px 16px;min-height:48px;border-radius:8px;
  color:#D5DCD7;width:100%}
.menu button:active{background:#2F3833}
.tiles{flex:1;display:grid;grid-template-columns:repeat(var(--cols,2),1fr);
  grid-auto-rows:minmax(clamp(92px,12vh,150px),1fr);
  gap:clamp(10px,1.8vh,20px);padding-top:clamp(10px,1.8vh,20px);min-height:0;
  overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;
  scrollbar-gutter:stable}
.tiles.compact .tile{padding:clamp(10px,1.6vh,16px) clamp(10px,1.2vw,16px)
  clamp(10px,1.6vh,16px) clamp(22px,2.6vw,32px)}

.tiles.compact .coach{font-size:clamp(9px,1.4vh,12px)}

/* settings */
.setrows{flex:1;display:flex;flex-direction:column;
  gap:clamp(10px,1.8vh,20px);padding:clamp(12px,2vh,22px) 0;min-height:0;
  overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-gutter:stable}
/* centred while the rows fit, scrolled once they do not. justify-content:center
   puts the first row above the top of a scroller and out of reach forever;
   auto margins resolve to zero the moment free space goes negative. */
.setrows>:first-child{margin-top:auto}
.setrows>:last-child{margin-bottom:auto}
.setrow{flex:0 0 auto;display:flex;align-items:center;gap:clamp(14px,2vw,28px);
  background:#242C27;border:1.5px solid #333D36;border-radius:12px;
  padding:clamp(10px,1.8vh,18px) clamp(14px,1.6vw,22px)}
.setlab{flex:1;min-width:0}
.setlab b{display:block;font-family:var(--disp);font-size:clamp(17px,3vh,27px);
  text-transform:uppercase;letter-spacing:.01em;line-height:1.05;color:#EDF0EC}
.setlab span{display:block;font-size:clamp(10px,1.6vh,14px);color:#8E9A91;
  line-height:1.35;margin-top:4px;max-width:52ch}
/* what just happened on this row — the one line of Setup that is an answer,
   not a description, so it is the one line that is not grey */
.setlab .setmsg{display:block;color:#EDF0EC;font-style:normal;margin-bottom:3px}
.seg{display:flex;gap:6px;flex:none}
.seg button{font-family:var(--disp);font-size:clamp(14px,2.3vh,21px);text-transform:uppercase;
  letter-spacing:.04em;min-width:clamp(56px,6vw,80px);min-height:52px;border-radius:9px;
  background:#1A211D;border:1.5px solid #39433C;color:#A3AFA6}
.seg button.on{background:var(--green);border-color:var(--green-2);color:#fff}
.seg button:active{transform:scale(.96)}

/* filter bar, on the library and on the deck. Wraps rather than scrolling
   sideways: a filter you cannot see is a filter nobody uses. */
.lfilt,.dfilt{flex:none;display:flex;flex-wrap:wrap;align-items:center;
  gap:clamp(5px,.8vw,9px);padding:clamp(8px,1.2vh,14px) 0 clamp(2px,.6vh,6px)}
/* on the deck the bar is chrome above the plays, so it sits a size down and
   never competes with the tiles for the eye */
.dfilt .fchip{font-size:clamp(11px,1.6vh,15px);min-height:clamp(34px,4.4vh,42px)}
.fchip{font-family:var(--disp);font-size:clamp(12px,1.85vh,17px);text-transform:uppercase;
  letter-spacing:.05em;min-height:clamp(36px,5vh,46px);padding:0 clamp(9px,1vw,15px);
  border-radius:9px;background:#1A211D;border:1.5px solid #39433C;color:#A3AFA6;
  display:inline-flex;align-items:center;gap:7px;white-space:nowrap;cursor:pointer}
.fchip .n{font-size:.82em;color:#6E7A72;font-variant-numeric:tabular-nums}
.fchip.on{background:var(--green);border-color:var(--green-2);color:#fff}
.fchip.on .n{color:#CBE8DA}
/* a situation chip lights up in its own colour, matching the row's edge bar */
.fchip[data-cat].on{background:var(--cat);border-color:var(--cat);color:#fff}
.fchip[data-cat="all"].on{background:var(--green);border-color:var(--green-2)}
.fchip:active{transform:scale(.96)}
.fchip:focus-visible{outline:3px solid #5FBF8F;outline-offset:2px}
.lsep{width:1.5px;align-self:stretch;background:#39433C;margin:0 clamp(2px,.4vw,6px)}
.lsearch{flex:0 1 clamp(120px,15vw,230px);min-width:0;min-height:clamp(36px,5vh,46px);
  background:#141A16;border:1.5px solid #39433C;border-radius:9px;color:#E8EDE9;
  padding:0 clamp(10px,1vw,14px);font-family:var(--disp);letter-spacing:.05em;
  font-size:clamp(13px,1.9vh,18px)}
.lsearch::placeholder{color:#6E7A72;text-transform:uppercase;letter-spacing:.08em}
.lsearch:focus{outline:none;border-color:#5FBF8F}

/* play packs: a saved deck a coach starts from. Not a filter — a pack changes
   what is IN the deck, not what is on screen — so it does not wear .fchip; the
   dashed edge says "this is a thing you take", not "a thing you look through". */
.packs{flex:none;display:flex;flex-wrap:wrap;align-items:center;
  gap:clamp(5px,.8vw,9px);padding:clamp(4px,.8vh,8px) 0 0}
.packs[hidden]{display:none}
.plab{font-family:var(--disp);text-transform:uppercase;letter-spacing:.08em;color:#6E7A72;
  font-size:clamp(11px,1.6vh,14px);margin-right:clamp(2px,.4vw,6px)}
.pack{font-family:var(--disp);font-size:clamp(12px,1.85vh,17px);text-transform:uppercase;
  letter-spacing:.05em;min-height:clamp(36px,5vh,46px);padding:0 clamp(9px,1vw,15px);
  border-radius:9px;background:#141A16;border:1.5px dashed #4A7A5E;color:#CBE8DA;
  display:inline-flex;align-items:center;gap:7px;white-space:nowrap;cursor:pointer}
.pack .n{font-size:.82em;color:#6E7A72;font-variant-numeric:tabular-nums}
.pack.on{background:var(--green);border-style:solid;border-color:var(--green-2);color:#fff;cursor:default}
.pack.on .n{color:#CBE8DA}
/* armed: the same amber as the clock's warning — one colour for "about to" */
.pack[data-armed]{background:#8A5A00;border-style:solid;border-color:#C58A16;color:#fff}
.pack:active{transform:scale(.96)}
.pack:focus-visible{outline:3px solid #5FBF8F;outline-offset:2px}
/* a week the coach saved his own deck into wears the same pencil as a renamed row */
.pack .pmark{font-size:.85em;color:#8FC9A8;margin-right:-2px}
.pack.on .pmark{color:#CBE8DA}
/* Save deck and Rename sit at the far end, plain: they are verbs, not weeks */
.pverb{border-style:solid;border-color:#39433C;color:#A3AFA6;background:#1A211D}
.psave{margin-left:auto}
/* saving or renaming: every week is a target, in the same amber as an armed button */
.packs.saving .pack:not(.pverb),.packs.renaming .pack:not(.pverb){
  border-style:solid;border-color:#C58A16;color:#F2D9A6;background:#3A2A08}
.pverb.on{background:#8A5A00;border-color:#C58A16;color:#fff}
.lempty{grid-column:1/-1;align-self:start;display:flex;align-items:center;gap:14px;
  color:#8A968C;font-size:clamp(13px,2vh,18px);padding:clamp(14px,2.5vh,28px) 4px}

/* one column on a narrow tablet: two columns of long play names at 800px wide
   leaves each name about 200px, which is not enough as the library grows. */
@media (max-width:860px){ .lib{grid-template-columns:1fr !important} }
.lib{flex:1;display:grid;grid-template-columns:1fr 1fr;
  grid-auto-rows:minmax(clamp(52px,7vh,96px),1fr);
  gap:clamp(6px,1vh,11px) clamp(10px,1.6vw,22px);
  padding-top:clamp(10px,1.6vh,18px);min-height:0;
  overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;
  scrollbar-gutter:stable}
/* out of the deck = dark card, in the deck = light card. Readable either way,
   which dimming with opacity was not. */
.lrow{display:flex;align-items:center;gap:clamp(8px,1vw,14px);text-align:left;
  background:#262E29;border:1.5px solid #333D36;border-radius:10px;
  padding:0 clamp(10px,1.1vw,15px) 0 0;overflow:hidden;position:relative;
  transition:background .12s ease,border-color .12s ease}
.lrow::before{content:"";width:clamp(7px,.8vw,11px);align-self:stretch;background:var(--cat);
  flex:none}
.lrow.on{background:var(--surface);border-color:#5FBF8F}
.lrow:active{transform:scale(.99)}
.lnum{font-family:var(--disp);font-size:clamp(15px,2.4vh,22px);font-weight:700;color:#6E7A72;
  min-width:22px;text-align:center;font-variant-numeric:tabular-nums;flex:none;
  padding-left:clamp(4px,.5vw,8px)}
.lname{flex:1;min-width:0}
.lname b{display:block;font-family:var(--disp);font-size:clamp(15px,2.4vw,27px);
  text-transform:uppercase;line-height:1;letter-spacing:.01em;color:#C9D2CB;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lname i{display:block;font-style:normal;font-size:clamp(9px,1.4vh,12px);color:#7E8A81;
  font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lcat{font-size:clamp(7px,1.1vh,9.5px);font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:#fff;background:var(--cat);padding:4px 8px;border-radius:4px;white-space:nowrap;flex:none}
.lthumb{flex:none;width:clamp(78px,8.6vw,126px);display:flex;align-items:center}
.lthumb .thumbsvg{width:100%}
.lkind{font-family:var(--disp);font-size:clamp(11px,1.8vh,16px);font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;width:clamp(38px,4vw,54px);text-align:center;
  flex:none}
.lkind.run{color:#5FBF8F} .lkind.pass{color:var(--pass-lt)}
.lrow.on .lnum{color:var(--ink-2)}
.lrow.on .lname b{color:var(--ink)}
.lrow.on .lname i{color:var(--ink-2)}
.lrow.on .lkind.run{color:var(--run)}
.lrow.on .lkind.pass{color:var(--pass)}
.lmark{font-size:clamp(15px,2.4vh,21px);font-weight:700;width:30px;height:30px;flex:none;
  display:flex;align-items:center;justify-content:center;border-radius:8px;
  background:#39433C;color:#A3AFA6}
.lrow.on .lmark{background:var(--green);color:#fff}
/* the pencil. Big enough for a thumb in a glove, quiet enough that the row
   still reads as one tap target for adding the play to the deck. */
.lren{font-size:clamp(13px,2vh,18px);width:34px;height:34px;flex:none;
  display:flex;align-items:center;justify-content:center;border-radius:8px;
  color:#7E8A81;background:transparent;border:1.5px solid #39433C;cursor:pointer;
  line-height:1}
.lren.on{color:var(--ball);border-color:#6B5A2A}
.lren:active{transform:scale(.94)}
.lrow.on .lren{color:#6F7C73;border-color:#C6D0C7}
.lrow.on .lren.on{color:#9A6E12;border-color:#D9BE7A}

/* the rename sheet — the only place in the app a coach types */
.sheetwrap{position:fixed;inset:0;z-index:60;display:flex;align-items:center;
  justify-content:center;padding:clamp(14px,3vh,32px);background:rgba(9,13,11,.72)}
.sheet{width:min(560px,100%);max-height:100%;overflow-y:auto;background:#1F2622;
  border:1.5px solid #3B453E;border-radius:16px;padding:clamp(16px,2.6vh,26px)}
.sheet h2{font-family:var(--disp);font-size:clamp(15px,2.2vh,20px);text-transform:uppercase;
  letter-spacing:.1em;color:#8E9A91;font-weight:700;margin-bottom:clamp(10px,1.8vh,18px)}
.nfield{display:block;margin-bottom:clamp(10px,1.6vh,16px)}
.nfield span{display:block;font-size:clamp(10px,1.5vh,13px);font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:#8E9A91;margin-bottom:6px}
.nfield input{width:100%;font-family:var(--disp);font-size:clamp(20px,3.4vh,32px);
  text-transform:uppercase;letter-spacing:.01em;color:#EDF0EC;background:#141A16;
  border:1.5px solid #39433C;border-radius:10px;padding:clamp(9px,1.5vh,14px) 14px}
.nfield input{-webkit-user-select:text;user-select:text}
.nfield input:focus{outline:none;border-color:var(--green-2)}
.sheetnote{font-size:clamp(10px,1.6vh,14px);color:#8E9A91;line-height:1.4;
  margin:clamp(6px,1vh,12px) 0 clamp(12px,2vh,20px)}
.sheetnote b{color:#C9D2CB}
.sheetbtns{display:flex;gap:8px;justify-content:flex-end}
.sbtn{font-family:var(--disp);font-size:clamp(14px,2.3vh,21px);text-transform:uppercase;
  letter-spacing:.04em;min-width:clamp(84px,9vw,116px);min-height:52px;border-radius:9px;
  background:#1A211D;border:1.5px solid #39433C;color:#A3AFA6}
.sbtn.go{background:var(--green);border-color:var(--green-2);color:#fff}
.sbtn:active{transform:scale(.96)}
.sbtn[disabled],.seg button[disabled]{opacity:.4}
/* names were sized in vh, so rotating the tablet grew the type while the tile
   got narrower — the exact recipe for clipping. Size against the card itself. */
.tile{container-type:inline-size;
  position:relative;display:flex;align-items:center;gap:clamp(10px,1.4vw,20px);
  background:var(--surface);border:1.5px solid transparent;border-radius:14px;
  padding:clamp(12px,2vh,22px) clamp(14px,1.6vw,22px) clamp(12px,2vh,22px) clamp(26px,3vw,40px);
  text-align:left;transition:transform .12s ease,box-shadow .12s ease;overflow:hidden}
.tilemain{flex:1;min-width:0;overflow:hidden;display:flex;flex-direction:column;
  justify-content:center}
.thumb{flex:none;width:clamp(150px,26vw,380px);align-self:stretch;display:flex;
  align-items:center}
@supports (container-type:inline-size){
  .tile .kid{font-size:min(44px, 10.5cqi)}
  .thumb{width:52cqi}
  .tiles.compact .thumb{width:49cqi}
  .lrow{container-type:inline-size}
  .lname b{font-size:min(27px, 9cqi)}
}
.thumbsvg{width:100%;height:auto;max-height:100%;display:block}
/* the bar answers the only question that matters in three seconds */
.tile.run::before{background:var(--run)}
.tile.pass::before{background:var(--pass)}
.kindrow{display:flex;align-items:center;gap:clamp(6px,.8vw,11px);
  margin-bottom:clamp(3px,.6vh,7px);flex-wrap:wrap}
.kind{font-family:var(--disp);font-size:clamp(12px,1.9vh,17px);font-weight:700;
  letter-spacing:.16em;text-transform:uppercase}
.catchip{font-size:clamp(7px,1.05vh,9.5px);font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:#fff;background:var(--cat);padding:3px 7px;border-radius:4px;
  white-space:nowrap}
/* the situation is the thing a coach is actually looking for under pressure
   ("I need a goal line play"), so it stays on the tile at every column count.
   It used to be hidden here — on the only deck sizes big enough to need it. */
.tiles.compact .catchip{font-size:clamp(6.5px,.95vh,8.5px);padding:2px 5px}
.tile.run .kind{color:var(--run)}
.tile.pass .kind{color:var(--pass)}
.tile:active{transform:scale(.985);box-shadow:inset 0 0 0 3px var(--green)}
.tile:focus-visible{outline:3px solid #5FBF8F;outline-offset:3px}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:clamp(10px,1.2vw,16px);
  background:var(--cat);border-radius:12px 0 0 12px}

/* Two lines are allowed here so a long real name like PLAY-ACTION CROSS can
   wrap instead of shrinking to nothing. fitText() is what enforces the cap —
   do NOT add a max-height: with line-height under 1 the glyph box is taller
   than the line box, so any height clamp makes scrollHeight permanently
   exceed clientHeight and every name collapses to the floor size. */

<script>
const DATA = __DATA__;

/* ------------------------------------------------------------ geometry */
const SCALE = 31.25, VB_W = 1140, VB_H = 672, CX = 570, TOPY = 15;
const EDGE = 15.7;                   // sideline, in yards from the middle
let mAnim = 0;                       // 0..1 current mirror
let mTarget = 0;

function W2S(x, y){                    // players, routes, ball — these mirror
  return [CX + x * (1 - 2 * mAnim) * SCALE, (TOPY - y) * SCALE];
}
function F2S(x, y){                    // field paint — never moves
  return [CX + x * SCALE, (TOPY - y) * SCALE];
}
const pt  = p => W2S(p[0], p[1]).join(",");
const fpt = p => F2S(p[0], p[1]).join(",");

/* One football, drawn once. The intro art and the play screen both use it: a
   kid should not have to learn two different pictures of the same object. The
   ends are pointed rather than an ellipse, which is most of what makes the
   silhouette read as a football at the size it is actually seen. */
const BALL_BODY = "M-22 0Q0-13.5 22 0Q0 13.5-22 0Z";
const BALL_LACES = "M-8.5 0h17M0-4.5v9M-6-3.5v7M6-3.5v7";
const BALL_FILL = "#7A4520", BALL_EDGE = "#141A16", BALL_LACE = "#F7F9F6";

const flipSide = s => s === "blue" ? "orange" : s === "orange" ? "blue" : "none";
const mirrored = () => mAnim > 0.5;
const sideOf = k => mirrored() ? flipSide(S.play.spots[k].side) : S.play.spots[k].side;
function swapWords(t){
  return t.replace(/BLUE/g, "\u0001").replace(/ORANGE/g, "BLUE").replace(/\u0001/g, "ORANGE")
          .replace(/blue/g, "\u0002").replace(/orange/g, "blue").replace(/\u0002/g, "orange");
}
const sideName = k => { const sp = S.play.spots[k];
  return mirrored() ? swapWords(sp.name) : sp.name; };

let ourSide = "blue";              // which sideline our team is assigned to, all game
try { ourSide = localStorage.getItem("hb.ourside") || "blue"; } catch(e){}
function setOurSide(v){ ourSide = v; try { localStorage.setItem("hb.ourside", v); } catch(e){} }

/* Whether this tablet has been through the tutorial. It is marked when the
   coach leaves the slides, by NEXT or by SKIP alike — a coach who skipped it
   has said he does not want it, and it is in the menu whenever he does. Per
   tablet and not in the sync file: the assistant's tablet is still his first
   time. Start over clears it, because that tablet is somebody's first time
   again. */
let tourSeen = false;
try { tourSeen = localStorage.getItem("hb.tour") === "1"; } catch(e){}
function markTourSeen(){ tourSeen = true; try { localStorage.setItem("hb.tour", "1"); } catch(e){} }
function resetTour(){ tourSeen = false; try { localStorage.removeItem("hb.tour"); } catch(e){} }

function lens(pts){
  const out = [0];
  for (let i = 1; i < pts.length; i++){
    out.push(out[i-1] + Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]));
  }
  return out;
}
function walk(pts, t){            // t 0..1 of total length -> {pts:[...], end:[x,y]}
  const L = lens(pts), total = L[L.length-1];
  if (total === 0) return {pts:[pts[0]], end:pts[0]};
  const target = Math.max(0, Math.min(1, t)) * total;
  const keep = [pts[0]];
  for (let i = 1; i < pts.length; i++){
    if (L[i] <= target){ keep.push(pts[i]); continue; }
    const f = (target - L[i-1]) / (L[i] - L[i-1]);
    const p = [pts[i-1][0] + (pts[i][0]-pts[i-1][0])*f, pts[i-1][1] + (pts[i][1]-pts[i-1][1])*f];
    keep.push(p);
    return {pts:keep, end:p};
  }
  return {pts:keep, end:pts[pts.length-1]};
}
function fracNear(pts, q){        // fraction along pts of the point nearest q
  const L = lens(pts), total = L[L.length-1];
  if (total === 0) return 0;
  let best = Infinity, along = 0;
  for (let i = 1; i < pts.length; i++){
    const ax = pts[i-1][0], ay = pts[i-1][1], dx = pts[i][0]-ax, dy = pts[i][1]-ay;
    const l2 = dx*dx + dy*dy;
    const f = l2 < 1e-9 ? 0 : Math.max(0, Math.min(1, ((q[0]-ax)*dx + (q[1]-ay)*dy) / l2));
    const d = Math.hypot(q[0] - (ax + f*dx), q[1] - (ay + f*dy));
    if (d < best){ best = d; along = L[i-1] + f*Math.sqrt(l2); }
  }
  return along / total;
}
const runPathOf = (play, who) =>
  play.paths.findIndex(p => p.who === who && (p.type === "run" || p.type === "route"));
function qbez(a, b, c, t){
  const u = 1 - t;
  return [u*u*a[0] + 2*u*t*b[0] + t*t*c[0], u*u*a[1] + 2*u*t*b[1] + t*t*c[1]];
}
/* The throw: one arc from where the thrower lets it go to the end of the
   target's route, bowed a little so it reads as a flight and not a fourth
   route. It leaves the THROWER's spot — or, when the ball was handed to
   somebody first, the end of that kid's run. The play screen and the
   thumbnail both draw it from these three points, so a tile is a small
   picture of exactly what the big screen will show. Null on a run. */
function throwArc(play){
  if (play.ball.mode === "carry") return null;
  const idx = play.paths.findIndex(p => p.who === play.ball.who);
  if (idx < 0) return null;
  const legs = play.ball.legs;
  const src = legs ? play.paths[legs[legs.length - 1].path].pts.slice(-1)[0]
                   : [play.spots.QB.x, play.spots.QB.y];
  const dst = play.paths[idx].pts[play.paths[idx].pts.length - 1];
  const mid = [(src[0]+dst[0])/2, (src[1]+dst[1])/2];
  const dx = dst[0]-src[0], dy = dst[1]-src[1];
  return {idx, src, ctrl:[mid[0] - dy*0.16, mid[1] + dx*0.16], dst};
}
const throwPts = (arc, n = 24) =>
  Array.from({length:n + 1}, (_, i) => qbez(arc.src, arc.ctrl, arc.dst, i / n));

/* ------------------------------------------------------------ timeline */
const HOLD = 700, YD = 150, TAIL = 1500;
function buildTimeline(play){
  const tl = {paths:[], tSnap:HOLD, tEnd:0};
  let motionEnd = HOLD;
  play.paths.forEach((p, i) => {
    const L = lens(p.pts).pop();
    if (p.type === "motion"){
      const dur = Math.max(600, L * 190);
      tl.paths[i] = {start:HOLD, dur};
      motionEnd = Math.max(motionEnd, HOLD + dur);
    }
  });
  tl.tSnap = motionEnd > HOLD ? motionEnd + 120 : HOLD;
  play.paths.forEach((p, i) => {
    if (tl.paths[i]) return;
    const L = lens(p.pts).pop();
    const quick = (p.type === "handoff");
    const dur = quick ? Math.max(240, L*140) : Math.max(480, L*YD);
    tl.paths[i] = {start:tl.tSnap, dur};
  });
  // A handoff by a kid who is already running starts when he gets there, not
  // at the snap — the second exchange of a reverse is most of a second in.
  play.paths.forEach((p, i) => {
    if (p.type !== "handoff") return;
    const ri = runPathOf(play, p.who);
    if (ri < 0) return;
    const rs = tl.paths[ri];
    tl.paths[i].start = rs.start + rs.dur * fracNear(play.paths[ri].pts, p.pts[0]);
  });
  // ball
  const b = play.ball;
  // The ball is wherever the kid holding it is. It changes hands where a
  // handoff arrow ends, at the moment the giver gets there — so a reverse
  // shows the first runner carrying it and then the second, instead of the
  // second runner holding it from the snap. A pass thrown by somebody other
  // than the THROWER has legs too: the sweep he takes before he throws.
  const legTimes = () => {
    const legs = (b.legs || [{who:b.who, path:runPathOf(play, b.who)}])
      .map(l => ({who:l.who, pathIdx:l.path, handoff:l.handoff}));
    legs.forEach((l, k) => {
      if (k === 0){ l.start = tl.paths[l.pathIdx].start; return; }
      const giver = legs[k-1], seg = tl.paths[giver.pathIdx];
      const h = play.paths[l.handoff], to = h.pts[h.pts.length-1];
      l.start = seg.start + seg.dur * fracNear(play.paths[giver.pathIdx].pts, to);
    });
    return legs;
  };
  const legEnd = legs => { const ls = tl.paths[legs[legs.length-1].pathIdx]; return ls.start + ls.dur; };
  if (b.mode === "carry"){
    const legs = legTimes();
    tl.ball = {mode:"carry", pathIdx:legs[legs.length-1].pathIdx, legs,
               start:legs[0].start, dur:legEnd(legs) - legs[0].start};
  } else {
    const idx = play.paths.findIndex(p => p.who === b.who);
    const tp = tl.paths[idx] || {start:tl.tSnap, dur:1200};
    const arrive = tp.start + tp.dur;
    // the frame draws the ball along the arc and the dashed throw line behind
    // it, so both come from the same three points
    const {src, ctrl, dst} = throwArc(play);
    // it leaves the THROWER's hands just after the snap — or the runner's
    // when his run ends — and lands as the receiver gets there
    const legs = b.legs ? legTimes() : null;
    const ready = legs ? legEnd(legs) : tl.tSnap + 120;
    const start = Math.max(ready, arrive - 620);
    tl.ball = {mode:"pass", pathIdx:idx, legs, thrower:b.thrower || "QB",
               start, dur:Math.max(300, arrive - start), arrive, src, ctrl, dst};
  }
  tl.tEnd = Math.max(...tl.paths.map(p => p.start + p.dur),
                     tl.ball.start + tl.ball.dur) + TAIL;
  return tl;
}

/* ------------------------------------------------------------ state */
const S = {screen:"deck", play:null, tl:null, stage:"lineup", solo:null,

const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ------------------------------------------------------------ event log
   Append-only, millisecond-resolution. Every record carries BOTH a monotonic
   offset (immune to the device clock being wrong or jumping) and a wall-clock
   stamp (the only thing comparable against another device). Reconciliation
   later joins on the timeline, never on a shared event id.                   */
const LOG_CAP = 6000;
const APP_BUILD = "__VERSION__";
let devId = "";
try {
  devId = localStorage.getItem("hb.dev") || "";
  if (!devId){
    devId = "d_" + Math.random().toString(36).slice(2, 10);
    localStorage.setItem("hb.dev", devId);
  }
} catch(e){ devId = "d_ephemeral"; }

const SESSION = {
  id: "s_" + Math.random().toString(36).slice(2, 10),
  w0: Date.now(),                 // wall clock at session start
  m0: performance.now(),          // monotonic origin
};
let logSeq = 0;
let events = [];
try { events = JSON.parse(localStorage.getItem("hb.events") || "[]") || []; } catch(e){}

let flushT = null;
function flushLog(){
  flushT = null;
  try { localStorage.setItem("hb.events", JSON.stringify(events)); } catch(e){}
}
function logEvent(type, payload){
  const mono = performance.now() - SESSION.m0;
  events.push({
    v: 1, s: SESSION.id, d: devId, n: ++logSeq,
    t: Math.round(mono),                       // ms since session start, monotonic
    w: Math.round(SESSION.w0 + mono),          // wall ms, derived from the monotonic clock
    wr: Date.now(),                            // wall ms read directly, to expose drift
    e: type,
    ...(payload ? {p: payload} : {}),
  });
  if (events.length > LOG_CAP) events.splice(0, events.length - LOG_CAP);
  if (!flushT) flushT = setTimeout(flushLog, 400);
}
addEventListener("visibilitychange", () => { if (document.hidden) flushLog(); });
addEventListener("pagehide", flushLog);

/* ------------------------------------------------------------ settings */
// funNames defaults off: a tablet out of the box shows 22 DIVE, the name the
// coach already knows. Fun names are a deliberate opt-in per team.
// Note the v stays 1 — bumping it would throw away every coach's saved
// settings. Anyone who has already chosen keeps their choice; only a fresh
// install picks up this default.
const CFG_DEFAULTS = {v:1, clockSecs:40, warnAt:10, vibrate:true, showClock:true,
                      funNames:false};
// Every value a setting can take. Setup's buttons are drawn from this and a
// setup file from another tablet is checked against it, so the two cannot drift.
const CFG_CHOICES = {clockSecs:[25,30,40,45], warnAt:[5,10,15], vibrate:[true,false],
                     showClock:[true,false], funNames:[true,false]};
let cfg = Object.assign({}, CFG_DEFAULTS);
try {
  const saved = JSON.parse(localStorage.getItem("hb.settings") || "null");
  if (saved && saved.v === 1) cfg = Object.assign({}, CFG_DEFAULTS, saved);
} catch(e){}
function saveCfg(){ try { localStorage.setItem("hb.settings", JSON.stringify(cfg)); } catch(e){} }

/* -------------------------------------------------------- custom names
   Every team ends up with its own word for a play. The overrides live here,
   keyed by play id and nowhere near the build, so a coach who renames 22 DIVE
   to BULLDOZER still has BULLDOZER after the next update lands. Both halves
   are editable: the real name is what you say to another coach, the fun name
   is what the kids shout. Clearing a field puts the shipped name back, so a
   coach can drop one half without losing the other. */
const NAME_CAP = 22;
let names = {};
try {
  const saved = JSON.parse(localStorage.getItem("hb.names") || "null");
  if (saved && saved.v === 1 && saved.byId) names = saved.byId;
} catch(e){}
function saveNames(){
  try { localStorage.setItem("hb.names", JSON.stringify({v:1, byId:names})); } catch(e){}
}
const tidyName = s => (s || "").replace(/\s+/g, " ").trim().slice(0, NAME_CAP);
const coachNameOf = p => (names[p.id] && names[p.id].coach) || p.coachName;
const kidNameOf   = p => (names[p.id] && names[p.id].kid)   || p.kidName;
const isRenamed = p => !!names[p.id];
const renamedCount = () => Object.keys(names).length;
// Only what actually differs is stored. A coach who retypes the shipped name
// has not renamed anything, and the pencil should not claim otherwise.
function setNames(id, coach, kid){
  const p = DATA.plays.find(x => x.id === id);
  const c = tidyName(coach), k = tidyName(kid), o = {};
  if (c && c !== p.coachName) o.coach = c;
  if (k && k !== p.kidName) o.kid = k;
  if (o.coach || o.kid) names[id] = o; else delete names[id];
  saveNames();
}
function resetNames(id){
  if (id) delete names[id]; else names = {};
  saveNames();
}

/* ----------------------------------------------------------- saved decks
   A coach can save the deck he built into one of the week slots, so Week 3
   on this tablet is HIS week 3. Same shape as names: keyed by pack id, only
   what differs from the shipped pack is stored, kept through an update, and
   carried in the sync file — where every slot is spelled out, so the tablet
   that imports ends up with exactly the weeks the file has, shipped or saved. */
let packSaves = {};
try {
  const saved = JSON.parse(localStorage.getItem("hb.packs") || "null");
  if (saved && saved.v === 1 && saved.byId) packSaves = saved.byId;
} catch(e){}
function savePackSaves(){
  try { localStorage.setItem("hb.packs", JSON.stringify({v:1, byId:packSaves})); } catch(e){}
}
const sameDeck = (a, b) => a.length === b.length && a.every(id => b.includes(id));
const knownPlay = id => typeof id === "string" && DATA.plays.some(p => p.id === id);
/* A week's name is the coach's too — "Week 3" is the build's word for it, and
   by week three it is PLAYOFFS or SEAHAWKS or whatever the team calls that
   deck. Same discipline as play names: only a name that differs from the
   shipped one is stored, under hb.packnames, keyed by pack id. */
let packNames = {};
try {
  const saved = JSON.parse(localStorage.getItem("hb.packnames") || "null");
  if (saved && saved.v === 1 && saved.byId) packNames = saved.byId;
} catch(e){}
function savePackNames(){
  try { localStorage.setItem("hb.packnames", JSON.stringify({v:1, byId:packNames})); } catch(e){}
}
const packNameOf = k => packNames[k.id] || k.name;
const isPackRenamed = k => !!packNames[k.id];
const renamedPackCount = () => Object.keys(packNames).length;
function setPackName(id, name){
  const k = DATA.packs.find(x => x.id === id);
  if (!k) return false;
  const n = tidyName(name);
  // the chip is set in capitals, so "week 3" typed back is the shipped name, not a new one
  if (n && n.toUpperCase() !== k.name.toUpperCase()) packNames[id] = n; else delete packNames[id];
  savePackNames();
  return true;
}
function resetPackNames(id){
  if (id) delete packNames[id]; else packNames = {};
  savePackNames();
}
// the weeks as this tablet has them: shipped, with a coach's deck in any slot
// he filled and his name on any week he renamed
const packsNow = () => DATA.packs.map(k => Object.assign({}, k, {
  name: packNameOf(k), named: isPackRenamed(k),
  plays: packSaves[k.id] ? packSaves[k.id].slice() : k.plays, mine: !!packSaves[k.id]}));
const savedPackCount = () => Object.keys(packSaves).length;
// Only what differs is stored: saving the shipped deck back into its own slot
// is not a change, and the mark on the chip should not claim otherwise.
function setPack(id, plays){
  const k = DATA.packs.find(x => x.id === id);
  if (!k || !Array.isArray(plays)) return false;
  const list = [];
  for (const p of plays) if (knownPlay(p) && !list.includes(p)) list.push(p);
  if (!list.length) return false;
  if (sameDeck(list, k.plays)) delete packSaves[id]; else packSaves[id] = list;
  savePackSaves();
  return true;
}
// a week back to shipped is its deck AND its name
function resetPacks(){ packSaves = {}; savePackSaves(); resetPackNames(); }

/* ----------------------------------------------------------- start over
   Everything a coach can change, back to the way the tablet arrived: the
   starting deck, every play's shipped name, every setting above, and which
   sideline is ours. The game log is deliberately NOT part of this. A log is a
   recording, not a preference — it is the one thing here that cannot be
   derived again — and it has its own Clear one row up. */
function resetEverything(){
  logEvent("reset_all", {deck: deck.slice(), renamed: renamedCount(), savedWeeks: savedPackCount(),
                         renamedWeeks: renamedPackCount()});
  resetNames();
  resetPacks();
  deck = DATA.defaultDeck.slice(); saveDeck();
  cfg = Object.assign({}, CFG_DEFAULTS); saveCfg();
  setOurSide("blue");
  resetTour();
  S.hintSeen = false;
  stopClock();
  clk = {at:0, running:false, warned:false, expired:false};
  flushLog();
}

/* ---------------------------------------------------------- sync tablets
   Assistant coaches carry their own tablets and the sideline has no network,
   so a tablet's choices travel as one small file: the deck, every custom
   name, every setting, and which sideline is ours. Export hands the file to
   Android's share sheet — Quick Share reaches the tablet next to you over
   Bluetooth with the radio otherwise off — and Import on that tablet reads it
   back from Files. Import REPLACES rather than merges: the point is two
   tablets that agree, and a merge would be a third deck neither coach chose.
   The game log stays put, for the same reason Start over leaves it alone —
   it is a recording of this tablet, not a preference to hand around. Nothing
   in the file is trusted: play ids are checked against the library, settings
   against CFG_CHOICES, names go through the same tidy-and-compare as typing. */
const SETUP_FORMAT = "huddleboard.setup";
function setupBlob(){
  const settings = {};
  for (const k of Object.keys(CFG_CHOICES)) settings[k] = cfg[k];
  return JSON.stringify({
    format: SETUP_FORMAT, v: 1, build: APP_BUILD, device: devId, exportedWall: Date.now(),
    deck: deck.slice(), names, settings, ourSide,
    // every week as this tablet has it, shipped or saved, so the file stands alone
    packs: Object.fromEntries(packsNow().map(k => [k.id, k.plays.slice()])),
    // and the coach's own names for them, like play names: only what differs
    packNames,
  });
}
// The file, read with suspicion. Returns what will be applied plus a count of
// what was not recognised; throws when it is not a setup file at all.
function readSetup(text){
  let o = null;
  try { o = JSON.parse(text); } catch(e){}
  if (!o || o.format !== SETUP_FORMAT || o.v !== 1) throw new Error("not a setup file");
  const known = id => typeof id === "string" && DATA.plays.some(p => p.id === id);
  const s = {deck:[], names:{}, settings:{}, ourSide:null, dropped:0};
  if (Array.isArray(o.deck)) for (const id of o.deck){
    if (known(id) && !s.deck.includes(id)) s.deck.push(id); else s.dropped++;
  }
  if (o.names && typeof o.names === "object") for (const id of Object.keys(o.names)){
    const n = o.names[id];
    if (!known(id) || !n || typeof n !== "object"){ s.dropped++; continue; }
    s.names[id] = {coach: typeof n.coach === "string" ? n.coach : "",
                   kid:   typeof n.kid   === "string" ? n.kid   : ""};
  }
  const st = o.settings && typeof o.settings === "object" ? o.settings : {};
  for (const k of Object.keys(CFG_CHOICES)){
    if (CFG_CHOICES[k].includes(st[k])) s.settings[k] = st[k]; else s.dropped++;
  }
  if (o.ourSide === "blue" || o.ourSide === "orange") s.ourSide = o.ourSide; else s.dropped++;
  // saved weeks: a slot the build knows, holding plays the library has, once each
  s.packs = {};
  if (o.packs && typeof o.packs === "object") for (const id of Object.keys(o.packs)){
    const list = o.packs[id];
    if (!DATA.packs.some(k => k.id === id) || !Array.isArray(list)){ s.dropped++; continue; }
    const ok = [];
    for (const p of list){ if (knownPlay(p) && !ok.includes(p)) ok.push(p); else s.dropped++; }
    if (ok.length) s.packs[id] = ok; else s.dropped++;
  }
  // week names: a slot the build knows, and text — tidied and compared on the way in
  s.packNames = {};
  if (o.packNames && typeof o.packNames === "object") for (const id of Object.keys(o.packNames)){
    const n = o.packNames[id];
    if (!DATA.packs.some(k => k.id === id) || typeof n !== "string"){ s.dropped++; continue; }
    s.packNames[id] = n;
  }
  return s;
}
function applySetup(s){
  if (s.deck.length){ deck = s.deck.slice(); saveDeck(); } else s.dropped++;
  names = {};
  for (const id of Object.keys(s.names)) setNames(id, s.names[id].coach, s.names[id].kid);
  saveNames();
  // every week comes from the file: a slot it does not fill, or name, goes back to shipped
  resetPacks();
  for (const id of Object.keys(s.packs)) setPack(id, s.packs[id]);
  for (const id of Object.keys(s.packNames)) setPackName(id, s.packNames[id]);
  cfg = Object.assign({}, CFG_DEFAULTS, s.settings); saveCfg();
  if (s.ourSide) setOurSide(s.ourSide);
  S.hintSeen = false;
  stopClock();
  clk = {at:0, running:false, warned:false, expired:false};
  logEvent("sync_import", {deck: deck.slice(), renamed: renamedCount(), dropped: s.dropped});
  flushLog();
}
let syncMsg = "";                 // shown once on the Sync row, then gone
async function exportSetup(btn){
  const text = setupBlob(),
        name = "huddle-setup-" + new Date().toISOString().slice(0, 10) + ".json";
  logEvent("sync_export", {deck: deck.slice(), renamed: renamedCount()});
  let done = "";
  try {                                    // best: the share sheet, Quick Share on it
    const f = new File([text], name, {type: "application/json"});
    if (navigator.canShare && navigator.canShare({files: [f]})){
      await navigator.share({files: [f], title: "Huddle Board setup"});
      done = "Shared";
    }
  } catch(e){                              // the coach closed the sheet: not a failure
    if (e && e.name === "AbortError") done = "Export";
  }
  if (!done){
    try {                                  // otherwise it lands in Downloads
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([text], {type: "application/json"}));
      a.download = name; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      done = "Saved";
    } catch(e){ done = "Failed"; }
  }
  btn.textContent = done;
  setTimeout(() => { if (btn.isConnected) btn.textContent = "Export"; }, 1800);
}
async function importSetup(file){
  let text = "";
  try { text = await file.text(); } catch(e){}
  let s = null;
  try { s = readSetup(text); } catch(e){}
  if (!s){
    syncMsg = "That is not a Huddle Board setup file. Nothing was changed.";
  } else {
    applySetup(s);
    const parts = [`${deck.length}-play deck`,
                   `${renamedCount()} renamed play${renamedCount() === 1 ? "" : "s"}`,
                   `${savedPackCount()} saved week${savedPackCount() === 1 ? "" : "s"}`,
                   `${renamedPackCount()} renamed week${renamedPackCount() === 1 ? "" : "s"}`,
                   "settings", `${ourSide.toUpperCase()} sideline`];
    const d = s.dropped;
    syncMsg = "Imported: " + parts.join(", ") + "." +
      (d ? ` ${d} thing${d === 1 ? "" : "s"} in the file ${d === 1 ? "was" : "were"} not recognised and skipped.` : "");
  }
  renderSettings();
}

/* ------------------------------------------------------------ play clock */
let clk = {at:0, running:false, warned:false, expired:false};
function buzz(p){
  if (!cfg.vibrate) return;
  try { navigator.vibrate && navigator.vibrate(p); } catch(e){}
}
function startClock(){
  const wasRunning = clk.running, left = clockLeft();
  clk = {at: performance.now(), running:true, warned:false, expired:false};
  buzz(35);
  // a clock start marks the moment the PREVIOUS play ended — the single most
  // useful boundary for lining this log up against somebody else's
  logEvent("clock_start", {secs: cfg.clockSecs, restart: wasRunning,
                           prevLeftMs: wasRunning ? Math.round(left * 1000) : null});
}
function stopClock(){
  if (clk.running) logEvent("clock_stop", {leftMs: Math.round(clockLeft() * 1000)});
  clk.running = false;
}
function clockLeft(){
  return clk.running ? Math.max(0, cfg.clockSecs - (performance.now() - clk.at) / 1000)
                     : cfg.clockSecs;
}
function clockHTML(){
  if (!cfg.showClock) return "";
  return `<div class="clockwrap">
    <button class="clock" id="clock" aria-label="Play clock">
      <span class="clabel" id="clocklabel">Play clock</span>
      <span class="cnum" id="clocknum">${cfg.clockSecs}</span>
    </button>
    <button class="cstop hidden" id="cstop" aria-label="Stop the clock">&times;</button>
  </div>`;
}
function bindClock(){
  const c = document.getElementById("clock");
  if (c) c.onclick = () => { startClock(); paintClock(); };
  const x = document.getElementById("cstop");
  if (x) x.onclick = () => { stopClock(); paintClock(); };
}
function paintClock(){
  const el = document.getElementById("clocknum");
  if (!el) return;
  const t = clockLeft(), n = Math.ceil(t);
  el.textContent = n;
  const c = document.getElementById("clock");
  const lab = document.getElementById("clocklabel");
  const gone = clk.running && t <= 0;
  c.classList.toggle("run", clk.running && !gone);
  c.classList.toggle("warn", clk.running && t > 5 && t <= cfg.warnAt);
  c.classList.toggle("danger", clk.running && t > 0 && t <= 5);
  c.classList.toggle("gone", gone);
  lab.textContent = gone ? "Snap it" : clk.running ? "Play clock" : "Tap to start";
  document.getElementById("cstop").classList.toggle("hidden", !clk.running);
  if (clk.running && !clk.warned && t <= cfg.warnAt){ clk.warned = true; buzz(60); }
  if (gone && !clk.expired){ clk.expired = true; buzz([120,90,120]); logEvent("clock_expired"); }
}
const CAT = {"RUN ZONE":"#127A4D","QUICK GAME":"#1B6BA8","SHOT PLAY":"#8A3AB0",
             "NO-RUN ZONE":"#C9700D","GOAL LINE":"#C0392B"};
const SIDE = {blue:"#1D6FD0", orange:"#E4610F", none:"#141A16"};
const app = document.getElementById("app");

/* ---------------------------------------------------- play thumbnail */
/* same proportions and the same dark-surround / light-field logic as the
   full-size view, so a tile reads as a small version of the real thing */
const TH = {s:9.5, w:346, h:204, cx:173, top:15, edge:15.7, botY:-6.5};
function thumbSVG(p){
  const tx = (x,y) => [TH.cx + x*TH.s, (TH.top - y)*TH.s];
  const poly = pts => pts.map(q => tx(q[0],q[1]).join(",")).join(" ");
  const o = [`<svg viewBox="0 0 ${TH.w} ${TH.h}" class="thumbsvg" aria-hidden="true">`];
  o.push(`<rect x="0" y="0" width="${TH.w}" height="${TH.h}" rx="7" fill="#1E2521"/>`);
  const f0 = tx(-TH.edge, TH.top), f1 = tx(TH.edge, TH.botY);
  o.push(`<rect x="${f0[0]}" y="${f0[1]}" width="${f1[0]-f0[0]}" height="${f1[1]-f0[1]}"
    fill="#F7F9F6"/>`);
  const g0 = tx(-TH.edge, 15), g1 = tx(TH.edge, 13.3);
  o.push(`<rect x="${g0[0]}" y="${g0[1]}" width="${g1[0]-g0[0]}" height="${g1[1]-g0[1]}"
    fill="#1B5E3A" fill-opacity=".14"/>`);
  // inset slightly so the whole stroke lands on the light field and survives
  // being scaled down to a library row
  [["#1D6FD0",-(TH.edge-0.22)],["#E4610F",TH.edge-0.22]].forEach(([c,xv]) => {
    const a = tx(xv,TH.top), b = tx(xv,TH.botY);
    o.push(`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${c}"
      stroke-width="5"/>`);
  });
  const l1 = tx(-TH.edge,0), l2 = tx(TH.edge,0);
  o.push(`<line x1="${l1[0]}" y1="${l1[1]}" x2="${l2[0]}" y2="${l2[1]}"
    stroke="#AEB8B0" stroke-width="2"/>`);
  const col = {route:"#232B26", run:"#127A4D", fake:"#127A4D",
               motion:"#C9700D", handoff:"#7C877F"};
  p.paths.forEach(pa => {
    const dash = pa.type === "motion" ? '4 3' : pa.type === "fake" ? '5 3'
               : pa.type === "handoff" ? '3 2' : '';
    const strong = p.jobs.includes(pa.who);
    o.push(`<polyline points="${poly(pa.pts)}" fill="none" stroke="${col[pa.type]}"
      stroke-width="${pa.type === "run" ? 3.4 : 2.4}" stroke-linejoin="round"
      stroke-linecap="round" opacity="${strong ? 1 : .34}"
      ${dash ? `stroke-dasharray="${dash}"` : ""}/>`);
  });
  // the throw, dashed like a handoff, so a tile says where the ball goes the
  // same way the play screen does
  const arc = throwArc(p);
  if (arc) o.push(`<polyline points="${poly(throwPts(arc))}" fill="none"
    stroke="${col.handoff}" stroke-width="2.4" stroke-linejoin="round"
    stroke-linecap="round" stroke-dasharray="3 2"/>`);
  for (const k in p.spots){
    const sp = p.spots[k], c = tx(sp.x, sp.y);
    const isBall = k === p.primary;
    const fill = isBall ? "#FFC400"
      : sp.side === "blue" ? "#1D6FD0" : sp.side === "orange" ? "#E4610F" : "#141A16";
    o.push(`<circle cx="${c[0]}" cy="${c[1]}" r="${isBall ? 6.2 : 4.6}" fill="${fill}"
      stroke="#F7F9F6" stroke-width="${isBall ? 2.2 : 1.6}"/>`);
  }
  o.push("</svg>");
  return o.join("");
}
const isRun = p => p.ball.mode === "carry";
/* Fun name if there is one and the coach wants it; otherwise the real name
   is promoted so a tile is never left with nothing to say. Both come through
   the override lookup, so a renamed play reads the same everywhere. */
function nameOf(p){
  const coach = coachNameOf(p), kid = kidNameOf(p);
  return (cfg.funNames && kid)
    ? {big: kid, small: coach}
    : {big: coach, small: ""};
}

/* Play names are the one string in the app a coach can type, so they are the
   one string that has to be escaped before it goes into markup. */
const ESCAPES = {"&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;"};
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ESCAPES[c]);

/* ---------------------------------------------------- fit names to the box
   Sizing in CSS assumes a font's metrics. Offline the webfont is missing and
   the fallback is far wider, so names clipped. Measure and shrink instead. */
function lineCount(el){
  // Count laid-out lines, not pixels. Height maths lies when line-height < 1.
  const r = document.createRange();
  r.selectNodeContents(el);
  const tops = new Set();
  for (const b of r.getClientRects()){
    if (b.height > 0.5) tops.add(Math.round(b.top * 2));
  }
  return tops.size || 1;
}
function fitText(el, minPx, maxLines){
  if (!el) return;
  el.style.fontSize = "";
  let size = parseFloat(getComputedStyle(el).fontSize);
  let guard = 60;
  const over = () => el.scrollWidth > el.clientWidth + 0.5
                  || (maxLines > 0 && lineCount(el) > maxLines);
  while (size > minPx && over() && guard--){
    size -= 1;
    el.style.fontSize = size + "px";
  }
}
/* ------------------------------------------------------ fitting the deck
   fitText() only ever asked a horizontal question: does this name run past the
   side of its box, and does it take more than two lines. Nothing asked the
   vertical one. So on a tight grid — fourteen plays on a 1024x600 tablet, or
   two-up in portrait — a two-line name pushed the block taller than the card,
   and because the card centres its content the clipping landed evenly on the
   top and the bottom: the RUN/PASS row and the formation, the two things a
   coach reads first, while the tagline sat there in full.

   Two things give, in order. The tagline is the only line on a tile that is
   genuinely optional, so it goes first. Then the name shrinks — for the whole
   deck at once, because one size across the grid is what makes it scannable,
   and a name that fit at 26px fits at 20px. */
function tileSpills(t){
  const r = t.getBoundingClientRect(), cs = getComputedStyle(t);
  const lid = r.top + parseFloat(cs.paddingTop);
  const floor = r.bottom - parseFloat(cs.paddingBottom);
  return [...t.querySelectorAll(".kindrow,.kid,.coach,.tag")].some(e => {
    const b = e.getBoundingClientRect();
    return b.height > 0.5 && (b.top < lid - 1 || b.bottom > floor + 1);
  });
}

function fitDeck(){
  const tiles = [...document.querySelectorAll(".tiles .tile")];
  if (!tiles.length) return;
  const tags = tiles.map(t => t.querySelector(".tag")).filter(Boolean);
  tags.forEach(g => { g.style.display = ""; });

  fitNames();                                   // the horizontal fit, as before
  if (!tiles.some(tileSpills)) return;

  tags.forEach(g => { g.style.display = "none"; });
  const kids = tiles.map(t => t.querySelector(".kid"));
  let px = Math.min(...kids.map(e => parseFloat(getComputedStyle(e).fontSize)));
  let guard = 40;
  while (px > 13 && guard-- && tiles.some(tileSpills)){
    px -= 1;
    kids.forEach(e => { e.style.fontSize = px + "px"; });
  }
}

function fitNames(){
  // Fit each name, then drop the whole grid to the smallest of them. One size
  // across the deck scans far faster than fourteen individually-optimal ones,
  // and shrinking is always safe — a name that fit at 30px fits at 22px.
  const kids = [...document.querySelectorAll(".tile .kid")];
  kids.forEach(e => fitText(e, 15, 2));
  if (kids.length){
    const px = Math.min(...kids.map(e => parseFloat(getComputedStyle(e).fontSize)));
    kids.forEach(e => { e.style.fontSize = px + "px"; });
  }
  document.querySelectorAll(".lname b").forEach(e => fitText(e, 11, 1));
  document.querySelectorAll(".titlewrap .kid").forEach(e => fitText(e, 16, 1));
}
let fitT = null;
function refit(){
  clearTimeout(fitT);
  fitT = setTimeout(() => {
    if (S.screen === "deck") renderDeck();      // column count may have changed
    else fitNames();
  }, 90);
}
addEventListener("resize", refit);
addEventListener("orientationchange", refit);

   the menu. The first START on a tablet comes through here on its way to the
   deck; after that the slides live in the menu as Tutorial. Skip and Next
   both count as having seen it. */
function tourMarkers(){
  // wider than a thumbnail: five names in a row need the room, and SNAPPER
  // and THROWER ran into each other at the thumbnail's width
  const W = 480, H = 204, R = 21, y = 84;
  const hex = [0,60,120,180,240,300].map(a => {
    const r = a * Math.PI / 180, d = R * 1.16;
    return `${(Math.sin(r)*d).toFixed(1)},${(-Math.cos(r)*d).toFixed(1)}`;
  }).join(" ");
  const d = R * 1.24, w = R * 1.82;
  const marks = [
    ["WIDE BLUE",   "blue",   `<circle r="${R}"/>`],
    ["SLOT ORANGE", "orange", `<circle r="${R}"/>`],
    ["BACK",        "none",   `<polygon points="0,${-d} ${d},0 0,${d} ${-d},0"/>`],
    ["THROWER",     "none",   `<polygon points="${hex}"/>`],
    ["SNAPPER",     "none",   `<rect x="${-w/2}" y="${-w/2}" width="${w}" height="${w}" rx="3"/>`],
  ];
  const fill = {blue:"#E8F1FC", orange:"#FDEEE4", none:"#fff"};
  return `<svg viewBox="0 0 ${W} ${H}" class="tourmark" aria-hidden="true">
    <rect width="${W}" height="${H}" rx="10" fill="#F7F9F6"/>
    ${marks.map(([name, side, shape], i) => {
      const x = W * (i + 0.5) / marks.length, words = name.split(" ");
      return `<g transform="translate(${x.toFixed(1)} ${y})" fill="${fill[side]}"
                 stroke="${SIDE[side]}" stroke-width="4">${shape}</g>
              <text x="${x.toFixed(1)}" y="${y + R + 26}" fill="${SIDE[side]}">${words[0]}</text>
              ${words[1] ? `<text x="${x.toFixed(1)}" y="${y + R + 48}" fill="${SIDE[side]}">${words[1]}</text>` : ""}`;
    }).join("")}
  </svg>`;
}

/* ---------------------------------------------------------- deck filters
   The same two questions the library answers — run or pass, and which
   situation — asked of the deck a coach actually carries. On the sideline the
   thought is "I need a goal line play", not "I need play 13".

   Deliberately in memory only. A deck filtered to GOAL LINE and then saved
   would have a coach pick the tablet up next week, see two plays and think his
   deck had been eaten. It resets when the app goes back to the intro, and the
   count in the header always says how many of how many are showing. */
let deckF = {kind:"all", cat:"all"};
const deckMatch = (p, f) =>
  (f.kind === "all" || (f.kind === "run") === isRun(p)) &&
  (f.cat === "all" || p.category === f.cat);

// counted as if one facet were changed, so a chip shows what tapping it yields
function deckCount(all, over){
  const f = Object.assign({}, deckF, over);
  return all.reduce((n, p) => n + (deckMatch(p, f) ? 1 : 0), 0);
}

/* Same markup and the same .fchip styling as the library's bar, so the two
   screens do not teach two different controls for the same idea. */
function deckFilterHTML(all, cats){
  const chip = (on, attr, label, n, extra) =>
    `<button class="fchip ${on ? "on" : ""}" ${attr} ${extra || ""}>${label}` +
    (n === null ? "" : `<span class="n">${n}</span>`) + `</button>`;
  return `
    ${chip(deckF.kind === "all",  'data-kind="all"',  "All",  deckCount(all, {kind:"all"}))}
    ${chip(deckF.kind === "run",  'data-kind="run"',  "Run",  deckCount(all, {kind:"run"}))}
    ${chip(deckF.kind === "pass", 'data-kind="pass"', "Pass", deckCount(all, {kind:"pass"}))}
    <span class="lsep"></span>
    ${chip(deckF.cat === "all", 'data-cat="all"', "All situations", null)}
    ${cats.map(k => chip(deckF.cat === k, `data-cat="${k}"`, k, deckCount(all, {cat:k}),
                         `style="--cat:${CAT[k]}"`)).join("")}`;
}

function bindDeckFilters(){
  const f = document.getElementById("dfilt");
  if (f){
    const pick = (key, value) => {
      deckF[key] = value;
      logEvent("deck_filter", {kind: deckF.kind, cat: deckF.cat});
      renderDeck();
    };
    f.querySelectorAll("[data-kind]").forEach(b =>
      b.onclick = () => pick("kind", b.dataset.kind));
    f.querySelectorAll("[data-cat]").forEach(b =>
      b.onclick = () => pick("cat", b.dataset.cat));
  }
  const clear = document.getElementById("dclear");
  if (clear) clear.onclick = () => { deckF = {kind:"all", cat:"all"}; renderDeck(); };
}

function renderDeck(){

  const cats = CAT_ORDER.filter(k => all.some(p => p.category === k));
  const showFilters = cats.length > 1 || all.some(isRun) !== all.every(isRun);
  // columns follow the room available, not just how many plays there are —
  // four columns on a narrow tablet leaves tiles too small to read
  const roomFor = Math.max(1, Math.min(4, Math.floor(innerWidth / 340)));

          <div class="menuwrap">
            <button class="ham" id="ham" aria-label="Menu" aria-haspopup="true"
              aria-expanded="false"><i></i><i></i><i></i></button>
            <div class="menu" id="menu" role="menu" hidden>
              <button id="edit" role="menuitem">Change plays</button>
              <button id="setup" role="menuitem">Setup</button>
              <button id="tour" role="menuitem">Tutorial</button>
              <button id="exit" role="menuitem">Exit</button>
            </div>
          </div>
        </div>
      </div>
      <div class="tiles ${compact ? "compact" : ""}" style="--cols:${cols}">
        ${list.map(p => `
        <button class="tile ${isRun(p) ? "run" : "pass"}" data-id="${p.id}"
          style="--cat:${CAT[p.category]}">
          <span class="tilemain">
            <span class="kindrow">
              <span class="kind">${isRun(p) ? "Run" : "Pass"}</span>
              <span class="catchip">${p.category}</span>
            </span>
            <span class="kid">${esc(nameOf(p).big)}</span>
            <span class="coach">${[esc(nameOf(p).small), p.formation].filter(Boolean).join(" &middot; ")}</span>
            ${compact ? "" : `<span class="tag">${p.tagline}</span>`}
          </span>
          <span class="thumb">${thumbSVG(p)}</span>
        </button>`).join("")}
        ${list.length ? "" : `<div class="lempty">Nothing in your deck matches.
           <button class="fchip" id="dclear">Show all ${all.length}</button></div>`}
      </div>
      <div class="decknote">${list.length
        ? `Tap a play &rarr; line them up &rarr; run it. Tap any player to show
           that kid his own job. Every play mirrors, so this is really
           ${list.length * 2} looks.`
        : `Your deck still has ${all.length} play${all.length === 1 ? "" : "s"} in it.`}</div>
    </div>`;
  bindDeckFilters();
  document.getElementById("edit").onclick = () => { closeMenu(); renderLibrary(); };
  const ham = document.getElementById("ham");
  ham.onclick = () => {
    const open = !ham.parentElement.classList.contains("open");
    closeMenu();
    if (open) openMenu(ham);
  };
  document.getElementById("setup").onclick = () => { closeMenu(); renderSettings(); };
  document.getElementById("tour").onclick = () => { closeMenu(); renderTour(false); };
  document.getElementById("exit").onclick = () => {
    closeMenu(); logEvent("exit_to_intro"); renderIntro();
  };
  const fs = document.getElementById("fs");
  if (fs) fs.onclick = goFullscreen;
  const up = document.getElementById("upd");
  if (up) up.onclick = () => { up.textContent = "Updating"; applyUpdate(); };
  bindClock(); paintClock();
  app.querySelectorAll(".tile").forEach(b =>
    b.addEventListener("click", () => openPlay(b.dataset.id)));
  fitDeck();
}

function seg(key, opts){
  return `<div class="seg" data-key="${key}">` + opts.map(o =>
    `<button data-v="${o[0]}" class="${String(cfg[key]) === String(o[0]) ? "on" : ""}">${o[1]}</button>`
  ).join("") + `</div>`;
}

function logBlob(){
  return JSON.stringify({
    format: "huddleboard.events", v: 1, build: APP_BUILD, device: devId,
    exportedWall: Date.now(), events
  });
}
async function exportLog(btn){
  const text = logBlob(), name = "huddle-log-" + devId + ".json";
  let done = "";
  try {                                    // best: hand it to Android's share sheet
    const f = new File([text], name, {type: "application/json"});
    if (navigator.canShare && navigator.canShare({files: [f]})){
      await navigator.share({files: [f], title: "Huddle Board log"});
      done = "Shared";
    }
  } catch(e){}
  if (!done){
    try { await navigator.clipboard.writeText(text); done = "Copied"; } catch(e){}
  }
  if (!done){
    try {                                  // last resort: a download link
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([text], {type: "application/json"}));
      a.download = name; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      done = "Downloaded";
    } catch(e){ done = "Failed"; }
  }
  btn.textContent = done;
  setTimeout(() => { btn.textContent = "Export"; }, 1800);
}

/* Two taps, never one. These buttons throw away something a coach cannot get
   back, and Setup is exactly where a thumb lands on the way to somewhere else.
   The arming lapses on its own, so a stray first tap costs nothing. */
function confirmTap(id, act){
  const b = document.getElementById(id);
  if (!b) return;
  const was = b.innerHTML;             // the button's own markup, put back on lapse
  b.onclick = () => {
    if (b.dataset.armed){ act(); return; }
    b.dataset.armed = "1"; b.textContent = "Sure?";
    setTimeout(() => {
      if (b.isConnected){ delete b.dataset.armed; b.innerHTML = was; }
    }, 2500);
  };
}

     `<div class="seg"><button id="logexp">Export</button>

    ["Start over", `Puts this tablet back the way it came &mdash; the ${DATA.defaultDeck.length}-play
      starting deck, every play's shipped name, every week's shipped deck and name, and every setting above. The game log is left
      alone; clear that with the row above.`,
     `<div class="seg"><button id="allreset">Reset tablet</button></div>`],
  ];
  app.innerHTML = `
    <div class="deck">
      <div class="deckhead">
        <h1>Settings</h1>
        <div class="dh-right"><button class="edit done" id="sdone">Done</button></div>
      </div>
      <div class="setrows">${rows.map(([t, d, c]) =>
        `<div class="setrow"><div class="setlab"><b>${t}</b><span>${d}</span></div>${c}</div>`
      ).join("")}</div>
      <div class="decknote">Version ${APP_BUILD} &middot; settings and the log live on this
        tablet. Nothing is sent anywhere unless you tap Export.</div>
    </div>`;
  document.getElementById("sdone").onclick = renderDeck;
  document.getElementById("logexp").onclick = e => exportLog(e.currentTarget);
  document.getElementById("syncexp").onclick = e => exportSetup(e.currentTarget);
  const pick = document.getElementById("syncfile");
  document.getElementById("syncimp").onclick = () => pick.click();
  pick.onchange = () => { if (pick.files[0]) importSetup(pick.files[0]); };
  confirmTap("logclr", () => { events = []; flushLog(); renderSettings(); });
  confirmTap("nmreset", () => {
    resetNames(); logEvent("play_rename_reset", {play: "all"}); renderSettings(); });
  confirmTap("pkreset", () => {
    resetPacks(); logEvent("pack_reset", {pack: "all"}); renderSettings(); });
  confirmTap("allreset", () => { resetEverything(); renderSettings(); });
  app.querySelectorAll(".seg").forEach(g => g.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    const key = g.dataset.key, raw = b.dataset.v;
    if (!key || raw === undefined) return;      // Export / Clear / Reset all: not a setting
    cfg[key] = raw === "true" ? true : raw === "false" ? false : Number(raw);
    saveCfg(); logEvent("setting", {key, value: cfg[key]});
    stopClock(); clk.warned = clk.expired = false;
    renderSettings();
  }));
}

/* ---------------------------------------------------------- play library
   Built to stay usable as the library grows. A flat list is fine at 14 plays
   and unusable at 100, so the filters are the primary way in and the list is
   grouped by situation, which is how a coach actually thinks ("I need a goal
   line play"), not by play number. */
let libF = {q:"", kind:"all", cat:"all", deckOnly:false};

const CAT_ORDER = Object.keys(CAT);
const catRank = c => { const i = CAT_ORDER.indexOf(c); return i < 0 ? 99 : i; };
const byCat = (a, b) => catRank(a.category) - catRank(b.category) || a.num - b.num;

function libMatch(p, f){
  if (f.deckOnly && !deck.includes(p.id)) return false;
  if (f.kind !== "all" && (f.kind === "run") !== isRun(p)) return false;
  if (f.cat !== "all" && p.category !== f.cat) return false;
  const q = f.q.trim().toUpperCase();
  if (!q) return true;
  // both the custom names and the shipped ones, so renaming never hides a play
  return [coachNameOf(p), kidNameOf(p), p.coachName, p.kidName, p.formation, p.category]
    .join(" ").toUpperCase().includes(q);
}
// count as if one facet were changed — so a chip shows what tapping it yields
function libCount(over){
  const f = Object.assign({}, libF, over);
  return DATA.plays.reduce((n, p) => n + (libMatch(p, f) ? 1 : 0), 0);
}

function libFilterHTML(){
  const cats = CAT_ORDER.filter(k => DATA.plays.some(p => p.category === k));
  const chip = (on, attr, label, n, extra) =>
    `<button class="fchip ${on ? "on" : ""}" ${attr} ${extra || ""}>${label}` +
    (n === null ? "" : `<span class="n">${n}</span>`) + `</button>`;
  return `
    <input class="lsearch" id="lq" type="search" placeholder="Search plays"
           autocomplete="off" autocorrect="off" spellcheck="false" value="${libF.q}">
    ${chip(libF.kind === "all",  'data-kind="all"',  "All",  libCount({kind:"all"}))}
    ${chip(libF.kind === "run",  'data-kind="run"',  "Run",  libCount({kind:"run"}))}
    ${chip(libF.kind === "pass", 'data-kind="pass"', "Pass", libCount({kind:"pass"}))}
    <span class="lsep"></span>
    ${chip(libF.deckOnly, 'id="lonly"', "In deck", deck.length)}
    <span class="lsep"></span>
    ${chip(libF.cat === "all", 'data-cat="all"', "All situations", null)}
    ${cats.map(k => chip(libF.cat === k, `data-cat="${k}"`, k, libCount({cat:k}),
                         `style="--cat:${CAT[k]}"`)).join("")}`;
}

function renderLibrary(){
  S.screen = "library";
  libF = {q:"", kind:"all", cat:"all", deckOnly:false};

  const rowHTML = p => {
    const on = deck.includes(p.id), nm = nameOf(p);
    return `<button class="lrow ${on ? "on" : ""}" data-id="${p.id}"
              style="--cat:${CAT[p.category]}">
      <span class="lnum">${p.num}</span>
      <span class="lname"><b>${esc(nm.big)}</b><i>${nm.small ? esc(nm.small) + " &middot; " : ""}${p.formation}</i></span>
      <span class="lthumb">${thumbSVG(p)}</span>
      <span class="lkind ${isRun(p) ? "run" : "pass"}">${isRun(p) ? "Run" : "Pass"}</span>
      <span class="lren ${isRenamed(p) ? "on" : ""}" data-ren="${p.id}" role="button"
        tabindex="0" aria-label="Rename ${esc(nameOf(p).big)}" title="Rename">&#9998;</span>
      <span class="lmark">${on ? "&#10003;" : "&#43;"}</span>
    </button>`;
  };

  const drawRows = () => {
    const list = DATA.plays.filter(p => libMatch(p, libF)).sort(byCat);
    const lib = document.getElementById("lib");
    lib.innerHTML = list.length
      ? list.map(rowHTML).join("")
      : `<div class="lempty">No plays match.
           <button class="fchip" id="lclear">Clear filters</button></div>`;
    lib.scrollTop = 0;
    document.getElementById("lcount").textContent = deck.length + " in your deck";
    const pack = packOf();
    document.getElementById("lnote").innerHTML = list.length !== DATA.plays.length
      ? `Showing ${list.length} of ${DATA.plays.length} plays.`
      : pack
      ? `<b>${esc(pack.name)}.</b> ${esc(blurbOf(pack))}`
      : `Tap to add or remove. Keep the deck small &mdash; four plays you can find
         without looking beats ${DATA.plays.length} you have to hunt through.`;
    // after layout settles — row width can still change as the list reflows
    fitNames();
    requestAnimationFrame(fitNames);
    const clear = document.getElementById("lclear");
    if (clear) clear.onclick = () => {
      libF = {q:"", kind:"all", cat:"all", deckOnly:false};
      drawFilters(); drawRows();
    };
    lib.querySelectorAll("[data-ren]").forEach(e => {
      const open = ev => { ev.stopPropagation(); ev.preventDefault();
                           openRename(e.dataset.ren, () => { drawCounts(); drawRows(); }); };
      e.addEventListener("click", open);
      e.addEventListener("keydown", ev => {
        if (ev.key === "Enter" || ev.key === " ") open(ev);
      });
    });
    lib.querySelectorAll(".lrow").forEach(b => b.addEventListener("click", ev => {
      if (ev.target.closest("[data-ren]")) return;   // the pencil, not the row
      const id = b.dataset.id;
      if (deck.includes(id)){
        if (deck.length === 1) return;          // never leave the deck empty
        deck = deck.filter(x => x !== id);
      } else deck.push(id);
      saveDeck(); logEvent("deck_changed", {deck: deck.slice()});
      drawCounts(); drawRows();
    }));
  };

  // counts only — never rebuilds the search box, so typing keeps focus
  const drawCounts = () => {
    const f = document.getElementById("lfilt");
    if (!f) return;
    const set = (sel, n) => { const e = f.querySelector(sel + " .n"); if (e) e.textContent = n; };
    set('[data-kind="all"]',  libCount({kind:"all"}));
    set('[data-kind="run"]',  libCount({kind:"run"}));
    set('[data-kind="pass"]', libCount({kind:"pass"}));
    set('#lonly', deck.length);
    CAT_ORDER.forEach(k => set(`[data-cat="${CSS.escape(k)}"]`, libCount({cat:k})));
    f.querySelectorAll("[data-kind]").forEach(b =>
      b.classList.toggle("on", b.dataset.kind === libF.kind));
    f.querySelectorAll("[data-cat]").forEach(b =>
      b.classList.toggle("on", b.dataset.cat === libF.cat));
    const only = document.getElementById("lonly");
    if (only) only.classList.toggle("on", libF.deckOnly);
    drawPacks();
  };

  /* Play packs: the saved decks a coach starts from — Week 1, Week 2 — each
     one a whole game deck on its own. Taking a pack REPLACES the
     deck, the same way a sync import does and for the same reason: the point
     is a deck somebody chose, not a merge nobody did. So it arms on the first
     tap like everything else that throws a choice away. A pack whose plays
     this library does not have is not offered at all — a deck with holes in
     it is worse than no pack. The strip is rebuilt only when the deck changes,
     so an armed chip survives until it lapses or is taken.

     Save deck and Rename run the other way: the coach's deck, or his name,
     goes INTO a week. Each is the same two taps — the verb, then the week —
     and while a verb is armed the strip wears a label saying which question it
     is asking, so the second tap cannot be mistaken for taking a pack. At rest
     the strip has no label: the chips are the weeks, and a coach who has seen
     "Week 1" once does not need a heading over it again. A mode lapses on its
     own like an armed button does. */
  let mode = "", modeTimer = 0;                 // "" | "save" | "rename"
  const packs = () => packsNow().filter(k => k.plays.every(knownPlay));
  const packOf = () => packs().find(k => sameDeck(k.plays, deck)) || null;
  const blurbOf = k => k.mine ? "Your own deck, saved on this tablet." : k.blurb;
  const drawPacks = () => {
    const el = document.getElementById("packs");
    if (!el) return;
    const list = packs(), cur = packOf(), isCur = k => !!cur && cur.id === k.id;
    const saving = mode === "save", renaming = mode === "rename";
    el.hidden = !list.length;
    el.classList.toggle("saving", saving);
    el.classList.toggle("renaming", renaming);
    el.innerHTML = (mode ? `<span class="plab">${saving ? "Save into" : "Rename"}</span>` : "") + list.map(k =>
      `<button class="pack ${isCur(k) ? "on" : ""} ${k.mine ? "mine" : ""}" id="pack-${k.id}"
         data-pack="${k.id}" title="${esc(blurbOf(k))}">${k.mine ? `<span class="pmark">&#9998;</span>` : ""}${esc(k.name)}<span class="n">${k.plays.length}</span></button>`).join("") +
      `<button class="pack pverb psave ${saving ? "on" : ""}" id="psave">${saving ? "Cancel" : "Save deck"}</button>` +
      `<button class="pack pverb ${renaming ? "on" : ""}" id="prename">${renaming ? "Cancel" : "Rename"}</button>`;
    document.getElementById("psave").onclick = () => setMode(saving ? "" : "save");
    document.getElementById("prename").onclick = () => setMode(renaming ? "" : "rename");
    for (const k of list){
      if (saving){
        document.getElementById("pack-" + k.id).onclick = () => {
          setPack(k.id, deck);
          logEvent("deck_pack_saved", {pack: k.id, deck: deck.slice()});
          setMode(""); drawRows();
        };
      } else if (renaming){
        document.getElementById("pack-" + k.id).onclick = () => {
          setMode("");
          openPackRename(k.id, () => { drawPacks(); drawRows(); });
        };
      } else if (!isCur(k)){                    // already the deck: nothing to take
        confirmTap("pack-" + k.id, () => {
          deck = k.plays.slice(); saveDeck();
          logEvent("deck_pack", {pack: k.id, deck: deck.slice()});
          drawCounts(); drawRows();
        });
      }
    }
  };
  const setMode = m => {
    clearTimeout(modeTimer); mode = m;
    if (m) modeTimer = setTimeout(() => { mode = ""; drawPacks(); }, 6000);
    drawPacks();
  };

  const drawFilters = () => {
    const f = document.getElementById("lfilt");
    f.innerHTML = libFilterHTML();
    const q = document.getElementById("lq");
    q.addEventListener("input", () => { libF.q = q.value; drawCounts(); drawRows(); });
    f.querySelectorAll("[data-kind]").forEach(b => b.onclick = () => {
      libF.kind = b.dataset.kind; drawCounts(); drawRows(); });
    f.querySelectorAll("[data-cat]").forEach(b => b.onclick = () => {
      libF.cat = b.dataset.cat; drawCounts(); drawRows(); });
    document.getElementById("lonly").onclick = () => {
      libF.deckOnly = !libF.deckOnly; drawCounts(); drawRows(); };
  };

  app.innerHTML = `
    <div class="deck">
      <div class="deckhead">
        <h1>Play Library</h1>
        <div class="dh-right">
          ${clockHTML()}
          <p id="lcount"></p>
          <button class="edit done" id="done">Done</button>
        </div>
      </div>
      <div class="lfilt" id="lfilt"></div>
      <div class="packs" id="packs"></div>
      <div class="lib" id="lib"></div>
      <div class="decknote" id="lnote"></div>
    </div>`;
  document.getElementById("done").onclick = renderDeck;
  bindClock(); paintClock();
  drawFilters(); drawPacks(); drawRows();
}
