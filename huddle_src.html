  return n;
}
/* The file, read with suspicion. Returns what will be applied plus a count of
   what was not recognised; throws when it is not a setup file at all. Each
   format's section is read against that format's library and nothing else, so
   a 5-on-5 play id or drawing in the 7-on-7 section is not recognised.
   A v1 file is from before there were formats: it is a 6-on-6 tablet's, and
   it says nothing about the others, which go back to shipped. */
function readSetup(text){
  let o = null;
  try { o = JSON.parse(text); } catch(e){}
  if (!o || o.format !== SETUP_FORMAT || (o.v !== 1 && o.v !== 2)) throw new Error("not a setup file");
  const s = {settings:{}, ourSide:null, dropped:0, modes:{}};
  const sections = o.v === 1 ? {6: o} : o.modes && typeof o.modes === "object" ? o.modes : {};
  for (const key of Object.keys(sections)){
    const n = Number(key), sec = sections[key];
    if (!ALL.formats[n] || !sec || typeof sec !== "object"){ s.dropped++; continue; }
    s.modes[n] = readMode(sec, n, s);
  }
  const st = o.settings && typeof o.settings === "object" ? o.settings : {};
  for (const k of Object.keys(CFG_CHOICES)){
    // a v1 file never had a format to say; that is not something it got wrong
    if (k === "players" && o.v === 1) continue;
    // Older exports predate the remembered view; they start in 2D without
    // reporting a missing preference as an invalid value.
    if (k === "view3d" && !Object.hasOwn(st, k)) continue;
    if (CFG_CHOICES[k].includes(st[k])) s.settings[k] = st[k]; else s.dropped++;
  }
  if (o.ourSide === "blue" || o.ourSide === "orange") s.ourSide = o.ourSide; else s.dropped++;
  return s;
}
// one format's section, against ALL.formats[n]. Misses are counted on s.
function readMode(o, n, s){
  const L = ALL.formats[n];
  // an empty deck in the file is a choice, the same as on the tablet; only a
  // deck that is not there at all is something the file failed to say
  const m = {deck:[], hasDeck: Array.isArray(o.deck), names:{}, plays:{}, packs:{}, packNames:{},
             hidden:[], notes:{}};
  // the plays first, because the deck and the weeks may name them. Each one is
  // a drawing to compile, never a play to trust: it has to be the right shape,
  // and then it has to pass the same checker the designer holds a coach to.
  // This tablet's own plays are no help here — import replaces them.
  if (Array.isArray(o.plays)) for (const raw of o.plays){
    const d = saneDesign(raw, n);
    if (!d || m.plays[d.id] || errorsIn(compileDesign(d, 0)).length){ s.dropped++; continue; }
    m.plays[d.id] = d;
  }
  const shipped = id => typeof id === "string" && L.plays.some(p => p.id === id && !p.custom);
  // hidden plays: shipped ones only, once each. A file that leaves this out
  // hides nothing; a hidden play cannot be in the deck or a week it names
  if (Array.isArray(o.hidden)) for (const id of o.hidden){
    if (shipped(id) && !m.hidden.includes(id)) m.hidden.push(id); else s.dropped++;
  }
  const known = id => (shipped(id) && !m.hidden.includes(id)) || (typeof id === "string" && !!m.plays[id]);
  if (Array.isArray(o.deck)) for (const id of o.deck){
    if (known(id) && !m.deck.includes(id)) m.deck.push(id); else s.dropped++;
  }
  if (o.names && typeof o.names === "object") for (const id of Object.keys(o.names)){
    const nm = o.names[id];
    if (!shipped(id) || !nm || typeof nm !== "object"){ s.dropped++; continue; }
    m.names[id] = {coach: typeof nm.coach === "string" ? nm.coach : "",
                   kid:   typeof nm.kid   === "string" ? nm.kid   : ""};
  }
  // saved weeks: a slot the build knows, holding plays the library has, once each
  if (o.packs && typeof o.packs === "object") for (const id of Object.keys(o.packs)){
    const list = o.packs[id];
    if (!L.packs.some(k => k.id === id) || !Array.isArray(list)){ s.dropped++; continue; }
    const ok = [];
    for (const p of list){ if (known(p) && !ok.includes(p)) ok.push(p); else s.dropped++; }
    // a week that ships empty and is still empty is the file saying so, not a
    // mistake; an empty list for a week that ships full means nothing
    if (ok.length) m.packs[id] = ok;
    else if (!list.length && L.packs.find(k => k.id === id).plays.every(p => m.hidden.includes(p))) continue;
    else s.dropped++;
  }
  // week names: a slot the build knows, and text — tidied and compared on the way in
  if (o.packNames && typeof o.packNames === "object") for (const id of Object.keys(o.packNames)){
    const nm = o.packNames[id];
    if (!L.packs.some(k => k.id === id) || typeof nm !== "string"){ s.dropped++; continue; }
    m.packNames[id] = nm;
  }
  // notes: a play this format has — a hidden one keeps its note — and text,
  // tidied on the way in exactly as a typed one is
  if (o.notes && typeof o.notes === "object") for (const id of Object.keys(o.notes)){
    const t = o.notes[id];
    if (!(shipped(id) || (typeof id === "string" && !!m.plays[id])) || typeof t !== "string"){
      s.dropped++; continue;
    }
    if (tidyNote(t)) m.notes[id] = t;
  }
  return m;
}
function applySetup(s){
  // every format comes from the file: one it does not carry goes back to shipped
  for (const n of FORMAT_IDS){
    loadMode(n);
    const m = s.modes[n] || {deck: DATA.defaultDeck.slice(), hasDeck: true, names:{}, plays:{},
                             packs:{}, packNames:{}, hidden:[], notes:{}};
    // the plays land first, so the deck and the weeks below can resolve them
    designs = Object.assign({}, m.plays); strayDesigns = {};
    saveDesigns(); refreshPlays();
    hidden = new Set(m.hidden); saveHidden();
    if (m.hasDeck){ deck = m.deck.slice(); saveDeck(); } else s.dropped++;
    names = {};
    for (const id of Object.keys(m.names)) setNames(id, m.names[id].coach, m.names[id].kid);
    saveNames();
    notes = {};
    for (const id of Object.keys(m.notes)) setNote(id, m.notes[id]);
    saveNotes();
    // every week comes from the file: a slot it does not fill, or name, goes back to shipped
    resetPacks();
    for (const id of Object.keys(m.packs)) setPack(id, m.packs[id]);
    for (const id of Object.keys(m.packNames)) setPackName(id, m.packNames[id]);
  }
  cfg = Object.assign({}, CFG_DEFAULTS, s.settings); saveCfg();
  loadMode(cfg.players);
  if (s.ourSide) setOurSide(s.ourSide);
  stopClock();
  clk = {at:0, running:false, warned:false, expired:false};
  logEvent("sync_import", {deck: deck.slice(), renamed: renamedCount(), dropped: s.dropped,
                           players: DATA.players});
  flushLog();
}
let syncMsg = "";                 // shown once on the Sync row, then gone
async function exportSetup(btn){
  const text = setupBlob(),
        name = "huddle-setup-" + new Date().toISOString().slice(0, 10) + ".json";
  logEvent("sync_export", {deck: deck.slice(), renamed: renamedCount()});
  let done = "";
  try {                                    // best: the share sheet, Quick Share on it
    const f = new File([text], name, {type: "application/json"});
    if (navigator.canShare && navigator.canShare({files: [f]})){
      await navigator.share({files: [f], title: "Huddle Board setup"});
      done = "Shared";
    }
  } catch(e){                              // the coach closed the sheet: not a failure
    if (e && e.name === "AbortError") done = "Export";
  }
  if (!done){
    try {                                  // otherwise it lands in Downloads
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([text], {type: "application/json"}));
      a.download = name; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      done = "Saved";
    } catch(e){ done = "Failed"; }
  }
  btn.textContent = done;
  setTimeout(() => { if (btn.isConnected) btn.textContent = "Export"; }, 1800);
}
async function importSetup(file){
  let text = "";
  try { text = await file.text(); } catch(e){}
  let s = null;
  try { s = readSetup(text); } catch(e){}
  if (!s){
    syncMsg = "That is not a Huddle Board setup file. Nothing was changed.";
  } else {
    applySetup(s);
    const parts = [`${deck.length}-play deck`,
                   `${renamedCount()} renamed play${renamedCount() === 1 ? "" : "s"}`,
                   `${savedPackCount()} saved week${savedPackCount() === 1 ? "" : "s"}`,
                   `${renamedPackCount()} renamed week${renamedPackCount() === 1 ? "" : "s"}`,
                   `${customCount()} play${customCount() === 1 ? "" : "s"} of your own`,
                   `${notedCount()} play note${notedCount() === 1 ? "" : "s"}`,
                   "settings", `${ourSide.toUpperCase()} sideline`];
    const d = s.dropped;
    syncMsg = "Imported: " + parts.join(", ") + "." +
      (d ? ` ${d} thing${d === 1 ? "" : "s"} in the file ${d === 1 ? "was" : "were"} not recognised and skipped.` : "");
  }
  renderSettings();
}

/* ------------------------------------------------------------ play clock */
let clk = {at:0, running:false, warned:false, expired:false};
function buzz(p){
  if (!cfg.vibrate) return;
  try { navigator.vibrate && navigator.vibrate(p); } catch(e){}
}
function startClock(){
  const wasRunning = clk.running, left = clockLeft();
  clk = {at: performance.now(), running:true, warned:false, expired:false};
  buzz(35);
  // a clock start marks the moment the PREVIOUS play ended — the single most
  // useful boundary for lining this log up against somebody else's
  logEvent("clock_start", {secs: cfg.clockSecs, restart: wasRunning,
                           prevLeftMs: wasRunning ? Math.round(left * 1000) : null});
}
function stopClock(){
  if (clk.running) logEvent("clock_stop", {leftMs: Math.round(clockLeft() * 1000)});
  clk.running = false;
}
function clockLeft(){
  return clk.running ? Math.max(0, cfg.clockSecs - (performance.now() - clk.at) / 1000)
                     : cfg.clockSecs;
}
function clockHTML(){
  if (!cfg.showClock) return "";
  return `<div class="clockwrap">
    <button class="clock" id="clock" aria-label="Play clock">
      <span class="clabel" id="clocklabel">Play clock</span>
      <span class="cnum" id="clocknum">${cfg.clockSecs}</span>
    </button>
    <button class="cstop hidden" id="cstop" aria-label="Stop the clock">&times;</button>
  </div>`;
}
function bindClock(){
  const c = document.getElementById("clock");
  if (c) c.onclick = () => { startClock(); paintClock(); };
  const x = document.getElementById("cstop");
  if (x) x.onclick = () => { stopClock(); paintClock(); };
}
function paintClock(){
  const el = document.getElementById("clocknum");
  if (!el) return;
  const t = clockLeft(), n = Math.ceil(t);
  el.textContent = n;
  const c = document.getElementById("clock");
  const lab = document.getElementById("clocklabel");
  const gone = clk.running && t <= 0;
  c.classList.toggle("run", clk.running && !gone);
  c.classList.toggle("warn", clk.running && t > 5 && t <= cfg.warnAt);
  c.classList.toggle("danger", clk.running && t > 0 && t <= 5);
  c.classList.toggle("gone", gone);
  lab.textContent = gone ? "Snap it" : clk.running ? "Play clock" : "Tap to start";
  document.getElementById("cstop").classList.toggle("hidden", !clk.running);
  if (clk.running && !clk.warned && t <= cfg.warnAt){ clk.warned = true; buzz(60); }
  if (gone && !clk.expired){ clk.expired = true; buzz([120,90,120]); logEvent("clock_expired"); }
}
// CUSTOM is the one situation no shipped play is in: a coach's own play that
// he did not want to file under one of the five. It is last, so it sorts last.
const CAT = {"RUN ZONE":"#127A4D","QUICK GAME":"#1B6BA8","SHOT PLAY":"#8A3AB0",
             "NO-RUN ZONE":"#C9700D","GOAL LINE":"#C0392B","CUSTOM":"#56657A"};
const COMPLEXITY = {simple:"#2A7B50",moderate:"#826C32",advanced:"#7045A0"};
const complexityHTML = p =>
  `<span class="catchip complexity" style="--complex:${COMPLEXITY[p.complexity]}">${p.complexity}</span>`;
// a coach's own play says so, or he cannot tell it from a shipped one in the same colour
const mineChip = p => p.custom ? `<span class="catchip mine">Yours</span>` : "";
const noteMark = p => noteOf(p) ? `<span class="notemark" role="img" aria-label="Has notes" title="Has notes">
  <svg viewBox="0 0 20 20"><path d="M3 2h10l4 4v12H3z" style="fill:var(--ball)" stroke="#9A6E12" stroke-width="1.4" stroke-linejoin="round"/><path d="M13 2v4h4" fill="#9A6E12"/>
  <path d="M6 9h8M6 12h8M6 15h5" stroke="#5A3F08" stroke-width="1.6" stroke-linecap="round"/></svg></span>` : "";
const SIDE = {blue:"#1D6FD0", orange:"#E4610F", none:"#141A16"};
const app = document.getElementById("app");

/* ---------------------------------------------------------- the checker
   PlayChecker.cs, ported line for line, because a coach's own play has to
   pass the same gate as a shipped one and the tablet has no C# on it. It
   reads the play the way the tablet does — spots, paths, calls — so it runs
   unchanged on a shipped play and on a drawn one. DesignerChecks holds that
   it finds exactly what PlayChecker finds on all the shipped plays: two
   copies of one rulebook are only safe while something proves they agree.
   Findings name spots ("WIDE BLUE"), not keys, because a coach reads them. */
const CK = {edge:15.7, goal:15, backfield:-7, minEndGap:3, minLane:1.6, maxExchange:2,
            maxOffLine:0.5, downfield:1.5, speed:6, step:0.06};
const SHAPE_WORDS = ["GO","OUT","IN","SIT","CORNER","POST","WHEEL","SWING","CARRY"];
const EXTRA_VERBS = ["MOTION","FAKE","SNAP","BLOCK-FREE"];
const ydist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
const orElse = (v, f) => v !== 0 ? v : f;
const f1 = v => v.toFixed(1);

function segDist(a, b, c, d){         // shortest distance between ab and cd
  const ux = b[0]-a[0], uy = b[1]-a[1], vx = d[0]-c[0], vy = d[1]-c[1];
  const wx = a[0]-c[0], wy = a[1]-c[1];
  const A = ux*ux + uy*uy, B = ux*vx + uy*vy, C = vx*vx + vy*vy;
  const D = ux*wx + uy*wy, E = vx*wx + vy*wy;
  const den = A*C - B*B;
  let sN = 0, sD = orElse(den, 1), tN = 0, tD = orElse(den, 1);
  if (den < 1e-9){ sN = 0; sD = 1; tN = E; tD = orElse(C, 1); }
  else {
    sN = B*E - C*D; tN = A*E - B*D;
    if (sN < 0){ sN = 0; tN = E; tD = orElse(C, 1); }
    else if (sN > sD){ sN = sD; tN = E + B; tD = orElse(C, 1); }
  }
  if (tN < 0){ tN = 0; sN = A !== 0 ? Math.min(Math.max(-D, 0), A) : 0; sD = orElse(A, 1); }
  else if (tN > tD){ tN = tD; sN = A !== 0 ? Math.min(Math.max(B - D, 0), A) : 0; sD = orElse(A, 1); }
  const sc = Math.abs(sD) > 1e-9 ? sN / sD : 0, tc = Math.abs(tD) > 1e-9 ? tN / tD : 0;
  return Math.hypot(wx + sc*ux - tc*vx, wy + sc*uy - tc*vy);
}
// only the part of a path at or past the crowd at the line
function clipDownfield(pts){
  const segs = [];
  for (let i = 0; i < pts.length - 1; i++)
    if (pts[i][1] >= CK.downfield || pts[i+1][1] >= CK.downfield) segs.push([pts[i], pts[i+1]]);
  return segs;
}
function arcOf(pts){                  // cumulative distance along a path, and its length
  const cum = [0];
  let total = 0;
  for (let i = 0; i < pts.length - 1; i++){ total += ydist(pts[i+1], pts[i]); cum.push(total); }
  return {cum, total};
}
function atDist(pts, cum, d){         // where a kid is once he has run d yards
  if (d <= 0) return pts[0];
  if (d >= cum[cum.length-1]) return pts[pts.length-1];
  for (let i = 0; i < cum.length - 1; i++){
    if (d > cum[i+1]) continue;
    const span = cum[i+1] - cum[i], f = span < 1e-9 ? 0 : (d - cum[i]) / span;
    return [pts[i][0] + f*(pts[i+1][0] - pts[i][0]), pts[i][1] + f*(pts[i+1][1] - pts[i][1])];
  }
  return pts[pts.length-1];
}
function nearestOn(pts, cum, q){      // how far q is from a path, and how far along it
  if (pts.length === 1) return {gap: ydist(q, pts[0]), along: 0};
  let best = Infinity, along = 0;
  for (let i = 0; i < pts.length - 1; i++){
    const a = pts[i], b = pts[i+1], dx = b[0]-a[0], dy = b[1]-a[1], len2 = dx*dx + dy*dy;
    const f = len2 < 1e-9 ? 0 : Math.min(1, Math.max(0, ((q[0]-a[0])*dx + (q[1]-a[1])*dy) / len2));
    const gap = ydist(q, [a[0] + f*dx, a[1] + f*dy]);
    if (gap < best){ best = gap; along = cum[i] + f*Math.sqrt(len2); }
  }
  return {gap: best, along};
}
const trackOrder = t => t === "motion" ? 0 : t === "handoff" ? 1 : 2;
// one kid's segments stitched into the path he actually walks, plus his head start
function playerTrack(paths){
  let segs = paths.slice();
  if (segs.some(q => q.type === "run" || q.type === "route" || q.type === "fake"))
    segs = segs.filter(q => q.type !== "handoff");
  segs.sort((a, b) => trackOrder(a.type) - trackOrder(b.type));   // stable, like OrderBy
  const pts = [];
  let head = 0;
  for (const seg of segs){
    let chunk = seg.pts;
    if (pts.length && ydist(seg.pts[0], pts[pts.length-1]) < 0.4) chunk = chunk.slice(1);
    if (seg.type === "motion") head += arcOf(seg.pts).total;
    pts.push(...chunk);
  }
  return {pts, head};
}
function closestInTime(t1, h1, t2, h2){
  const a1 = arcOf(t1), a2 = arcOf(t2);
  const duration = Math.max(a1.total - h1, a2.total - h2) / CK.speed + 0.4;
  let best = 99, when = 0;
  for (let t = 0; t <= duration; t += CK.step){
    const gap = ydist(atDist(t1, a1.cum, h1 + CK.speed*t), atDist(t2, a2.cum, h2 + CK.speed*t));
    if (gap < best){ best = gap; when = t; }
  }
  return {gap: best, when};
}

function checkPlay(p){
  const out = [];
  const nm = k => (p.spots[k] && p.spots[k].name) || k;
  const err  = (rule, msg, keys) => out.push({level:"error",   rule, msg, keys: keys || []});
  const warn = (rule, msg, keys) => out.push({level:"warning", rule, msg, keys: keys || []});
  const spots = p.spots, keysOf = Object.keys(spots);

  // ---- every spot has exactly one job, and it starts where he stands
  const seen = new Map();
  for (const path of p.paths){
    if (!seen.has(path.who)) seen.set(path.who, []);
    seen.get(path.who).push(path);
  }
  const throws = !p.paths.some(q => q.type === "run" || q.type === "handoff");
  for (const key of keysOf){
    if (seen.has(key)) continue;
    if (key === "QB" && throws) continue;     // the thrower throws
    err("SAFE/no-job", `${nm(key)} has no path — he will stand still while ${
      OTHERS[keysOf.length - 1] || keysOf.length - 1} kids run`, [key]);
  }
  for (const [key, paths] of seen){
    if (!spots[key]){ err("LEGAL/ghost", `${key} is not in this formation`); continue; }
    const first = paths.find(q => q.type === "motion") || paths.find(q => q.type !== "handoff")
               || paths[0];
    const start = first.pts[0], origin = [spots[key].x, spots[key].y];
    if (ydist(start, origin) > 0.35)
      err("SAFE/start", `${nm(key)}'s route starts at (${f1(start[0])}, ${f1(start[1])}) but he ` +
          `lines up at (${f1(origin[0])}, ${f1(origin[1])})`, [key]);
  }

  // ---- motion: one kid at a time, and never toward the line. At the snap he
  // has to be going sideways or back, so his motion stays behind the line and
  // its last leg does not come forward.
  const moving = p.paths.filter(q => q.type === "motion");
  const movers = [...new Set(moving.map(q => q.who))];
  if (movers.length > 1)
    err("LEGAL/motion", `${movers.map(nm).join(" and ")} are both in motion — only one kid ` +
        "may be moving at the snap", movers);
  for (const path of moving){
    const n = path.pts.length, last = path.pts[n-1], before = path.pts[Math.max(0, n-2)];
    if (path.pts.some(q => q[1] > 0) || last[1] > before[1] + 0.05)
      err("LEGAL/motion", `${nm(path.who)} is moving toward the line at the snap — motion goes ` +
          "sideways or back", [path.who]);
  }

  // ---- a handoff starts in the giver's hands and ends in the receiver's, at
  // the same moment
  for (const path of p.paths.filter(q => q.type === "handoff")){
    if (path.to == null){
      err("LEGAL/handoff", `${nm(path.who)} hands the ball to nobody`, [path.who]); continue;
    }
    if (path.to === path.who || !spots[path.to]){
      err("LEGAL/handoff", `${nm(path.who)} hands the ball to somebody who is not on the field`,
          [path.who]); continue;
    }
    const takerPaths = seen.get(path.to);
    if (!takerPaths || !takerPaths.some(q => q.type === "run" || q.type === "route")){
      err("LEGAL/handoff", `${nm(path.to)} takes the ball and has nowhere to run — draw him a run`,
          [path.to]); continue;
    }
    const giver = playerTrack(seen.get(path.who)), taker = playerTrack(takerPaths);
    const gc = arcOf(giver.pts).cum, tc = arcOf(taker.pts).cum;
    const off = nearestOn(giver.pts, gc, path.pts[0]).gap;
    if (off > CK.maxOffLine)
      err("LEGAL/handoff", `${nm(path.who)}'s handoff starts ${f1(off)} yd from anywhere he runs`,
          [path.who]);
    const end = path.pts[path.pts.length-1];
    const along = nearestOn(giver.pts, gc, end).along;
    const when = Math.max(0, (along - giver.head) / CK.speed);
    const there = atDist(taker.pts, tc, taker.head + CK.speed*when);
    const gap = ydist(there, end);
    if (gap > CK.maxExchange)
      err("LEGAL/handoff", `${nm(path.who)} hands off ${f1(when)}s into the play, but ` +
          `${nm(path.to)} is ${f1(gap)} yd away at that moment (needs ${f1(CK.maxExchange)})`,
          [path.who, path.to]);
  }

  // ---- a pitch goes backward. One that goes forward is a forward pass, and
  // the kid who catches it cannot throw another. Only a drawn play can say a
  // handoff is a pitch — the shipped format has no word for it — so this rule
  // never fires on the library and PlayChecker has nothing to mirror.
  for (const path of p.paths.filter(q => q.type === "handoff" && q.pitch)){
    const a = path.pts[0], z = path.pts[path.pts.length-1];
    if (z[1] > a[1] + 0.05)
      err("LEGAL/pitch", `${nm(path.who)}'s pitch to ${nm(path.to)} goes forward — that is a ` +
          "forward pass, so he cannot throw another. Draw his line back behind the thrower",
          [path.who, path.to]);
  }

  // ---- everything stays on the field
  for (const path of p.paths) for (const q of path.pts){
    if (Math.abs(q[0]) > CK.edge)
      err("LEGAL/out", `${nm(path.who)} runs out of bounds`, [path.who]);
    if (q[1] > CK.goal + 4)
      warn("field/deep", `${nm(path.who)} runs past the back of the end zone`, [path.who]);
    if (q[1] < CK.backfield)
      err("field/deep", `${nm(path.who)} drops ${f1(-q[1])} yards behind the line`, [path.who]);
  }

  // ---- ball handling pairs are allowed to be close; nobody else is
  const exempt = new Set(["QB", "C"]);
  for (const path of p.paths)
    if (path.type === "handoff" || path.type === "motion" || path.type === "run") exempt.add(path.who);
  const tracks = {};
  for (const [key, paths] of seen) if (spots[key]) tracks[key] = playerTrack(paths);
  const tk = Object.keys(tracks).sort();          // ordinal, as SortedDictionary
  for (let i = 0; i < tk.length; i++) for (let j = i + 1; j < tk.length; j++){
    const ka = tk[i], kb = tk[j];
    if (exempt.has(ka) && exempt.has(kb)) continue;
    const c = closestInTime(tracks[ka].pts, tracks[ka].head, tracks[kb].pts, tracks[kb].head);
    if (c.gap < CK.minLane)
      err("SAFE/collide", `${nm(ka)} and ${nm(kb)} are ${f1(c.gap)} yd apart ${f1(c.when)}s into ` +
          `the play (needs ${f1(CK.minLane)}) — at 8U that is a pileup`, [ka, kb]);
  }

  // ---- an arrowhead landing on somebody else's line reads as one route
  const routes = p.paths.filter(q => q.type === "route" || q.type === "run");
  for (let i = 0; i < routes.length; i++) for (let j = i + 1; j < routes.length; j++){
    const a = routes[i], b = routes[j];
    if (a.who === b.who || (exempt.has(a.who) && exempt.has(b.who))) continue;
    for (const [lead, other] of [[a, b], [b, a]]){
      const tip = lead.pts[lead.pts.length-1];
      if (tip[1] < CK.downfield) continue;
      const segs = clipDownfield(other.pts);
      if (!segs.length) continue;
      const dd = Math.min(...segs.map(s => segDist(tip, tip, s[0], s[1])));
      if (dd < CK.minEndGap && (lead.end || "arrow") === "arrow")
        warn("SAFE/arrowhead", `${nm(lead.who)}'s arrowhead finishes ${f1(dd)} yd off ` +
             `${nm(other.who)}'s line — hard to tell whose route is whose`, [lead.who, other.who]);
    }
  }

  // ---- the vocabulary: every job must be one of the nine shapes
  for (const [label, job] of p.calls){
    const words = job.replace(/→/g, " ").split(/\s+/).filter(Boolean)
      .map(w => w.replace(/^[ .,—-]+|[ .,—-]+$/g, "").toUpperCase());
    if (words.some(w => SHAPE_WORDS.includes(w) || EXTRA_VERBS.includes(w))) continue;
    if (label === "THROWER" || label === "SNAPPER") continue;
    warn("TEACHABLE/vocab", `${label} is told "${job}" — not one of the nine shapes`,
         keysOf.filter(k => label.split("/").map(x => x.trim()).includes(nm(k))));
  }

  // ---- the call strip must name real spots
  const names = new Set(keysOf.map(nm));
  for (const [label] of p.calls){
    if (label === "EVERYONE ELSE" || label === "BOTH WIDES") continue;
    for (const part of label.split("/").map(x => x.trim()))
      if (!names.has(part)) err("LEGAL/label", `${part} is not a spot in this formation`);
  }

  // ---- category promises. A run that stays behind the line is a thrower
  // rolling out, which is a pass; one that crosses it is running the ball.
  if (p.category === "NO-RUN ZONE" && p.paths.some(q => q.type === "handoff"
        || (q.type === "run" && q.pts.some(pt => pt[1] > 0))))
    err("LEGAL/zone", "filed under NO-RUN ZONE but the ball is run — that is a dead ball");

  // ---- the ball has to end up with somebody, the way the exporter insists
  const b = p.ball || {};
  if (!b.who || !spots[b.who])
    err("LEGAL/ball", "nobody gets the ball — pick who catches it or carries it");
  else if (b.mode !== "carry" && !p.paths.some(q => q.who === b.who))
    err("LEGAL/ball", `${nm(b.who)} is the target but has no route`, [b.who]);
  else if (b.mode !== "carry" && b.legs && b.legs.length){
    // whoever throws it, he throws from where his run ends, and a forward
    // pass from past the line is a flag
    const last = b.legs[b.legs.length - 1], q = p.paths[last.path];
    const from = q && q.pts[q.pts.length - 1];
    if (!from || from[1] > 0)
      err("LEGAL/ball", `${nm(last.who)} throws from past the line — a forward pass has to ` +
          "leave from behind it", [last.who]);
  }
  else if (b.mode === "carry"){
    const legs = b.legs || [];
    const bad = !legs.length || legs[legs.length-1].who !== b.who || legs.some(l => {
      const q = p.paths[l.path];
      return !q || q.who !== l.who || (q.type !== "run" && q.type !== "route");
    });
    if (bad) err("LEGAL/ball", `the ball never reaches ${nm(b.who)}`, [b.who]);
  }
  return out;
}
const errorsIn = p => checkPlay(p).filter(f => f.level === "error");

/* --------------------------------------------------------- a coach's plays
   Drawn on this tablet in the designer, kept on this tablet under hb.plays,
   and never in the build, so an update cannot touch them. What is stored is
   the DESIGN — where six kids stand, the points of each route, who gets the
   ball, and the names — not the play the tablet reads. The play is compiled
   from it on every load, by whichever build is running, so the call strip,
   the per-kid jobs and the handoff are always this build's words for that
   drawing, and a play that arrives in a sync file is numbers and names
   rather than markup somebody else wrote. A design the checker now rejects
   is kept and marked rather than dropped: it is a coach's work, and a
   stricter rule in a later build is a reason to fix it, not to lose it.

   A kid keeps the name his formation gives him wherever he is dragged: he
   was told "you are SLOT ORANGE" in the huddle and the rotation sheet agrees.
   A moved kid's job starts with where to line up instead. */
const DESIGN_V = 1;
const ROUTE_CAP = 10;                    // points per route; a real one needs four
const TAG_CAP = 80;
// where everybody lines up, read off the shipped plays before any of ours join
// them — every format's, because formation names are unique across formats and
// a design names its formation and nothing else
const FORMATIONS = {}, FORMATION_PLAYERS = {};
for (const n of FORMAT_IDS) for (const p of ALL.formats[n].plays)
  if (!FORMATIONS[p.formation]){
    FORMATIONS[p.formation] = JSON.parse(JSON.stringify(p.spots));
    FORMATION_PLAYERS[p.formation] = n;
  }
const FORMATION_ORDER = Object.keys(FORMATIONS);
// the ones a coach can draw from: this format's
const formationsHere = () => FORMATION_ORDER.filter(f => FORMATION_PLAYERS[f] === DATA.players);
const SHAPE_TEACH = {
  GO: "Sprint straight downfield as fast as you can. Do not stop.",
  OUT: "Run to the number, plant, and break toward the sideline.",
  IN: "Run to the number, plant, and break toward the middle.",
  SIT: "Run to the number, stop, and turn around facing the thrower.",
  CORNER: "Run up, then break at an angle toward the deep corner.",
  POST: "Run up, then break at an angle toward the deep middle.",
  WHEEL: "Run out behind the line, get wide, then turn straight up the sideline.",
  SWING: "Loop out of the backfield toward the sideline and look back.",
  CARRY: "You get the ball. Run where the coach points.",
};
const DEFAULT_JOB = "GO. Sprint straight downfield and take your defender with you.";

const isNum = v => typeof v === "number" && isFinite(v);
const isPt = (q, xMax, yMin, yMax) => Array.isArray(q) && q.length === 2 && isNum(q[0]) && isNum(q[1])
  && Math.abs(q[0]) <= xMax && q[1] >= yMin && q[1] <= yMax;
const tidyText = (s, cap) => (typeof s === "string" ? s : "").replace(/\s+/g, " ").trim().slice(0, cap);

/* A design, read with suspicion — from storage or from somebody else's file.
   Returns a clean copy or null. Shape only: whether the play is any GOOD is
   the checker's question, asked of what this returns. A design belongs to the
   format its formation does, and is read as nothing else. */
function saneDesign(o, n = DATA.players){
  if (!o || typeof o !== "object") return null;
  if (typeof o.id !== "string" || !/^u_[a-z0-9]{4,16}$/.test(o.id)) return null;
  const base = FORMATIONS[o.base];
  if (!base || FORMATION_PLAYERS[o.base] !== n) return null;
  const d = {id: o.id, v: DESIGN_V, base: o.base, spots: {}, routes: {}, ball: null,
             coachName: tidyName(o.coachName) || "MY PLAY", kidName: tidyName(o.kidName),
             tagline: tidyText(o.tagline, TAG_CAP),
             category: Object.prototype.hasOwnProperty.call(CAT, o.category) ? o.category : "CUSTOM",
             complexity: Object.prototype.hasOwnProperty.call(COMPLEXITY, o.complexity)
               ? o.complexity : "simple",
             created: isNum(o.created) ? o.created : 0};
  const spots = o.spots && typeof o.spots === "object" ? o.spots : {};
  for (const k of Object.keys(base)){
    if (!isPt(spots[k], 16, -8, 1)) return null;
    d.spots[k] = [spots[k][0], spots[k][1]];
  }
  const routes = o.routes && typeof o.routes === "object" ? o.routes : {};
  for (const k of Object.keys(routes)){
    const r = routes[k];
    if (!base[k] || !r || !Array.isArray(r.pts) || r.pts.length > ROUTE_CAP) return null;
    if (!r.pts.every(q => isPt(q, 17, -8, 20))) return null;
    if (!r.pts.length) continue;
    d.routes[k] = {pts: r.pts.map(q => [q[0], q[1]]), end: r.end === "bar" ? "bar" : "arrow"};
    // the first `motion` points are run before the snap, behind the line, and
    // never by the two kids on the ball
    if (r.motion == null) continue;
    if (!Number.isInteger(r.motion) || r.motion < 1 || r.motion > r.pts.length
        || k === "C" || k === "QB" || r.pts.slice(0, r.motion).some(q => q[1] > 0)) return null;
    d.routes[k].motion = r.motion;
  }
  // only one kid is moving at the snap
  if (Object.values(d.routes).filter(r => r.motion).length > 1) return null;
  const b = o.ball;
  if (b && (b.mode === "pass" || b.mode === "carry") && base[b.who]){
    d.ball = {mode: b.mode, who: b.who};
    // the carriers before the last on a run, in order: each a kid on the
    // field, nobody twice, and the THROWER only first (a keeper that pitches).
    // On a pass, the one kid the THROWER hands or pitches it to, who throws
    // it himself — never the THROWER, who would be taking it back.
    const via = b.via == null ? [] : b.via, pass = b.mode === "pass";
    if (!Array.isArray(via) || via.length > (pass ? 1 : 2)) return null;
    const all = [...via, b.who];
    if (!via.every(k => typeof k === "string" && base[k]) || new Set(all).size !== all.length
        || all.indexOf("QB") > 0 || (pass && via.length && all.includes("QB"))) return null;
    if (via.length) d.ball.via = via.slice();
    if (pass && via.length && b.pitch === true) d.ball.pitch = true;
  } else if (b != null) return null;
  return d;
}

/* What a drawn route is, in the nine shapes. Relative to the kid: OUT is
   toward HIS sideline and IN toward the middle, so the same picture on the
   other side of the ball is the same word. Anything that is not one of the
   nine comes back unnamed, and the checker's vocabulary rule says so. */
function shapeOf(pts, end, side, carrier){
  const lat = dx => dx < 0 ? "blue" : "orange";
  const a = pts[0], z = pts[pts.length-1];
  if (carrier){
    const dx = z[0] - a[0];
    return {word: "CARRY", job: Math.abs(dx) < 2.5 ? "CARRY — straight ahead" : `CARRY to ${lat(dx)}`};
  }
  const segs = [];
  for (let i = 1; i < pts.length; i++) segs.push([pts[i][0] - pts[i-1][0], pts[i][1] - pts[i-1][1]]);
  if (!segs.length) return {word: "GO", job: "GO"};
  // which way is "out" for this kid: his own side, or for a kid on the ball,
  // whichever way he ends up going
  const outSign = side === "blue" ? -1 : side === "orange" ? 1 : Math.sign(z[0] - a[0]) || 1;
  const up = s => s[1] > 0 && Math.abs(s[0]) <= s[1] * 0.4;
  const flat = s => Math.abs(s[1]) <= Math.abs(s[0]) * 0.5;
  const diag = s => s[1] > 0 && !up(s) && !flat(s);
  const depth = q => Math.max(1, Math.round(q[1]));       // yards past the line, as "OUT at 5" means
  const toOut = s => Math.sign(s[0]) === outSign;
  const [s1, s2] = segs;
  if (segs.length === 1){
    if (up(s1) || (diag(s1) && s1[1] >= Math.abs(s1[0])))
      return end === "bar" ? {word: "SIT", job: `SIT at ${depth(z)}`} : {word: "GO", job: "GO"};
    if (flat(s1) && z[1] <= 1.5) return {word: "SWING", job: `SWING to ${lat(s1[0])}`};
    if (flat(s1)) return {word: toOut(s1) ? "OUT" : "IN", job: `${toOut(s1) ? "OUT" : "IN"} at ${depth(z)}`};
  }
  if (segs.length === 2 && up(s1)){
    const w = flat(s2) ? (toOut(s2) ? "OUT" : "IN")
            : diag(s2) ? (toOut(s2) ? "CORNER" : "POST")
            : up(s2) ? "GO" : null;
    if (w === "GO") return end === "bar" ? {word: "SIT", job: `SIT at ${depth(z)}`} : {word: "GO", job: "GO"};
    if (w) return {word: w, job: `${w} at ${depth(pts[1])}`};
  }
  // out of the backfield or along the line first: a SWING stays shallow, a
  // WHEEL turns up the sideline
  if (!up(s1) && Math.abs(s1[0]) >= Math.abs(s1[1]) * 0.8){
    const dx = z[0] - a[0];
    if (z[1] <= 1.5) return {word: "SWING", job: `SWING to ${lat(dx)}`};
    if (up(segs[segs.length-1]) && Math.abs(dx) >= 2) return {word: "WHEEL", job: `WHEEL to ${lat(dx)}`};
  }
  return {word: null, job: "RUN YOUR LINE"};
}

/* Where to stand, for a kid dragged off his formation spot — said against
   the nearest teammate, because that is what a seven-year-old can find. */
function lineupWords(d, key){
  const here = d.spots[key], base = FORMATIONS[d.base];
  let best = null;
  for (const k of Object.keys(d.spots)){
    if (k === key) continue;
    const g = ydist(here, d.spots[k]);
    if (!best || g < best.g) best = {k, g};
  }
  const t = d.spots[best.k], name = base[best.k].name;
  const dx = here[0] - t[0], dy = here[1] - t[1];
  const where = Math.abs(dx) < 1.25 && dy < 0 ? "behind" : Math.abs(dx) < 1.25 ? "in front of"
              : Math.abs(dy) < 1 ? "next to" : "near";
  return `LINE UP ${where} ${name}`;
}
const movedFrom = (d, k) => ydist(d.spots[k], [FORMATIONS[d.base][k].x, FORMATIONS[d.base][k].y]) > 0.25;

/* Where the thrower and the carrier meet, at the same speed the checker
   models: the point on the carrier's run that he reaches at the moment the
   thrower, walking straight at it from the snap, gets there too. A coach
   should never have to draw a handoff; this one passes the exchange rule by
   construction. A runner going past at full speed — the jet man out of his
   motion — is there before the thrower could be, so when they never meet
   that way the thrower steps toward him as far as he gets in the time and
   gives it at the first moment they are within a yard. Null when the run
   never comes within reach at all. */
function meetPoint(from, run){
  const {cum, total} = arcOf(run);
  let passing = null;
  for (let s = 0; s <= total + 1e-9; s += 0.05){
    const q = atDist(run, cum, s), far = ydist(from, q);
    if (s >= far) return q;
    if (!passing && s > 0 && far - s <= 1)
      passing = [from[0] + (q[0] - from[0]) * s / far, from[1] + (q[1] - from[1]) * s / far];
  }
  return passing;
}

/* Where a pitch lands: a soft toss out in front of a runner who is already
   going, so he runs onto it rather than taking it from a hand — PITCH
   RIGHT's 3.7 yards, not a handoff's one. It has to travel backward or
   level, because a pitch that goes forward is a forward pass and the kid who
   catches it could not throw again. The first point on his run that is
   behind the thrower, at least PITCH_MIN away, and that the runner reaches
   within the exchange rule's reach of when the ball does. Failing that, the
   first behind-the-thrower point where they meet, the way a handoff would;
   null when his run never comes back behind him at all. */
const PITCH_MIN = 3, PITCH_LEAD = 1.5;
function pitchPoint(from, run){
  const {cum, total} = arcOf(run);
  let meet = null;
  for (let s = 0; s <= total + 1e-9; s += 0.05){
    const q = atDist(run, cum, s);
    if (q[1] > from[1]) continue;
    const far = ydist(from, q);
    if (far >= PITCH_MIN && s >= far && ydist(atDist(run, cum, far), q) <= PITCH_LEAD) return q;
    if (!meet && s >= far) meet = q;
  }
  return meet;
}

/* What a thrower's drawn line on a pass is called. Not one of the nine
   shapes — those are for kids who catch it — and the thrower's row of the
   call strip is exempt from the vocabulary rule, the same as play 14's
   "roll to blue". Said in colours, never left and right. */
function rollWords(pts){
  const a = pts[0], z = pts[pts.length-1], dx = z[0] - a[0];
  if (Math.abs(dx) >= 2){
    const side = dx < 0 ? "blue" : "orange";
    return {job: `roll to ${side}`,
            teach: `Catch the snap and roll out to the ${side} side, staying behind the line.`};
  }
  return {job: "drop back", teach: "Catch the snap and drop straight back to buy a count."};
}

/* What a kid's motion is called: MOTION, toward a colour, the word the
   shipped plays use. The kid who takes the first handoff out of it is the
   jet man, and the whole play is him being at full speed when he gets there. */
function motionWords(pts, takes){
  const dx = pts[pts.length-1][0] - pts[0][0], side = dx < 0 ? "blue" : "orange";
  const to = Math.abs(dx) >= 1 ? ` to ${side}` : "";
  return {job: `MOTION${to}`,
          teach: `Start moving${to ? ` toward ${side}` : ""} on the coach's signal, before the snap, ` +
                 "and keep going — the ball is snapped while you are moving." +
                 (takes ? " Be at FULL SPEED when you pass the thrower." : "")};
}

/* The second exchange of a reverse: one runner handing to another, both on
   the move. Same model as the checker — everyone from the snap at 6 yd/s — so
   this is the first moment after the previous exchange that the two are
   within a yard of each other, or failing that the closest they ever come.
   The handoff is drawn from one to the other at that moment, which puts its
   start on the giver's line and its end where the taker is, the two things
   the exchange rule asks. Runners that never come close get the closest
   approach anyway, and the checker says how far apart they are. */
function meetRunning(giver, taker, after){
  const ga = arcOf(giver), ta = arcOf(taker);
  const end = Math.max(ga.total, ta.total) / CK.speed;
  let best = null;
  for (let t = after; t <= end + 1e-9; t += 0.02){
    const g = atDist(giver, ga.cum, CK.speed * t), r = atDist(taker, ta.cum, CK.speed * t);
    const gap = ydist(g, r);
    if (gap <= 1) return {t, g, r};
    if (!best || gap < best.gap) best = {t, g, r, gap};
  }
  return best || {t: after, g: giver[giver.length-1], r: taker[0]};
}

// a design compiled into exactly the shape of play the tablet already reads
function compileDesign(d, num){
  const base = FORMATIONS[d.base], keys = Object.keys(base);
  const spots = {};
  for (const k of keys) spots[k] = Object.assign({}, base[k], {x: d.spots[k][0], y: d.spots[k][1]});
  const ball = d.ball, carry = !!ball && ball.mode === "carry", who = ball ? ball.who : "";
  const paths = [], calls = [], assign = {}, jobs = [];
  const name = k => base[k].name;
  // what he runs from the snap: from his spot, or from where his motion left
  // him, and the default rule — GO — when nothing was drawn after it
  const routeOf = k => {
    const r = d.routes[k], m = r && r.motion || 0;
    const from = m ? r.pts[m-1] : d.spots[k], rest = r ? r.pts.slice(m) : [];
    return rest.length ? [from, ...rest] : [from, [from[0], 10]];
  };
  // and what he runs before it
  const motionOf = k => {
    const r = d.routes[k];
    return r && r.motion ? [d.spots[k].slice(), ...r.pts.slice(0, r.motion)] : null;
  };
  // Everyone who has the ball on a run, in order. One on a handoff or a
  // keeper; two or three on a reverse, each handing it to the next where the
  // two of them meet. The THROWER starts the chain standing, unless he is in
  // it himself — a keeper that pitches it.
  // A pass can be thrown by somebody else: the THROWER hands it or pitches it
  // to him, he runs it, stops behind the line and throws — JET PASS. He is
  // the one carrier of a pass, and the ball rides his line the same way.
  const passer = !carry && ball && ball.via ? ball.via[0] : null, pitch = !!passer && !!ball.pitch;
  const carriers = carry ? [...(ball.via || []), who] : passer ? [passer] : [];
  const keeps = carriers[0] === "QB";
  // the exchanges come first, the way the shipped plays list them
  const hands = [];
  let when = 0;
  if (carriers.length && !keeps){
    const run = routeOf(carriers[0]);
    const meet = (pitch ? pitchPoint(d.spots.QB, run) : null) || meetPoint(d.spots.QB, run) || run[run.length-1];
    when = ydist(d.spots.QB, meet) / CK.speed;
    const h = {who:"QB", type:"handoff", pts:[d.spots.QB.slice(), meet], to: carriers[0]};
    if (pitch) h.pitch = true;
    hands.push(paths.push(h) - 1);
  } else hands.push(-1);
  for (let i = 1; i < carriers.length; i++){
    const m = meetRunning(routeOf(carriers[i-1]), routeOf(carriers[i]), when);
    when = m.t;
    hands.push(paths.push({who: carriers[i-1], type:"handoff", pts:[m.g, m.r], to: carriers[i]}) - 1);
  }
  const runIdx = {};
  let moved = false, lazy = 0;
  // A rollout: on a pass, a thrower with a line drawn moves before he throws.
  // It is a run line, the same picture TRIPLE OUT uses, and the ball rides it
  // in his hands and leaves from where it ends — the ball is wherever the kid
  // holding it is. It has to end behind the line; the checker holds that.
  const rolls = !carry && !passer && !!d.routes.QB;
  let rollIdx = -1;
  if (rolls) rollIdx = paths.push({who: "QB", type: "run", pts: routeOf("QB")}) - 1;
  for (const k of keys){
    if (k === "QB" && !carriers.includes("QB")) continue;      // he throws, or hands it off
    const pts = routeOf(k), r = d.routes[k], c = carriers.indexOf(k), isCarrier = c >= 0;
    const mpts = motionOf(k), mo = mpts ? motionWords(mpts, c === 0 && !keeps) : null;
    if (mpts) paths.push({who: k, type: "motion", pts: mpts});
    const path = {who: k, type: isCarrier ? "run" : "route", pts};
    // the kid who throws it stops to throw, so his line ends in a bar
    if ((r && r.end === "bar" && !isCarrier) || k === passer) path.end = "bar";
    const i = paths.push(path) - 1;
    if (isCarrier) runIdx[k] = i;
    const sh = shapeOf(pts, path.end, base[k].side, isCarrier);
    const shift = movedFrom(d, k);
    moved = moved || shift;
    const prev = c > 0 ? carriers[c-1] : null, next = isCarrier ? carriers[c+1] : null;
    const did = k === passer ? `${sh.job}, stop, throw it to ${name(who)}`
              : next ? `${sh.job}, then hand it off` : prev ? `take it from ${name(prev)} and ${sh.job}` : sh.job;
    const job = (shift ? lineupWords(d, k) + ", then " : "") + (mo ? mo.job + ", then " : "") + did;
    if (r || shift || isCarrier || k === who){
      calls.push([name(k), job]); jobs.push(k);
    } else lazy++;
    const start = k === "QB" ? "Catch the snap and keep it. Run your line, both hands on the ball."
                : prev ? `Run your line, and take the ball from ${name(prev)} with both hands when you meet him.`
                : pitch ? "Start running BEFORE you catch it, and catch the pitch on the move."
                : "Take the handoff from the thrower with both hands and run your line.";
    const teach = isCarrier ? start + (next ? ` Then hand it to ${name(next)} coming the other way, ` +
                                              "and keep running after you give it up — sell it."
                                     : k === passer ? ` Stop before you reach the line, set your feet, and ` +
                                              `throw it to ${name(who)}. Run it like it is a run until you stop.` : "")
                : sh.word ? SHAPE_TEACH[sh.word] : "Run the line the coach drew for you.";
    assign[k] = (shift ? lineupWords(d, k) + ". " : "") + (mo ? `${mo.job}. ${mo.teach} Then ` : "") +
      (r || isCarrier ? `${sh.job}. ${teach}` : DEFAULT_JOB) +
      (k === who && !carry ? ` The ball is coming to you${passer ? ` from ${name(passer)}, not the thrower` : ""}.` : "");
  }
  const qbMoved = movedFrom(d, "QB");
  moved = moved || qbMoved;
  if (!carriers.includes("QB")){
    const at = qbMoved ? lineupWords(d, "QB") : "";
    const roll = rolls ? rollWords(routeOf("QB")) : null;
    assign.QB = (at ? at + ". " : "") +
      (pitch ? `Catch the snap and pitch it underhanded to ${name(carriers[0])}, out in front of him so he ` +
               "runs onto it. Soft toss, chest high, and toss it back, never forward."
             : carriers.length ? `Catch the snap, turn, and put the ball in ${name(carriers[0])}'s belly with both hands. Do not watch him run.`
             : roll ? `${roll.teach}${who ? ` Throw it to ${name(who)} when you get there, and get to the sideline if he is covered.` : ""}`
             : who ? `Catch the snap and throw it to ${name(who)}.`
                   : "Catch the snap.");
    if (carriers.length){
      calls.push(["THROWER", (at ? at + ", then " : "") +
                  (pitch ? `soft pitch to ${name(carriers[0])}, out in front` : `hand it to ${name(carriers[0])}, don't watch`)]);
      jobs.push("QB");
    } else if (roll){
      calls.push(["THROWER", (at ? at + ", then " : "") + roll.job]);
      jobs.push("QB");
    } else if (at) calls.push(["THROWER", at]);
  }
  // whoever has the ball, in the order they have it, then the thrower, so the
  // strip reads in the order it matters; everyone else keeps formation order
  const order = carry ? carriers : passer ? [passer, who] : who ? [who] : [];
  const rank = c => {
    const i = order.findIndex(k => c[0] === name(k));
    return i >= 0 ? i : c[0] === "THROWER" ? order.length : order.length + 1;
  };
  calls.sort((x, y) => rank(x) - rank(y));
  if (lazy) calls.push(["EVERYONE ELSE", "GO"]);
  const legs = carriers.length ? carriers.map((k, i) => hands[i] >= 0 ? {who: k, path: runIdx[k], handoff: hands[i]}
                                                                      : {who: k, path: runIdx[k]})
             : rolls ? [{who: "QB", path: rollIdx}] : null;
  return {
    id: d.id, num, custom: true, coachName: d.coachName, kidName: d.kidName,
    category: d.category, complexity: d.complexity,
    formation: d.base + (moved ? " · SHIFTED" : ""),
    tagline: d.tagline || (!who ? "Your own play."
             : passer ? `Your own trick pass: ${name(passer)} throws it to ${name(who)}.`
             : carriers.length > 1 ? `Your own reverse: ${name(carriers[0])} hands it to ${name(who)}.`
             : carry ? `Your own run: ${name(who)} carries it.` : `Your own pass to ${name(who)}.`),
    spots, paths, calls, assign, jobs: [...new Set(jobs)].sort(), primary: who,
    ball: carry ? {mode: "carry", who, legs} : passer ? {mode: "pass", who, thrower: passer, legs}
        : legs ? {mode: "pass", who, legs} : {mode: "pass", who},
  };
}

let designs = {}, strayDesigns = {};
function loadDesigns(){
  designs = {}; strayDesigns = {};
  const byId = storedById("hb.plays", DATA.players);
  for (const id of Object.keys(byId)){
    const d = saneDesign(byId[id]);
    // one this build cannot read is still somebody's work: carried, never shown
    if (d && d.id === id) designs[id] = d; else strayDesigns[id] = byId[id];
  }
}
function saveDesigns(){
  try { localStorage.setItem(myKey("hb.plays"),
          JSON.stringify({v:1, byId: Object.assign({}, strayDesigns, designs)})); } catch(e){}
}
const customCount = () => Object.keys(designs).length;
// the library the rest of the app reads: shipped plays, then the coach's, oldest first
function refreshPlays(){
  const mine = Object.values(designs).sort((a, b) => a.created - b.created)
    .map((d, i) => {
      const p = compileDesign(d, 1001 + i);
      p.problems = errorsIn(p).length;
      return p;
    });
  DATA.plays = DATA.plays.filter(p => !p.custom).concat(mine);
}
const newPlayId = () => "u_" + Math.random().toString(36).slice(2, 10).padEnd(8, "0");
// a play that is gone leaves no hole: out of the deck, out of every saved week
function forgetPlays(ids){
  deck = deck.filter(id => !ids.includes(id));
  saveDeck();
  for (const k of Object.keys(packSaves)){
    const left = packSaves[k].filter(id => !ids.includes(id));
    if (left.length) packSaves[k] = left; else delete packSaves[k];
  }
  savePackSaves();
}
/* A play turned back into a drawing, to save as a new one of his own: most of
   what a coach wants is "22 DIVE, but the slot goes the other way", not a
   blank field. Everyone stands where the play puts him and runs the line it
   draws, and the ball goes to the same kids in the same order. What the
   designer cannot draw does not come across: a fake handoff is gone (his run
   stays, as a route); and
   the exchanges are placed again where the two kids meet, as every drawn
   handoff is. A drawn play copies as the drawing it already is. The names
   come along to be changed; the tagline does not, because it describes the
   original. Null for a play this format cannot draw from. */
function designFrom(p){
  if (designs[p.id]){
    const d = JSON.parse(JSON.stringify(designs[p.id]));
    return Object.assign(d, {id: null, created: 0});
  }
  const base = p.formation, fm = FORMATIONS[base];
  if (!fm || FORMATION_PLAYERS[base] !== DATA.players) return null;
  const d = {id: null, v: DESIGN_V, base, spots: {}, routes: {}, ball: null,
             coachName: coachNameOf(p), kidName: kidNameOf(p), tagline: "",
             category: p.category, complexity: p.complexity, created: 0};
  for (const k of Object.keys(fm)) d.spots[k] = [p.spots[k].x, p.spots[k].y];
  // his motion first, then whatever he runs from the snap
  const lines = p.paths.filter(q => q.type !== "handoff")
    .sort((a, b) => (b.type === "motion") - (a.type === "motion"));
  for (const path of lines){
    const k = path.who;
    const r = d.routes[k] || (d.routes[k] = {pts: [], end: "arrow"});
    r.pts.push(...path.pts.slice(1).map(q => [q[0], q[1]]));
    if (path.type === "motion") r.motion = r.pts.length;
    if (path.end === "bar") r.end = "bar";
  }
  const b = p.ball, legs = (b.legs || []).map(l => l.who);
  if (b.mode === "carry"){
    d.ball = {mode: "carry", who: b.who};
    if (legs.length > 1) d.ball.via = legs.slice(0, -1);
  } else if (b.who){
    d.ball = {mode: "pass", who: b.who};
    if (b.thrower) d.ball.via = [b.thrower];
  }
  return d;
}
// a deleted play takes its note with it; a hidden one keeps it, so forgetPlays does not
function deleteDesign(id){
  delete designs[id]; saveDesigns(); refreshPlays(); forgetPlays([id]); resetNotes([id]);
}
function clearDesigns(){
  const ids = Object.keys(designs).concat(Object.keys(strayDesigns));
  designs = {}; strayDesigns = {}; saveDesigns(); refreshPlays(); forgetPlays(ids); resetNotes(ids);
}

/* ------------------------------------------------------------- formats
   One format at a time: DATA is its library, and the deck, names, weeks and
   drawn plays in memory are its own, read from its own keys. Boot and the
   Setup switch both come through here, so a switch is exactly a fresh start
   in the other format — nothing in memory carries across. */
function loadMode(n){
  DATA = ALL.formats[n] || ALL.formats[6];
  loadDeck(); loadNames(); loadPackSaves(); loadPackNames(); loadNotes(); loadDesigns();
  refreshPlays(); loadHidden();
}

/* ---------------------------------------------------- play thumbnail */
/* same proportions and the same surround / field logic as the full-size
   view, so a tile reads as a small version of the real thing — on a grass
   green field with faint yard lines and hashes, so it reads as football
   before it reads as a diagram. The marks stay faint: routes do the work. */
const TH = {s:9.5, w:346, h:204, cx:173, top:15, edge:15.7, botY:-6.5};
function thumbSVG(p){
  const tx = (x,y) => [TH.cx + x*TH.s, (TH.top - y)*TH.s];
  const poly = pts => pts.map(q => tx(q[0],q[1]).join(",")).join(" ");
  const o = [`<svg viewBox="0 0 ${TH.w} ${TH.h}" class="thumbsvg" aria-hidden="true">`];
  o.push(`<rect x="0" y="0" width="${TH.w}" height="${TH.h}" rx="7" fill="#173A28"/>`);
  const f0 = tx(-TH.edge, TH.top), f1 = tx(TH.edge, TH.botY);
  o.push(`<rect x="${f0[0]}" y="${f0[1]}" width="${f1[0]-f0[0]}" height="${f1[1]-f0[1]}"
    fill="#A4C66A"/>`);
  [-5, 5, 10].forEach(yv => {
    const a = tx(-TH.edge, yv), b = tx(TH.edge, yv);
    o.push(`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#fff"
      stroke-width="1.6" opacity=".85"/>`);
  });
  const hash = [];
  for (let yv = -6; yv <= 14; yv++) for (const xv of [-12.5, 12.5]){
    const a = tx(xv - 0.45, yv), b = tx(xv + 0.45, yv);
    hash.push(`M${a[0]} ${a[1]}H${b[0]}`);
  }
  o.push(`<path d="${hash.join("")}" stroke="#fff" stroke-width="1.3" opacity=".85"/>`);
  const g0 = tx(-TH.edge, 15), g1 = tx(TH.edge, 13.3);
  o.push(`<rect x="${g0[0]}" y="${g0[1]}" width="${g1[0]-g0[0]}" height="${g1[1]-g0[1]}"
    fill="#1B5E3A" fill-opacity=".14"/>`);
  // inset slightly so the whole stroke lands on the field and survives
  // being scaled down to a library row
  [["#1D6FD0",-(TH.edge-0.22)],["#E4610F",TH.edge-0.22]].forEach(([c,xv]) => {
    const a = tx(xv,TH.top), b = tx(xv,TH.botY);
    o.push(`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${c}"
      stroke-width="5"/>`);
  });
  const l1 = tx(-TH.edge,0), l2 = tx(TH.edge,0);
  o.push(`<line x1="${l1[0]}" y1="${l1[1]}" x2="${l2[0]}" y2="${l2[1]}"
    stroke="#58733F" stroke-width="2"/>`);
  const col = {route:"#232B26", run:"#14532D", fake:"#14532D",
               motion:"#C9700D", handoff:"#505C54"};
  p.paths.forEach(pa => {
    const dash = pa.type === "motion" ? '4 3' : pa.type === "fake" ? '5 3'
               : pa.type === "handoff" ? '3 2' : '';
    const strong = p.jobs.includes(pa.who);
    o.push(`<polyline points="${poly(roundPts(pa.pts).pts)}" fill="none" stroke="${col[pa.type]}"
      stroke-width="2" stroke-linejoin="round"
      stroke-linecap="round" opacity="${strong ? 1 : .34}"
      ${dash ? `stroke-dasharray="${dash}"` : ""}/>`);
  });
  // the throw, dashed like a handoff, so a tile says where the ball goes the
  // same way the play screen does
  const arc = throwArc(p);
  if (arc) o.push(`<polyline points="${poly(throwPts(arc))}" fill="none"
    stroke="${col.handoff}" stroke-width="2" stroke-linejoin="round"
    stroke-linecap="round" stroke-dasharray="3 2"/>`);
  for (const k in p.spots){
    const sp = p.spots[k], c = tx(sp.x, sp.y);
    const isBall = k === p.primary;
    const fill = isBall ? "#FFC400"
      : sp.side === "blue" ? "#1D6FD0" : sp.side === "orange" ? "#E4610F" : "#141A16";
    o.push(`<circle cx="${c[0]}" cy="${c[1]}" r="${isBall ? 7.2 : 5.6}" fill="${fill}"
      stroke="#F7F9F6" stroke-width="${isBall ? 2.2 : 1.6}"/>`);
  }
  o.push("</svg>");
  return o.join("");
}
const isRun = p => p.ball.mode === "carry";
/* Fun name if there is one and the coach wants it; otherwise the real name
   is promoted so a tile is never left with nothing to say. Both come through
   the override lookup, so a renamed play reads the same everywhere. */
function nameOf(p){
  const coach = coachNameOf(p), kid = kidNameOf(p);
  return (cfg.funNames && kid)
    ? {big: kid, small: coach}
    : {big: coach, small: ""};
}

/* Play names are the one string in the app a coach can type, so they are the
   one string that has to be escaped before it goes into markup. */
const ESCAPES = {"&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;"};
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ESCAPES[c]);

/* ---------------------------------------------------- fit names to the box
   Sizing in CSS assumes a font's metrics. Offline the webfont is missing and
   the fallback is far wider, so names clipped. Measure and shrink instead. */
function lineCount(el){
  // Count laid-out lines, not pixels. Height maths lies when line-height < 1.
  const r = document.createRange();
  r.selectNodeContents(el);
  const tops = new Set();
  for (const b of r.getClientRects()){
    if (b.height > 0.5) tops.add(Math.round(b.top * 2));
  }
  return tops.size || 1;
}
function fitText(el, minPx, maxLines){
  if (!el) return;
  el.style.fontSize = "";
  let size = parseFloat(getComputedStyle(el).fontSize);
  let guard = 60;
  const over = () => el.scrollWidth > el.clientWidth + 0.5
                  || (maxLines > 0 && lineCount(el) > maxLines);
  while (size > minPx && over() && guard--){
    size -= 1;
    el.style.fontSize = size + "px";
  }
}
/* ------------------------------------------------------ fitting the deck
   fitText() only ever asked a horizontal question: does this name run past the
   side of its box, and does it take more than two lines. Nothing asked the
   vertical one. So on a tight grid — fourteen plays on a 1024x600 tablet, or
   two-up in portrait — a two-line name pushed the block taller than the card,
   and because the card centres its content the clipping landed evenly on the
   top and the bottom: the RUN/PASS row and the formation, the two things a
   coach reads first, while the tagline sat there in full.

   Three things give, in order. The rows around the name drop to their smaller
   sizes (.tight), which is all a short deck of big cards ever needs. The
   tagline is the only line on a tile that is genuinely optional, so it goes
   next. Then the name shrinks — for the whole
   deck at once, because one size across the grid is what makes it scannable,
   and a name that fit at 26px fits at 20px. */
function tileSpills(t){
  const r = t.getBoundingClientRect(), cs = getComputedStyle(t);
  const lid = r.top + parseFloat(cs.paddingTop);
  const floor = r.bottom - parseFloat(cs.paddingBottom);
  return [...t.querySelectorAll(".kindrow,.kid,.coach,.tag")].some(e => {
    const b = e.getBoundingClientRect();
    return b.height > 0.5 && (b.top < lid - 1 || b.bottom > floor + 1);
  });
}

/* The thumb used to be a fixed half of the card's width, whatever the card's
   height, so a big card was a short strip of field with whitespace above and
   below it, and the words got as much room as the play. Now the picture takes
   the bigger of two shapes: beside the words, as tall as the card allows and
   up to THUMB_SIDE of its width; or on top, full width, over a name and a
   formation line. One shape for the whole grid, like one name size. */
const THUMB_SIDE = 0.68;
function layoutTiles(grid, tiles){
  grid.classList.remove("stack");
  grid.style.removeProperty("--thumbw");
  const t = tiles[0], cs = getComputedStyle(t);
  const w = t.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const h = t.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const gap = parseFloat(cs.columnGap) || 0, aspect = TH.w / TH.h;
  const side = Math.max(0, Math.min(h * aspect, THUMB_SIDE * (w - gap)));

  grid.classList.add("stack");
  fitNames();
  const words = Math.max(...tiles.map(e => e.querySelector(".tilemain").offsetHeight));
  const stacked = Math.min(w, (h - words - gap) * aspect);
  if (stacked > side * 1.1) return;
  grid.classList.remove("stack");
  grid.style.setProperty("--thumbw", Math.floor(side) + "px");
}

function fitDeck(){
  const tiles = [...document.querySelectorAll(".tiles .tile")];
  if (!tiles.length) return;
  const tags = tiles.map(t => t.querySelector(".tag")).filter(Boolean);
  tags.forEach(g => { g.style.display = ""; });
  const grid = tiles[0].closest(".tiles");
  grid.classList.remove("tight");
  layoutTiles(grid, tiles);

  fitNames();                                   // the horizontal fit, as before
  if (!tiles.some(tileSpills)) return;
  grid.classList.add("tight");
  fitNames();
  if (!tiles.some(tileSpills)) return;

  tags.forEach(g => { g.style.display = "none"; });
  const kids = tiles.map(t => t.querySelector(".kid"));
  let px = Math.min(...kids.map(e => parseFloat(getComputedStyle(e).fontSize)));
  let guard = 40;
  while (px > 13 && guard-- && tiles.some(tileSpills)){
    px -= 1;
    kids.forEach(e => { e.style.fontSize = px + "px"; });
  }
}

const ONE_LINE = 0.72;
function fitNames(){
  // Fit each name, then drop the whole grid to the smallest of them. One size
  // across the deck scans far faster than fourteen individually-optimal ones,
  // and shrinking is always safe — a name that fit at 30px fits at 22px.
  // One line first: a name that stays on one line at ONE_LINE of its full
  // size is shrunk to fit it, because 22 DIVE beside DOUBLE / SLANT on two
  // lines reads as two different kinds of card. Only a name that cannot —
  // a long real name like PLAY-ACTION CROSS — goes to two lines instead.
  const kids = [...document.querySelectorAll(".tile .kid")];
  kids.forEach(e => {
    e.style.fontSize = "";
    fitText(e, Math.max(15, parseFloat(getComputedStyle(e).fontSize) * ONE_LINE), 1);
    if (lineCount(e) > 1 || e.scrollWidth > e.clientWidth + 0.5) fitText(e, 15, 2);
  });
  if (kids.length){
    const px = Math.min(...kids.map(e => parseFloat(getComputedStyle(e).fontSize)));
    kids.forEach(e => { e.style.fontSize = px + "px"; });
  }
  document.querySelectorAll(".lname b").forEach(e => fitText(e, 11, 1));
  document.querySelectorAll(".titlewrap .kid").forEach(e => fitText(e, 16, 1));
}
let fitT = null;
function refit(){
  clearTimeout(fitT);
  fitT = setTimeout(() => {
    if (S.screen === "deck") renderDeck();      // column count may have changed
    else fitNames();
  }, 90);
}
addEventListener("resize", refit);
addEventListener("orientationchange", refit);

/* ------------------------------------------------- how many on the field

const PLAYERS_SAY = {5: "The snapper, the thrower and three more",
                     6: "The snapper, the thrower and four more",
                     7: "The snapper, the thrower and five more"};
function renderAskPlayers(){
  S.screen = "ask";
  tourFieldOn = false;
  app.innerHTML = `
    <div class="tour askfmt" id="askfmt">

    </div>`;
  app.querySelectorAll("[data-players]").forEach(b => b.onclick = () => {
    const n = Number(b.dataset.players);
    cfg.players = n; saveCfg();
    logEvent("setting", {key: "players", value: n, first: true});
    if (n !== DATA.players) loadMode(n);
    renderTour(true);
  });
}

/* -------------------------------------------------------------- tutorial
   Four slides, each the real thing drawn small beside a few sentences: a
   tile off the coach's own deck, that play's picture, the marker shapes, and
   the menu. The first START on a tablet comes through here on its way to the
   deck; after that the slides live in the menu as Tutorial. Skip and Next
   both count as having seen it. */
function tourMarkers(){
  // wider than a thumbnail: five names in a row need the room, and SNAPPER
  // and THROWER ran into each other at the thumbnail's width
  const W = 480, H = 204, R = 21, y = 84;
  const hex = [0,60,120,180,240,300].map(a => {
    const r = a * Math.PI / 180, d = R * 1.16;
    return `${(Math.sin(r)*d).toFixed(1)},${(-Math.cos(r)*d).toFixed(1)}`;
  }).join(" ");
  const d = R * 1.24, w = R * 1.82;
  const marks = [
    ["WIDE BLUE",   "blue",   `<circle r="${R}"/>`],
    ["SLOT ORANGE", "orange", `<circle r="${R}"/>`],
    ["BACK",        "none",   `<polygon points="0,${-d} ${d},0 0,${d} ${-d},0"/>`],
    ["THROWER",     "none",   `<polygon points="${hex}"/>`],
    ["SNAPPER",     "none",   `<rect x="${-w/2}" y="${-w/2}" width="${w}" height="${w}" rx="3"/>`],
  ];
  const fill = {blue:"#E8F1FC", orange:"#FDEEE4", none:"#fff"};
  return `<svg viewBox="0 0 ${W} ${H}" class="tourmark" aria-hidden="true">
    <rect width="${W}" height="${H}" rx="10" fill="#F7F9F6"/>
    ${marks.map(([name, side, shape], i) => {
      const x = W * (i + 0.5) / marks.length, words = name.split(" ");
      return `<g transform="translate(${x.toFixed(1)} ${y})" fill="${fill[side]}"
                 stroke="${SIDE[side]}" stroke-width="4">${shape}</g>
              <text x="${x.toFixed(1)}" y="${y + R + 26}" fill="${SIDE[side]}">${words[0]}</text>
              ${words[1] ? `<text x="${x.toFixed(1)}" y="${y + R + 48}" fill="${SIDE[side]}">${words[1]}</text>` : ""}`;
    }).join("")}
  </svg>`;
}
function tourTile(p){
  return `<div class="tile ${isRun(p) ? "run" : "pass"}" style="--cat:${CAT[p.category]}">
    <span class="tilemain">
      <span class="kindrow">

        <span class="catchip situation">${p.category}</span>

function tourMenu(){

/* Puts the real play-screen field into the tour and starts the real
   animation loop over it — frame() keeps running it as long as
   tourFieldOn stays true. Nulled out whenever the slide changes, in
   renderTour(), so the loop stops the moment the field leaves the screen. */
let tourFieldOn = false;
function startTourField(play){
  S.play = play;
  S.tl = buildTimeline(play);
  S.stage = "run";
  S.solo = null; S.steps = null; S.step = null;
  mTarget = mAnim = 0;
  S.t0 = performance.now();
  buildScene();
  tourFieldOn = true;
}
function renderTour(first, at = 0){
  S.screen = "tour";
  tourFieldOn = false;
  const slides = tourSlides(), n = slides.length;
  const i = Math.max(0, Math.min(n - 1, at)), s = slides[i], last = i === n - 1;
  app.innerHTML = `
    <div class="tour" data-slide="${i + 1}">
      <div class="tourhead">
        <div>
          <h1>Tutorial</h1>
          <p><b>${i + 1} of ${n}</b> &middot; a quick look at how the app works.
            ${first ? "Skip it any time &mdash; it is in the menu whenever you want it."
                    : "Close it any time."}</p>
        </div>
        <button class="edit" id="tourskip">${first ? "Skip tutorial" : "Close"}</button>
      </div>
      <div class="tourbody">
        <div class="tourart">${s.art}</div>
        <div class="toursay">
          <h1>${s.title}</h1>
          <div class="sub">${s.sub}</div>
          ${s.text}
        </div>
      </div>
      <div class="tourfoot">
        <div class="dots">${slides.map((_, k) => `<i class="${k === i ? "on" : ""}"></i>`).join("")}</div>
        <div class="tourbtns">
          <button class="sbtn" id="tourback" ${i ? "" : "disabled"}>Back</button>
          <button class="sbtn go" id="tournext">${last ? (first ? "Pick plays" : "Done") : "Next"}</button>
        </div>
      </div>
    </div>`;
  if (s.field) startTourField(s.field);
  // The first time through, the way out is the play library, not the deck: a
  // new coach's deck is somebody else's Week 1 until he has chosen, and the
  // library is where he chooses. From the menu he already has a deck to go
  // back to, and that is where he goes.
  const leave = how => {
    markTourSeen();
    logEvent("tour_done", {how, slide: i + 1, first});
    if (first) renderLibrary(true); else renderDeck();
  };
  document.getElementById("tourskip").onclick = () => leave(first ? "skip" : "close");
  document.getElementById("tourback").onclick = () => renderTour(first, i - 1);
  document.getElementById("tournext").onclick = () => last ? leave("done") : renderTour(first, i + 1);
}

/* ---------------------------------------------------------- deck filters
   The same two questions the library answers — run or pass, and which
   situation — asked of the deck a coach actually carries. On the sideline the
   thought is "I need a goal line play", not "I need play 13".

   Deliberately in memory only. A deck filtered to GOAL LINE and then saved
   would have a coach pick the tablet up next week, see two plays and think his
   deck had been eaten. It resets when the app goes back to the intro, and the
   count in the header always says how many of how many are showing. */
let deckF = {kind:"all", cat:"all"};
const deckMatch = (p, f) =>
  (f.kind === "all" || (f.kind === "run") === isRun(p)) &&
  (f.cat === "all" || p.category === f.cat);

// counted as if one facet were changed, so a chip shows what tapping it yields
function deckCount(all, over){
  const f = Object.assign({}, deckF, over);
  return all.reduce((n, p) => n + (deckMatch(p, f) ? 1 : 0), 0);
}

/* Same markup and the same .fchip styling as the library's bar, so the two
   screens do not teach two different controls for the same idea. */
function deckFilterHTML(all, cats){
  const chip = (on, attr, label, n, extra) =>
    `<button class="fchip ${on ? "on" : ""}" ${attr} ${extra || ""}>${label}` +
    (n === null ? "" : `<span class="n">${n}</span>`) + `</button>`;
  return `
    ${chip(deckF.kind === "all",  'data-kind="all"',  "All",  deckCount(all, {kind:"all"}))}
    ${chip(deckF.kind === "run",  'data-kind="run"',  "Run",  deckCount(all, {kind:"run"}))}
    ${chip(deckF.kind === "pass", 'data-kind="pass"', "Pass", deckCount(all, {kind:"pass"}))}
    <span class="lsep"></span>
    ${chip(deckF.cat === "all", 'data-cat="all"', "All situations", null)}
    ${cats.map(k => chip(deckF.cat === k, `data-cat="${k}"`, k, deckCount(all, {cat:k}),
                         `style="--cat:${CAT[k]}"`)).join("")}`;
}

function bindDeckFilters(){
  const f = document.getElementById("dfilt");
  if (f){
    const pick = (key, value) => {
      deckF[key] = value;
      logEvent("deck_filter", {kind: deckF.kind, cat: deckF.cat});
      renderDeck();
    };
    f.querySelectorAll("[data-kind]").forEach(b =>
      b.onclick = () => pick("kind", b.dataset.kind));
    f.querySelectorAll("[data-cat]").forEach(b =>
      b.onclick = () => pick("cat", b.dataset.cat));
  }
  const clear = document.getElementById("dclear");
  if (clear) clear.onclick = () => { deckF = {kind:"all", cat:"all"}; renderDeck(); };
}

/* ------------------------------------------------------------ deck ui */
function renderDeck(){
  S.screen = "deck";
  const all = inDeck();
  const list = all.filter(p => deckMatch(p, deckF));
  // The chips share the top bar with the clock and the menu, so they cost no
  // row of their own. They show whenever there is something to narrow by, and
  // stay away only when every play in the deck would answer both questions
  // the same way — one chip lit with nothing to switch to teaches nothing.
  const cats = CAT_ORDER.filter(k => all.some(p => p.category === k));
  const showFilters = all.length > 0 && (cats.length > 1 || all.some(isRun) !== all.every(isRun));
  // columns follow the room available, not just how many plays there are —
  // four columns on a narrow tablet leaves tiles too small to read
  const roomFor = Math.max(1, Math.min(4, Math.floor(innerWidth / 340)));
  // A short deck in portrait is one column: two-up there makes cards taller
  // than wide, and a field is wider than tall, so half of every card was blank.
  const tall = innerHeight > innerWidth;
  const want = list.length <= 4 ? (tall ? 1 : 2) : list.length <= 9 ? 3 : 4;
  const cols = Math.min(want, roomFor);
  const compact = cols > 2;
  app.innerHTML = `
    <div class="deck">
      <div class="decktop">
        ${showFilters ? `<div class="dfilt" id="dfilt">${deckFilterHTML(all, cats)}</div>` : ""}
        <div class="dh-right">

          ${(!isImmersive() && canFullscreen())
              ? `<button class="edit" id="fs">Full screen</button>` : ""}
          ${clockHTML()}
          <span class="fmt" id="fmt">${esc(DATA.label.toUpperCase())}</span>
          <p>${list.length === all.length
              ? `${all.length} play${all.length === 1 ? "" : "s"}`
              : `${list.length} of ${all.length}`}</p>
          <div class="menuwrap">
            <button class="ham" id="ham" aria-label="Menu" aria-haspopup="true"
              aria-expanded="false"><i></i><i></i><i></i></button>
            <div class="menu" id="menu" role="menu" hidden>
              <button id="edit" role="menuitem">Change plays</button>
              <button id="setup" role="menuitem">Setup</button>
              <button id="tour" role="menuitem">Tutorial</button>
              <button id="exit" role="menuitem">Exit</button>
            </div>
          </div>
        </div>
      </div>
      <div class="tiles ${compact ? "compact" : ""}" style="--cols:${cols}">
        ${list.map(p => `
        <button class="tile ${isRun(p) ? "run" : "pass"}" data-id="${p.id}"
          style="--cat:${CAT[p.category]}">
          <span class="tilemain">
              <span class="kindrow">
                <span class="kind">${isRun(p) ? "Run" : "Pass"}</span>
              <span class="catchip situation">${p.category}</span>
              ${mineChip(p)}${noteMark(p)}
            </span>
            <span class="kid">${esc(nameOf(p).big)}</span>
            <span class="coach">${[esc(nameOf(p).small), esc(p.formation)].filter(Boolean).join(" &middot; ")}</span>
            ${compact ? "" : `<span class="tag">${esc(p.tagline)}</span>`}
          </span>
          <span class="thumb">${thumbSVG(p)}</span>
        </button>`).join("")}
        ${list.length || !all.length ? "" : `<div class="lempty">Nothing in your deck matches.
           <button class="fchip" id="dclear">Show all ${all.length}</button></div>`}
        ${all.length ? "" : `<div class="dempty" id="dempty">
           <h2>Your deck is empty</h2>
           <p>The <b>play library</b> holds every play on this tablet &mdash; the ${DATA.plays.filter(p => !p.custom).length}
             that come with the app and any you draw yourself. Tap a play there to put it in your deck,
             take a week to load a whole game's worth at once, or tap <b>New play</b> to draw your own.</p>
           <button class="start" id="dlib">Open the play library</button>
         </div>`}
      </div>
      <div class="decknote">${list.length
        ? `Tap a play to see it whole &rarr; line them up &rarr; run it. Tap any player to show
           that kid his own job. Every play mirrors, so this is really
           ${list.length * 2} looks.`
        : all.length ? `Your deck still has ${all.length} play${all.length === 1 ? "" : "s"} in it.`
        : `The deck is what you carry into a game &mdash; the plays you can open from here in one tap.`}</div>
    </div>`;
  bindDeckFilters();
  document.getElementById("edit").onclick = () => { closeMenu(); renderLibrary(); };
  const dlib = document.getElementById("dlib");
  if (dlib) dlib.onclick = () => { logEvent("empty_deck_library"); renderLibrary(); };
  const ham = document.getElementById("ham");
  ham.onclick = () => {
    const open = !ham.parentElement.classList.contains("open");
    closeMenu();
    if (open) openMenu(ham);
  };
  document.getElementById("setup").onclick = () => { closeMenu(); renderSettings(); };
  document.getElementById("tour").onclick = () => { closeMenu(); renderTour(false); };
  document.getElementById("exit").onclick = () => {
    closeMenu();
    // An installed launch is its own window, so Exit means leave. The intro is
    // drawn first anyway: if the OS refuses the close, Exit still lands where
    // it always did. In a tab it never closes — that tab is the coach's.
    if (isInstalled()){
      logEvent("exit_app"); flushLog(); renderIntro(); window.close();
      return;
    }
    logEvent("exit_to_intro"); renderIntro();
  };
  const fs = document.getElementById("fs");
  if (fs) fs.onclick = goFullscreen;
  const up = document.getElementById("upd");
  if (up) up.onclick = () => { up.textContent = "Updating"; applyUpdate(); };
  bindClock(); paintClock();
  app.querySelectorAll(".tile").forEach(b =>
    b.addEventListener("click", () => openPlay(b.dataset.id)));
  fitDeck();

function seg(key, opts){
  return `<div class="seg" data-key="${key}">` + opts.map(o =>
    `<button data-v="${o[0]}" class="${String(cfg[key]) === String(o[0]) ? "on" : ""}">${o[1]}</button>`
  ).join("") + `</div>`;
}

function logBlob(){
  return JSON.stringify({
    format: "huddleboard.events", v: 1, build: APP_BUILD, device: devId,
    exportedWall: Date.now(), events
  });
}
async function exportLog(btn){
  const text = logBlob(), name = "huddle-log-" + devId + ".json";
  let done = "";
  try {                                    // best: hand it to Android's share sheet
    const f = new File([text], name, {type: "application/json"});
    if (navigator.canShare && navigator.canShare({files: [f]})){
      await navigator.share({files: [f], title: "Huddle Board log"});
      done = "Shared";
    }
  } catch(e){}
  if (!done){
    try { await navigator.clipboard.writeText(text); done = "Copied"; } catch(e){}
  }
  if (!done){
    try {                                  // last resort: a download link
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([text], {type: "application/json"}));
      a.download = name; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      done = "Downloaded";
    } catch(e){ done = "Failed"; }
  }
  btn.textContent = done;
  setTimeout(() => { btn.textContent = "Export"; }, 1800);
}

/* Two taps, never one. These buttons throw away something a coach cannot get
   back, and Setup is exactly where a thumb lands on the way to somewhere else.
   The arming lapses on its own, so a stray first tap costs nothing. */
function confirmTap(id, act){
  const b = document.getElementById(id);
  if (!b) return;
  const was = b.innerHTML;             // the button's own markup, put back on lapse
  b.onclick = () => {
    if (b.dataset.armed){ act(); return; }
    b.dataset.armed = "1"; b.textContent = "Sure?";
    setTimeout(() => {
      if (b.isConnected){ delete b.dataset.armed; b.innerHTML = was; }
    }, 2500);
  };
}
